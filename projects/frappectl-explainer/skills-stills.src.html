<title>Agent Skills Stills</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap">
<style>
/*TOKENS*/
</style>
<style>
/* Keyframes for the "agent skills" graphic. Agent on top, the two example
   apps at the bottom; the middle is the workflow the agent has to discover.
   Wiki chain = real change-request APIs + statuses (wiki_change_request.py).
   Insights chain = real v3 doctype order (Workbook → Query → Chart → Dashboard). */
:root { color-scheme: light; }
body { margin: 0; background: var(--surface-gray-2); font-family: var(--font-text); padding: 32px 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 640px), 1fr)); gap: 24px; max-width: 1400px; margin: 0 auto; }
.frame { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 10px; border: 1px solid var(--outline-gray-3); }
.lbl { font: 600 13px/1.4 var(--font-mono); color: var(--ink-gray-7); margin-top: 8px; }
.stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transform: scale(var(--s, 0.3));
  background: var(--surface-base); color: var(--ink-gray-9); overflow: hidden; font-family: var(--font-text); }
svg.lucide { stroke-width: 1.75; }

.bar { position: absolute; height: 100px; border-radius: 24px; display: flex; align-items: center; justify-content: center; gap: 20px;
  background: var(--surface-gray-2); border: 2px solid var(--outline-gray-3); font-size: 42px; font-weight: 650; }
.bar svg { width: 50px; height: 50px; color: var(--ink-gray-7); }
.bar.top { top: 36px; left: 80px; right: 80px; }
.bar.bl { bottom: 36px; left: 80px; width: 840px; }
.bar.br { bottom: 36px; right: 80px; width: 840px; }
.col { position: absolute; top: 156px; bottom: 156px; width: 840px; }
.col.l { left: 80px; } .col.r { right: 80px; }
.divider { position: absolute; left: 959px; top: 156px; bottom: 156px; width: 2px; background: var(--outline-gray-2); }
.pipe { position: absolute; top: -20px; bottom: -20px; left: 18px; width: 0; border-left: 4px dashed var(--outline-gray-4); }
.pipe.brand { border-left: 4px solid var(--brand); }
.dim { opacity: 0.35; }
.lb { position: absolute; left: 56px; top: 22px; right: 0; display: flex; align-items: center; justify-content: space-between; font: 600 26px/1 var(--font-text); color: var(--ink-gray-8); }
.lb span { display: inline-flex; align-items: center; gap: 12px; }
.lb em { font-style: normal; font-weight: 500; color: var(--ink-gray-6); }
.lb svg { width: 30px; height: 30px; color: var(--ink-gray-6); }

/* workflow nodes */
.nodes { position: absolute; left: 56px; right: 0; top: 76px; display: grid; gap: 14px; }
.node { position: relative; height: 104px; display: flex; align-items: center; gap: 20px; padding: 0 26px; border-radius: 16px;
  background: var(--surface-gray-1); border: 2px solid var(--outline-gray-3); }
.node.tall { height: 128px; }
.node svg { width: 36px; height: 36px; color: var(--ink-gray-6); flex: none; }
.node .t { display: grid; gap: 8px; flex: 1; min-width: 0; }
.node .n { font: 600 32px/1 var(--font-text); color: var(--ink-gray-9); }
.node .api { font: 500 27px/1 var(--font-mono); color: var(--ink-gray-9); font-variant-ligatures: none; }
.node .d { font: 500 22px/1 var(--font-mono); color: var(--ink-gray-6); }
.node.hi { border-color: var(--brand); background: var(--surface-violet-1); }
.node.q { background: transparent; border-style: dashed; }
.node.q .api, .node.q .n { color: var(--ink-gray-5); letter-spacing: 0.2em; }
.lb .re { display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px; border-radius: 999px; background: var(--surface-amber-2); color: var(--ink-amber-9); font-weight: 600; }
.lb .re svg { color: currentColor; width: 26px; height: 26px; }
.node .tag { font: 600 20px/1 var(--font-text); color: var(--ink-gray-6); text-transform: uppercase; letter-spacing: 0.06em; }
.badge { font: 600 22px/1 var(--font-text); padding: 9px 16px; border-radius: 999px; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px;
  background: var(--surface-gray-3); color: var(--ink-gray-7); }
.badge svg { width: 24px; height: 24px; color: currentColor; }
.badge.blue { background: var(--surface-blue-2); color: var(--ink-blue-8); }
.badge.green { background: var(--surface-green-2); color: var(--ink-green-9); }
.badge.violet { background: var(--surface-violet-2); color: var(--brand-ink); }
.badge.amber { background: var(--surface-amber-2); color: var(--ink-amber-9); }

/* skill card */
.skill { position: absolute; left: 56px; right: 0; top: 200px; border-radius: 20px; border: 2px solid var(--brand); background: var(--surface-violet-1);
  padding: 30px 34px; display: grid; gap: 18px; }
.skill .h { display: flex; align-items: center; gap: 16px; font: 700 34px/1 var(--font-mono); color: var(--ink-gray-9); }
.skill .h svg { width: 40px; height: 40px; color: var(--brand); }
.skill .h small { margin-left: auto; font: 600 22px/1 var(--font-text); color: var(--brand-ink); }
.skill .ln { font: 400 24px/1.45 var(--font-mono); color: var(--ink-gray-7); white-space: pre; }
</style>

<div class="grid" id="grid"></div>

<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
document.documentElement.setAttribute('data-sb-light', '');

const WIKI = [
  ['create_change_request', 'Draft', ''],
  ['create_cr_page', 'Draft', ''],
  ['submit_change_request', 'In Review', 'blue'],
  ['approve_change_request', 'Approved', 'green'],
  ['merge_change_request', 'Merged', 'violet'],
];
const INSIGHTS = [
  ['book-open-check', 'Workbook', 'Insights Workbook', 'first'],
  ['database', 'Query', 'Insights Query v3', ''],
  ['chart-column', 'Chart', 'Insights Chart v3', ''],
  ['layout-dashboard', 'Dashboard', 'Insights Dashboard v3', ''],
];
const SKILL = {
  wiki: ['frappe-wiki/SKILL.md', '1. create_change_request\n2. create_cr_page / update_cr_page\n3. submit → approve → merge'],
  insights: ['frappe-insights/SKILL.md', '1. Workbook first\n2. Query → Chart\n3. Dashboard'],
};

function wiki(s) {
  if (s.skill) return skill('wiki');
  const n = s.wiki || 0;
  return `<div class="nodes">${WIKI.map(([api, st, c], i) => i < n ? `
    ${i === s.qWiki ? `<div class="node q"><i data-lucide="search"></i><div class="t"><span class="api">? ? ?</span></div></div>` : `<div class="node ${s.hiWiki && (i === 2 || i === 4) ? 'hi' : ''}"><i data-lucide="code-xml"></i><div class="t"><span class="api">${api}</span></div><span class="badge ${c}">${st}</span></div>`}` : '').join('')}</div>`;
}
function insights(s) {
  if (s.skill) return skill('insights');
  const n = s.insights || 0;
  return `<div class="nodes">${INSIGHTS.map(([ic, name, dt, tag], i) => i < n ? `
    ${i === s.qIns ? `<div class="node tall q"><i data-lucide="search"></i><div class="t"><span class="n">? ? ?</span></div></div>` : `<div class="node tall ${s.hiIns === i ? 'hi' : ''}"><i data-lucide="${ic}"></i><div class="t"><span class="n">${name}</span><span class="d">${dt}</span></div>${tag ? '<span class="badge amber">created first</span>' : ''}</div>`}` : '').join('')}</div>`;
}
function skill(k) {
  const [path, body] = SKILL[k];
  return `<div class="skill"><div class="h"><i data-lucide="file-text"></i>${path}<small>agent skill</small></div><div class="ln">${body}</div></div>`;
}

function stage(s) {
  // Before "burn tokens" the header is a plain label; on it, the label becomes the amber cost badge.
  const re = (sub) => s.tokens ? `<span class="re"><i data-lucide="coins"></i>reverse engineering</span>`
    : `<span><i data-lucide="scan-search"></i>Reverse engineering <em>· ${sub}</em></span>`;
  return `<div class="stage">
    <div class="bar top"><i data-lucide="bot"></i>Agent</div>
    <div class="col l ${s.focus === 'r' ? 'dim' : ''}"><div class="pipe ${s.skill ? 'brand' : ''}"></div>
      <div class="lb">${s.skill ? '<span><i data-lucide="sparkles"></i>Skill</span>' : re('change requests')}</div>${wiki(s)}</div>
    <div class="divider"></div>
    <div class="col r ${s.focus === 'l' ? 'dim' : ''}"><div class="pipe ${s.skill ? 'brand' : ''}"></div>
      <div class="lb">${s.skill ? '<span><i data-lucide="sparkles"></i>Skill</span>' : re('doctypes &amp; workflows')}</div>${insights(s)}</div>
    <div class="bar bl"><i data-lucide="book-open"></i>Frappe Wiki</div>
    <div class="bar br"><i data-lucide="chart-column-big"></i>Frappe Insights</div>
  </div>`;
}

const FRAMES = [
  [{}, '1 · 0–8.5 "complex workflows… two examples" — Agent on top, the two apps at the bottom, empty middles'],
  [{ wiki: 4, qWiki: 3, focus: 'l' }, '2a · mid-discovery — the next step is a dashed ? ? ? that resolves into the real API name'],
  [{ wiki: 5, hiWiki: 1, focus: 'l' }, '2 · 16.68 APIs · 21.26 change request workflow · 24.76 merge · 25.88 submit for review — Wiki chain, statuses as badges'],
  [{ wiki: 5, insights: 4, hiIns: 3, focus: 'r' }, '3 · 36.88 "created first" · 39.10 query · 40.26 chart · 41.26 dashboard — Insights chain'],
  [{ wiki: 5, insights: 4, tokens: 1 }, '4 · 43.70 "burn tokens" — both headers flip to an amber "reverse engineering" cost badge'],
  [{ skill: 1 }, '5 · 45.34 "encapsulate" · 47.92 "agent skills" — each chain collapses into a SKILL.md card, lines go violet'],
];
document.getElementById('grid').innerHTML = FRAMES.map(([s, l]) => `<div><div class="frame">${stage(s)}</div><div class="lbl">${l}</div></div>`).join('');

const solo = /^#frame(\d+)$/.exec(location.hash);
if (solo) {
  const st = document.querySelectorAll('.stage')[solo[1] - 1];
  st.style.transform = 'none';
  document.body.replaceChildren(st);
  document.body.style.cssText = 'padding:0;margin:0;width:1920px;height:1080px;overflow:hidden;position:relative';
}
const fit = () => document.querySelectorAll('.frame').forEach(f => f.style.setProperty('--s', f.clientWidth / 1920));
new ResizeObserver(fit).observe(document.body); fit();
try { lucide.createIcons(); } catch (e) {}
</script>
