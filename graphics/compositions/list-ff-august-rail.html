<!doctype html>
<html lang="en" data-resolution="landscape" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme/tokens.css" />
    <link rel="stylesheet" href="theme/fonts.css" />
    <style>
      /* ------------------------------------------------------------------
         Agenda list — side rail with a sliding pill (What's New in FF).
         Transparent overlay: one dark card on the left (or right) third.
         A violet pill slides between rows as the VO moves on, so the eye
         follows one object down the list. Finished rows get a check.
         ------------------------------------------------------------------ */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: transparent;
        font-family: var(--font-text);
      }

      .card {
        position: absolute;
        background: color-mix(in srgb, var(--surface-base) 94%, transparent);
        border: 2px solid var(--outline-gray-2);
        border-radius: calc(var(--radius-2xl) * 1.6);
        box-shadow: 0 24px 64px -12px rgb(0 0 0 / 0.5);
        will-change: transform, opacity, filter;
      }
      .eyebrow {
        position: absolute;
        font-size: 30px; font-weight: var(--fw-semibold); letter-spacing: -0.005em;
        color: var(--ink-gray-5);
        white-space: nowrap;
      }
      .pill {
        position: absolute;
        background: var(--brand);
        border-radius: calc(var(--radius-2xl) * 1.1);
        opacity: 0;
      }
      .row {
        position: absolute;
        display: flex; align-items: center; gap: 26px;
        will-change: transform, opacity;
      }
      .badge {
        position: relative; flex: none;
        width: 52px; height: 52px; border-radius: var(--radius-full);
        display: flex; align-items: center; justify-content: center;
        font-size: 24px; font-weight: var(--fw-semibold);
        font-variant-numeric: tabular-nums;
        color: var(--ink-gray-6);
        background: var(--surface-gray-2);
      }
      .badge .on {  /* white disc used while the pill sits on the row */
        position: absolute; inset: 0; border-radius: inherit;
        background: var(--on-brand);
        opacity: 0;
      }
      .badge .n { position: relative; }
      .badge .check {
        position: absolute; width: 28px; height: 28px;
        color: var(--violet-400); opacity: 0;
      }
      .label {
        font-size: 42px; font-weight: var(--fw-semibold); letter-spacing: -0.02em;
        color: var(--ink-gray-9);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main"
         data-start="0" data-duration="27.6" data-fps="30"
         data-width="1920" data-height="1080">
      <div class="clip" id="stage"
           data-start="0" data-duration="27.6" data-track-index="0"
           style="position:absolute; inset:0;">
        <div class="card" id="card">
          <div class="eyebrow" id="eyebrow"></div>
          <div class="pill" id="pill"></div>
        </div>
      </div>

      <audio id="vo" src="assets/index-list.wav"
             data-start="0" data-duration="26.733" data-track-index="1" data-volume="1"></audio>
    </div>

    <script>
      // ---------------------------------------------------------------- knobs
      const CFG = {
        side: "left",    // "left" | "right"
        eyebrow: "On the list today",
        items: [
          "Disable Apps",
          "Doc Events in Recorder",
          "Awesome Bar Search Hook",
          "Custom SVG Icons",
        ],
        // VO word starts: First 2.10, Second 7.04, Third 13.78, And last 20.46
        cues: [2.10, 7.04, 13.78, 20.46],
        lead: 0.2,
        dimTo: 0.45,
        inAt: 0.3,
        exitAt: 26.95,

        // geometry (px)
        width: 700,
        margin: 72,      // distance from the frame edge
        pad: 22,
        headH: 84,
        rowH: 108,
      };
      const DUR = 27.6; // keep in sync with data-duration on #root and #stage

      // ------------------------------------------------------------- curves
      function bezier(x1, y1, x2, y2) {
        const c = (a, b, t) => 3 * (1 - t) * (1 - t) * t * a + 3 * (1 - t) * t * t * b + t * t * t;
        return (x) => {
          let lo = 0, hi = 1, t = x;
          for (let i = 0; i < 30; i++) {
            t = (lo + hi) / 2;
            if (c(x1, x2, t) < x) lo = t; else hi = t;
          }
          return c(y1, y2, t);
        };
      }
      const easeInOut = bezier(0.77, 0, 0.175, 1);
      const easeOut = bezier(0.23, 1, 0.32, 1);
      const easeOutMirror = bezier(0.68, 0, 0.77, 0);
      const SPRING_DUR = 0.8;
      const omega = (2 * Math.PI) / 0.4;
      const spring = (p) => {
        const t = p * SPRING_DUR;
        return p >= 1 ? 1 : 1 - (1 + omega * t) * Math.exp(-omega * t);
      };

      // ------------------------------------------------------------- layout
      const n = CFG.items.length;
      const cardH = CFG.pad + CFG.headH + n * CFG.rowH + CFG.pad;
      const cardX = CFG.side === "right" ? 1920 - CFG.margin - CFG.width : CFG.margin;
      const cardY = Math.round((1080 - cardH) / 2);
      const rowY = (i) => CFG.pad + CFG.headH + i * CFG.rowH;
      const inset = 14; // pill inset inside the card
      const fromX = CFG.side === "right" ? 56 : -56; // enter from the near edge

      const card = document.getElementById("card");
      Object.assign(card.style, { left: cardX + "px", top: cardY + "px", width: CFG.width + "px", height: cardH + "px" });
      const eyebrow = document.getElementById("eyebrow");
      eyebrow.textContent = CFG.eyebrow;
      Object.assign(eyebrow.style, { left: CFG.pad + 26 + "px", top: CFG.pad + 30 + "px" });
      const pill = document.getElementById("pill");
      Object.assign(pill.style, {
        left: inset + "px", top: "0px",
        width: CFG.width - inset * 2 - 4 + "px", height: CFG.rowH - 8 + "px",
      });
      const pillY = (i) => rowY(i) + 4;

      const CHECK = '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
      const rows = CFG.items.map((text, i) => {
        const row = document.createElement("div");
        row.className = "row";
        Object.assign(row.style, { left: CFG.pad + 18 + "px", top: rowY(i) + "px", height: CFG.rowH + "px" });
        row.innerHTML =
          `<div class="badge"><span class="on"></span><span class="n">${i + 1}</span>${CHECK}</div>` +
          `<div class="label"></div>`;
        row.querySelector(".label").textContent = text;
        card.appendChild(row);
        return {
          row,
          on: row.querySelector(".on"),
          n: row.querySelector(".n"),
          check: row.querySelector(".check"),
          label: row.querySelector(".label"),
        };
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;

      // --- entry: card from the near edge, rows cascade in after it
      tl.fromTo(card, { x: fromX, scale: 0.97, opacity: 0, filter: "blur(8px)" },
        { x: 0, scale: 1, duration: SPRING_DUR, ease: spring }, CFG.inAt);
      tl.to(card, { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: easeOut }, CFG.inAt);
      const cascade = [eyebrow, ...rows.map((r) => r.row)];
      tl.fromTo(cascade, { x: fromX / 2, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: easeOut, stagger: 0.07 }, CFG.inAt + 0.15);

      // --- the pill walks the list
      const setActive = (r, at) => {
        tl.to(r.label, { opacity: 1, color: "var(--on-brand)", duration: 0.3, ease: easeOut }, at);
        tl.to(r.on, { opacity: 1, duration: 0.3, ease: easeOut }, at);
        tl.to(r.n, { opacity: 1, color: "var(--brand)", duration: 0.3, ease: easeOut }, at);
      };
      const setDone = (r, at) => {
        tl.to(r.label, { opacity: CFG.dimTo, color: "var(--ink-gray-9)", duration: 0.3, ease: easeOut }, at);
        tl.to(r.on, { opacity: 0, duration: 0.25, ease: easeOut }, at);
        tl.to(r.n, { opacity: 0, duration: 0.15, ease: easeOut }, at);
        tl.fromTo(r.check, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: easeOut }, at + 0.1);
      };

      CFG.cues.forEach((cue, i) => {
        const at = cue - CFG.lead;
        if (i === 0) {
          gsap.set(pill, { y: pillY(0) });
          tl.fromTo(pill, { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.35, ease: easeOut }, at);
          tl.to(rows.slice(1).map((r) => r.label), { opacity: CFG.dimTo, duration: 0.35, ease: easeOut }, at);
        } else {
          tl.to(pill, { y: pillY(i), duration: 0.55, ease: easeInOut }, at);
          setDone(rows[i - 1], at + 0.05);
        }
        setActive(rows[i], at + (i === 0 ? 0 : 0.25));
      });

      // --- exit: retrace the entry toward the near edge
      tl.to([...cascade].reverse(), { x: fromX / 2, opacity: 0, duration: 0.25, ease: easeOutMirror, stagger: 0.03 }, CFG.exitAt - 0.2);
      tl.to(pill, { opacity: 0, duration: 0.2, ease: easeOutMirror }, CFG.exitAt - 0.2);
      tl.to(card, { x: fromX, scale: 0.97, opacity: 0, filter: "blur(8px)", duration: 0.35, ease: easeOutMirror }, CFG.exitAt);
    </script>
  </body>
</html>
