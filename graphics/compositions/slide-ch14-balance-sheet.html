<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme/fonts.css" />
    <style>
      /* ------------------------------------------------------------------
         Chapter 14 — GizmoWorld's opening balance sheet, redrawn from the
         spreadsheet on screen with the SAME numbers, and performed as the
         narration walks it:
           A  (src 0:33–1:16)  rows cascade in · Temporary Opening = the
              balancing plug that auto-zeroes · totals count to 80,000 on
              both sides · "=" badge · "Closed balance sheet" pill
           B  (src 1:36–2:26)  a reading highlight follows the tree walk ·
              each account gets the TOOL that will post its opening balance
              (Stock Reconciliation ✓ / Opening Invoice tool / Journal Entry)
         The composition starts at SOURCE 00:33.00 and runs 113s; cues are
         source − 33.0. The editor cuts back to the facecam for 1:16–1:35
         ("not mandatory on day one") — the graphic holds still there.
         Bottom-left ~440×320 is kept clear for the facecam PIP.
         ------------------------------------------------------------------ */
      :root {
        --card-bg: #ececec;
        --panel: #ffffff;
        --line: #d6d6d6;
        --ink: #212121;
        --ink-muted: #6f6f6f;
        --accent: #0a8df7;
        --accent-soft: #e0f0fe;
        --accent-ink: #0b6fc2;
        --ok: #14783f;
        --ok-soft: #dcf5e7;
        --font-text: "Inter", system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: transparent;
        font-family: var(--font-text);
        color: var(--ink);
      }
      .stage { position: absolute; inset: 0; overflow: hidden; background: var(--card-bg); }
      .grid {
        position: absolute; inset: 0;
        background-image: radial-gradient(#d2d2d2 1.5px, transparent 1.5px);
        background-size: 48px 48px;
        opacity: 0.5;
      }

      .title {
        position: absolute; left: 140px; top: 72px;
        will-change: opacity, transform;
      }
      .title h1 { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
      .title p  { margin-top: 10px; font-size: 22px; font-weight: 500; color: #5c5c5c; }

      .panel {
        position: absolute;
        border-radius: 20px;
        background: var(--panel);
        border: 1.5px solid var(--line);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04), 0 28px 48px -28px rgba(33, 33, 33, 0.22);
        overflow: hidden;
        will-change: transform, opacity;
      }
      .panel .head {
        position: absolute; left: 0; right: 0; top: 0; height: 56px;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 28px;
        font-size: 24px; font-weight: 600; letter-spacing: -0.01em;
        color: var(--ink-muted);
        border-bottom: 1.5px solid var(--line);
      }
      .panel .head small { font-size: 20px; font-weight: 500; }
      .row {
        position: absolute; left: 0; right: 0;
        display: flex; align-items: center;
        padding: 0 28px;
        font-size: 24px; font-weight: 500;
        will-change: transform, opacity;
      }
      .row .hl { position: absolute; inset: 3px 12px; border-radius: 10px; background: var(--accent-soft); opacity: 0; }
      .row .ring { position: absolute; inset: 2px 11px; border-radius: 10px; border: 2px solid var(--accent); opacity: 0; }
      .row > span { position: relative; }
      .row .name { flex: 0 0 320px; white-space: nowrap; }
      .row.group { height: 44px; }
      .row.group .name { font-weight: 600; letter-spacing: -0.012em; }
      .row.child { height: 52px; }
      .row.child .name { padding-left: 24px; color: #3a3a3a; }
      .row .val {
        flex: 0 0 140px; text-align: right;
        font-variant-numeric: tabular-nums; font-weight: 600;
        letter-spacing: -0.01em; color: var(--ink);
      }
      .row .tag { flex: 1; display: flex; justify-content: flex-end; }
      .row.total {
        height: 68px; font-weight: 600; font-size: 25px;
        background: #f7f8fa;
        border-top: 1.5px solid #bdbdbd;
      }
      .row.total .val::after {
        /* the double rule that closes a statement — under the figure only */
        content: ""; position: absolute; left: 0; right: 0; bottom: -9px;
        height: 5px; border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink);
        opacity: 0.6;
      }
      .row.total .val { font-size: 27px; position: relative; top: -4px; }

      .chip {
        display: inline-flex; align-items: center; gap: 7px;
        height: 34px; padding: 0 13px;
        border-radius: 999px;
        font-size: 18px; font-weight: 600; letter-spacing: 0;
        white-space: nowrap;
        will-change: transform, opacity;
      }
      .chip svg { width: 18px; height: 18px; }
      .chip.slot { border: 1.5px dashed #bdbdbd; width: 140px; }
      .chip.sr { background: var(--ok-soft); color: var(--ok); }
      .chip.oi { background: var(--accent-soft); color: #0a5aa0; }
      .chip.je { background: #ebebeb; color: var(--ink); }
      .chip.plug { border: 1.5px dashed #bdbdbd; color: var(--ink-muted); font-weight: 500; }
      .chip.zero { background: var(--ok-soft); color: var(--ok); }

      .eq {
        position: absolute; left: 960px; width: 56px; height: 56px; margin-left: -28px;
        border-radius: 50%;
        background: var(--accent); color: #fff;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 10px 24px -6px rgba(10, 141, 247, 0.6);
        will-change: transform, opacity;
      }
      .eq svg { width: 24px; height: 24px; display: block; }

      .pill {
        position: absolute; top: 792px;
        display: inline-flex; align-items: center; gap: 12px;
        height: 66px; padding: 0 26px;
        border-radius: 999px;
        font-size: 26px; font-weight: 600; letter-spacing: -0.005em;
        white-space: nowrap;
        will-change: transform, opacity;
      }
      .pill svg { width: 28px; height: 28px; }
      .pill.dark { background: var(--ink); color: #fff; box-shadow: 0 16px 32px -12px rgba(0, 0, 0, 0.35); }
      .pill.light { background: var(--panel); color: var(--ink); border: 1.5px solid var(--line); }

      .legend {
        position: absolute; top: 900px; left: 560px;
        display: flex; gap: 36px; align-items: center;
        font-size: 22px; font-weight: 500; color: #5c5c5c;
      }
      .legend div { display: flex; align-items: center; gap: 10px; will-change: opacity, transform; }
      .legend i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main"
         data-start="0" data-duration="113" data-fps="30"
         data-width="1920" data-height="1080">
      <div class="stage clip" id="stage"
           data-start="0" data-duration="113" data-track-index="0">
        <div class="grid"></div>
        <div class="title" id="title"><h1>GizmoWorld balance sheet</h1><p>As on 31 December, last year</p></div>
        <div id="panels"></div>
        <div class="eq" id="eq"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="7.5" width="16" height="3" rx="1.5"/><rect x="4" y="13.5" width="16" height="3" rx="1.5"/></svg></div>
        <div class="pill dark" id="pill-closed"></div>
        <div class="pill light" id="pill-prereq"></div>
        <div class="legend" id="legend"></div>
      </div>
    </div>

    <script>
      // ---------------------------------------------------------------- knobs
      const CFG = {
        panel: { top: 168, w: 780, xs: [140, 1000], head: 56, groupRow: 44, childRow: 52, groupGap: 14, totalRow: 68 },
        sides: [
          { title: "Assets", total: 80000, rows: [
            { g: "Fixed Asset" },
            { n: "Electronics",       v: 30000, tool: "je" },
            { g: "Current Asset" },
            { n: "Stock Assets",      v: 7726,  tool: "sr" },
            { n: "Bank Balance",      v: 20000, tool: "je" },
            { n: "Receivables",       v: 10000, tool: "oi" },
            { g: "Loans and Advances" },
            { n: "Deposits",          v: 12274, tool: "je" },
            { n: "Temporary Opening", v: null,  temp: true },
          ]},
          { title: "Liabilities", total: 80000, rows: [
            { g: "Equity" },
            { n: "Retained Earnings", v: 18000, tool: "je" },
            { g: "Current Liabilities" },
            { n: "Accounts Payable",  v: 20000, tool: "oi" },
            { g: "Loans" },
            { n: "Secured Loans",     v: 42000, tool: "je" },
          ]},
        ],
        tools: {
          sr: { label: "Stock Reconciliation", short: "Stock Reco", done: true, color: "#1a9e5c" },
          oi: { label: "Opening Invoice Creation Tool", short: "Opening Invoice", color: "#0a8df7" },
          je: { label: "Journal Entry", short: "Journal Entry", color: "#212121" },
        },

        // cues (seconds, composition-local = source − 33.0)
        t: {
          kicker:    0.80,   // "balance sheet"      34.98
          panels:    5.10,   // "This is how"        38.22
          tempRing:  9.90,   // "temporary account"  42.98
          plug:     15.20,   // "temporary purpose"  48.46
          zero:     22.60,   // "zero"               55.74
          ringOff:  24.40,   // "If you can see"     57.50
          twoSides: 25.80,   // "two sides"          58.86
          sameVal:  28.10,   // "each having same"   61.18
          tally:    32.20,   // "tallying"           65.26
          eighty:   34.50,   // "$80,000"            67.63
          closed:   37.20,   // "closed"             70.30
          prereq:   39.20,   // "prerequisite"       72.30
          segB:     62.60,   // "In the balance sheet" 96.00 — clear A's pills
          // tree walk: [time, side, rowIndex]  (rowIndex -1 = header)
          walk: [
            [64.80, 0, -1], [65.20, 1, -1],          // "asset and liability"  97.88 / 98.28
            [67.40, 0, 0], [68.50, 0, 1],            // fixed asset / electronics
            [70.10, 0, 2], [72.40, 0, 3], [73.00, 0, 4], [73.80, 0, 5],  // current asset / stock / bank / receivables
            [76.10, 0, 6], [76.70, 0, 7],            // loans and advances → deposits
            [79.50, 1, 1], [80.90, 1, 0],            // retained earnings → "equity"
            [82.30, 1, 2], [84.60, 1, 3],            // current liabilities / payables
            [86.40, 1, 4], [87.70, 1, 5],            // loans / secured loans
          ],
          walkOff:  89.60,   // "Now,"               122.74
          // routing: which tool posts which opening balance
          srRow:    91.60,   // "stock assets"       124.68
          srChip:   95.00,   // "stock reconciliation" 128.14
          oiRows:  [100.40, 101.40],   // "receivables" 133.54 / "payables" 134.54
          jeRows:  [104.10, 105.10, 106.10, 107.20, 108.60], // electronics / bank / deposits / retained / secured
          jeChip:  111.50,   // "journal entry"      144.64
          legend:   95.20,
        },
      };

      // ---------------------------------------------------------------- icons
      const ICON = {
        check: `<path d="M20 6 9 17l-5-5"/>`,
        circleCheck: `<circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/>`,
        lock: `<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>`,
        flag: `<path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-7.333-2q-2 0-3.067.8"/>`,
      };
      const svgIcon = (name) =>
        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">${ICON[name]}</svg>`;
      const fmt = (n) => n.toLocaleString("en-US");

      // --------------------------------------------------------------- build
      const P = CFG.panel;
      // rows stack with a breath before every group after the first
      const layout = CFG.sides.map((side) => {
        let y = P.head + 6;
        return side.rows.map((r, i) => {
          if (r.g && i > 0) y += P.groupGap;
          const top = y; y += r.g ? P.groupRow : P.childRow;
          return top;
        }).concat([y]);   // last entry = content bottom
      });
      const PANEL_H = Math.max(...layout.map((l) => l[l.length - 1])) + 8 + P.totalRow;
      const px = (el, o) => Object.assign(el.style, Object.fromEntries(
        Object.entries(o).map(([k, v]) => [k, v + "px"])));

      const panelsEl = document.getElementById("panels");
      const panels = [], heads = [], rowsBy = [], totals = [], totalVals = [];
      let tempRow = null, tempCell = null;
      CFG.sides.forEach((side, si) => {
        const p = document.createElement("div");
        p.className = "panel";
        p.id = "panel-" + si;
        px(p, { left: P.xs[si], top: P.top, width: P.w, height: PANEL_H });
        p.innerHTML = `<div class="head"><span>${side.title}</span><small>USD</small></div>`;
        panelsEl.appendChild(p);
        panels.push(p);
        heads.push(p.querySelector(".head"));

        const rows = [];
        side.rows.forEach((r, ri) => {
          const el = document.createElement("div");
          el.className = "row " + (r.g ? "group" : "child");
          el.id = `row-${si}-${ri}`;
          px(el, { top: layout[si][ri] });
          const val = r.g ? "" : (r.v == null ? "" : fmt(r.v));
          el.innerHTML = `<div class="hl"></div><div class="ring"></div>
            <span class="name">${r.g || r.n}</span>
            <span class="val">${val}</span>
            <span class="tag"></span>`;
          p.appendChild(el);
          rows.push(el);
          if (r.temp) { tempRow = el; tempCell = el.querySelector(".val"); }
        });
        rowsBy.push(rows);

        const tot = document.createElement("div");
        tot.className = "row total";
        tot.id = "total-" + si;
        px(tot, { top: PANEL_H - P.totalRow });
        tot.innerHTML = `<div class="hl"></div><span class="name">Total ${side.title.toLowerCase()}</span><span class="val" id="tv-${si}"></span><span class="tag"></span>`;
        p.appendChild(tot);
        totals.push(tot);
        totalVals.push(tot.querySelector(".val"));
      });
      const rowAt = (si, ri) => (ri < 0 ? heads[si] : rowsBy[si][ri]);
      const hlOf = (el) => el.querySelector(".hl");

      // Temporary Opening: a dashed "balancing plug" chip, then a green 0
      const plug = document.createElement("span");
      plug.className = "chip plug"; plug.textContent = "balancing figure";
      const zero = document.createElement("span");
      zero.className = "chip zero"; zero.innerHTML = `${svgIcon("circleCheck")}<span>0 · auto</span>`;
      tempCell.style.flexBasis = "150px";
      tempCell.style.display = "flex"; tempCell.style.justifyContent = "flex-end";
      tempCell.append(plug, zero);
      // the chips are wider than the value column; let them hang left into the name gap
      [plug, zero].forEach((c) => { c.style.position = "absolute"; c.style.right = "0"; c.style.top = "-17px"; });
      tempCell.style.position = "relative";

      // tool chips (+ dashed slot for the journal-entry rows)
      const chips = { sr: null, oi: [], je: [], jeSlots: [] };
      CFG.sides.forEach((side, si) => side.rows.forEach((r, ri) => {
        if (!r.tool) return;
        const tagEl = rowsBy[si][ri].querySelector(".tag");
        const tool = CFG.tools[r.tool];
        const c = document.createElement("span");
        c.className = "chip " + r.tool;
        c.innerHTML = (tool.done ? svgIcon("check") : "") + `<span>${tool.short}</span>`;
        tagEl.appendChild(c);
        if (r.tool === "sr") chips.sr = c;
        else if (r.tool === "oi") chips.oi.push(c);
        else {
          const s = document.createElement("span");
          s.className = "chip slot";
          s.style.position = "absolute"; s.style.right = "24px"; s.style.top = "9px";
          rowsBy[si][ri].appendChild(s);
          chips.jeSlots.push(s);
          chips.je.push(c);
        }
      }));

      // "=" badge between the two totals rows
      const eq = document.getElementById("eq");
      px(eq, { top: P.top + PANEL_H - P.totalRow / 2 - 28 });

      // bottom pills (segment A) — placed right of the PIP zone
      const pillClosed = document.getElementById("pill-closed");
      pillClosed.innerHTML = `${svgIcon("circleCheck")}<span>Closed balance sheet</span>`;
      px(pillClosed, { left: 560 });
      const pillPrereq = document.getElementById("pill-prereq");
      pillPrereq.innerHTML = `${svgIcon("flag")}<span>Prerequisite for opening balances</span>`;
      px(pillPrereq, { left: 950 });

      // legend (segment B)
      const legend = document.getElementById("legend");
      const legendItems = Object.values(CFG.tools).map((tool) => {
        const d = document.createElement("div");
        d.innerHTML = `<i style="background:${tool.color}"></i><span>${tool.label}${tool.done ? " — done" : ""}</span>`;
        legend.appendChild(d);
        return d;
      });

      // ------------------------------------------------------------ timeline
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      const t = CFG.t;
      const allRows = rowsBy.flat();

      // rest state
      gsap.set(["#title", ...panels, ...allRows, ...totals, eq, pillClosed, pillPrereq,
                plug, zero, chips.sr, ...chips.oi, ...chips.je, ...chips.jeSlots, ...legendItems],
               { autoAlpha: 0 });
      totalVals.forEach((v) => v.textContent = "");

      // ---- A: the sheet arrives
      tl.fromTo("#title", { autoAlpha: 0, y: -12 },
        { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, t.kicker);
      tl.fromTo(panels, { autoAlpha: 0, y: 30, scale: 0.97 },
        { autoAlpha: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out", stagger: 0.12 }, t.panels);
      rowsBy.forEach((rows, si) => {
        tl.fromTo(rows, { autoAlpha: 0, x: -18 },
          { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out", stagger: 0.055 }, t.panels + 0.3 + si * 0.12);
      });
      tl.fromTo(totals, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "power2.out" }, t.panels + 1.0);

      // Temporary Opening — the balancing plug
      tl.to(tempRow.querySelector(".ring"), { opacity: 1, duration: 0.3, ease: "power2.out" }, t.tempRing);
      tl.fromTo(plug, { autoAlpha: 0, x: 10 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, t.plug);
      tl.to(plug, { autoAlpha: 0, scale: 0.9, duration: 0.25, ease: "power2.in" }, t.zero - 0.05);
      tl.fromTo(zero, { autoAlpha: 0, scale: 0.8 }, { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, t.zero);
      tl.to(tempRow.querySelector(".ring"), { opacity: 0, duration: 0.3 }, t.ringOff);

      // two sides, same value, tallying
      tl.to(panels, { borderColor: "#0a8df7", duration: 0.35, ease: "power2.out", stagger: 0.12 }, t.twoSides);
      tl.to(totals.map(hlOf), { opacity: 1, duration: 0.3, ease: "power2.out" }, t.sameVal);
      const counter = { v: 0 };
      tl.to(counter, {
        v: 80000, duration: 1.0, ease: "power2.out", snap: { v: 1 },
        onUpdate: () => totalVals.forEach((el) => el.textContent = fmt(Math.round(counter.v))),
      }, t.sameVal + 0.1);
      tl.fromTo(eq, { autoAlpha: 0, scale: 0.4 }, { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, t.tally);
      totals.forEach((tot) => {
        tl.to(tot, { scale: 1.03, duration: 0.18, ease: "power2.out" }, t.eighty);
        tl.to(tot, { scale: 1, duration: 0.3, ease: "power2.inOut" }, t.eighty + 0.18);
      });
      tl.fromTo(pillClosed, { autoAlpha: 0, y: 18, scale: 0.92 },
        { autoAlpha: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, t.closed);
      tl.fromTo(pillPrereq, { autoAlpha: 0, x: -20 },
        { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out" }, t.prereq);

      // ---- B: clear A's emphasis, then read the tree
      tl.to([pillClosed, pillPrereq, eq], { autoAlpha: 0, duration: 0.35, ease: "power2.in" }, t.segB);
      tl.to(panels, { borderColor: "#d6d6d6", duration: 0.35 }, t.segB);
      tl.to(totals.map(hlOf), { opacity: 0, duration: 0.35 }, t.segB);

      // a single reading highlight that moves row to row
      let prev = null;
      function readAt(time, el) {
        if (prev && prev !== el) {
          if (prev.classList.contains("head")) tl.to(prev, { color: "#6f6f6f", duration: 0.25 }, time);
          else tl.to(hlOf(prev), { opacity: 0, duration: 0.25 }, time);
        }
        if (el.classList.contains("head")) tl.to(el, { color: "#0b6fc2", duration: 0.25 }, time);
        else tl.to(hlOf(el), { opacity: 1, duration: 0.25 }, time);
        prev = el;
      }
      t.walk.forEach(([time, si, ri]) => readAt(time, rowAt(si, ri)));
      // "asset and liability" lights both headers; let the second stay until the first row
      tl.to(heads[0], { color: "#6f6f6f", duration: 0.25 }, t.walk[2][0]);
      tl.to(hlOf(prev), { opacity: 0, duration: 0.3 }, t.walkOff); prev = null;

      // routing: which tool posts which opening balance
      const find = (tool) => { const out = []; CFG.sides.forEach((s, si) => s.rows.forEach((r, ri) => { if (r.tool === tool) out.push(rowsBy[si][ri]); })); return out; };
      const srRow = find("sr")[0], oiRows = find("oi"), jeRows = find("je");

      readAt(t.srRow, srRow);
      tl.fromTo(chips.sr, { autoAlpha: 0, x: 12 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "back.out(1.5)" }, t.srChip);
      tl.fromTo(legendItems, { autoAlpha: 0, y: 10 },
        { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.1 }, t.legend);

      oiRows.forEach((row, i) => {
        readAt(t.oiRows[i], row);
        tl.fromTo(chips.oi[i], { autoAlpha: 0, x: 12 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "back.out(1.5)" }, t.oiRows[i] + 0.05);
      });
      // "rest of the accounts" — each named row opens a dashed slot…
      jeRows.forEach((row, i) => {
        readAt(t.jeRows[i], row);
        tl.fromTo(chips.jeSlots[i], { autoAlpha: 0, x: 10 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power3.out" }, t.jeRows[i] + 0.05);
      });
      // …and "journal entry" fills them all at once
      tl.to(hlOf(prev), { opacity: 0, duration: 0.3 }, t.jeChip); prev = null;
      tl.to(chips.jeSlots, { autoAlpha: 0, duration: 0.2, ease: "power2.in", stagger: 0.04 }, t.jeChip);
      tl.fromTo(chips.je, { autoAlpha: 0, scale: 0.85 },
        { autoAlpha: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)", stagger: 0.06 }, t.jeChip + 0.05);
    </script>
  </body>
</html>
