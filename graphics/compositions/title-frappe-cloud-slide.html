<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme/fonts.css" />
    <style>
      /* ------------------------------------------------------------------
         Slide-up title card. Same palette / type as the bouncing-ball card
         (title-bouncing-ball.html) but no ball and no typing: the headline
         rises from below the frame and settles on the same cap line.
         ------------------------------------------------------------------ */
      :root {
        --card-bg: #ececec;
        --title-ink: #212121;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: transparent;
        font-family: "Inter", system-ui, sans-serif;
      }

      .card {
        position: absolute; inset: 0; overflow: hidden;   /* clips the slide-in */
        background: var(--card-bg);
      }

      .title {
        position: absolute; left: 0; right: 0;
        top: 483px;                 /* cap-height line lands at y = 496 */
        font-size: 100px; line-height: 1;
        font-weight: 700; letter-spacing: 0;
        color: var(--title-ink);
        text-align: center; white-space: pre;
        will-change: transform;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main"
         data-start="0" data-duration="3" data-fps="30"
         data-width="1920" data-height="1080">
      <div class="card clip" id="card"
           data-start="0" data-duration="3" data-track-index="0">
        <div class="title" id="title">frappe.io/cloud</div>
      </div>
    </div>

    <script>
      const CFG = {
        slideFrom: 640,     // px below the resting line at t=0 (fully off-frame)
        slideDur: 0.8,      // seconds to settle
        ease: "expo.out",
      };

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;

      tl.fromTo(
        "#title",
        { y: CFG.slideFrom },
        { y: 0, duration: CFG.slideDur, ease: CFG.ease },
        0
      );
    </script>
  </body>
</html>
