<!doctype html>
<html lang="en" data-resolution="landscape" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme/tokens.css" />
    <link rel="stylesheet" href="theme/fonts.css" />
    <style>
      /* ------------------------------------------------------------------
         "Tutorial and Review" series intro — marketplace pick (direction E4).
         Header lands word-per-beat, a highlighter sweeps behind "Review",
         a grid of app tiles pops in, a selection ring hops tile to tile on
         the beat and lands on the reviewed app. The camera pushes toward
         it, zooms through the tile, and the tile's violet opens like a
         window onto a TRANSPARENT frame, so the footage underneath shows.
         Every cue is on the music's beat grid (176 BPM, see BEAT below).
         ------------------------------------------------------------------ */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: transparent;
        font-family: var(--font-text);
      }

      .card { position: absolute; inset: 0; overflow: hidden; }
      .scene { position: absolute; inset: 0; }
      .bg { position: absolute; inset: 0; background: var(--surface-base); }
      .cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; will-change: transform; }

      /* header */
      .head {
        position: absolute; left: 188px; top: 150px; white-space: nowrap;
        font-size: 104px; font-weight: var(--fw-black); letter-spacing: -0.035em; line-height: 1;
        color: var(--ink-gray-9);
      }
      .head .word { display: inline-block; position: relative; z-index: 1; }
      .mark { display: inline-block; position: relative; margin-left: 0.18em; }
      .hl {
        position: absolute; z-index: 0;
        top: 0.18em; bottom: -0.06em; left: -0.17em; right: -0.21em;
        background: var(--brand); border-radius: 0.1em;
      }

      /* tiles — absolutely placed so the ring and camera can address them */
      .tile {
        position: absolute; width: 280px; height: 280px; border-radius: 44px;
        background: var(--surface-gray-1); border: 2px solid var(--outline-gray-2);
      }
      .tile svg {
        position: absolute; left: 96px; top: 96px; width: 88px; height: 88px;
        fill: none; stroke: var(--ink-gray-4); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;
      }
      .tile .label {
        position: absolute; left: 0; right: 0; top: 168px; text-align: center;
        font-size: 44px; font-weight: var(--fw-bold); letter-spacing: -0.02em; color: var(--ink-gray-9);
        white-space: nowrap; opacity: 0;
      }
      .ring {
        position: absolute; left: 0; top: 0; width: 316px; height: 316px; border-radius: 60px;
        border: 8px solid var(--brand); opacity: 0;
      }

      /* full-frame violet with a rounded-rect hole (evenodd clip path) that grows to transparent */
      .portal { position: absolute; inset: 0; background: var(--brand); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main"
         data-start="0" data-duration="6.8" data-fps="30"
         data-width="1920" data-height="1080">
      <div class="card clip" id="card" data-start="0" data-duration="6.8" data-track-index="0">
        <div class="scene" id="scene">
          <div class="bg"></div>
          <div class="cam" id="cam">
            <h1 class="head" id="head"></h1>
            <div id="tiles"></div>
            <div class="ring" id="ring"></div>
          </div>
        </div>
        <div class="portal" id="portal"></div>
      </div>

      <audio id="music" src="assets/ask-alyf-intro-music.wav"
             data-start="0" data-duration="6.8" data-track-index="1" data-volume="1"></audio>
    </div>

    <script>
      // ---------------------------------------------------------------- knobs
      const CFG = {
        series: ["Tutorial", "and", "Review"], // last word gets the highlighter
        app: "Ask Alyf",
        pick: 6,                 // tile index (0-9, row-major) that holds the app
        hops: [4, 7, 0, 9],      // ring path before it lands on `pick`
        push: 1.5,               // camera scale when it arrives on the picked tile
      };

      // Beat grid from librosa on intro music.wav: 175.8 BPM, first beat 0.256s.
      // B(n) = beat n. Section change at B(11)=4.01, biggest kick B(16)=5.72,
      // hi-hat peak B(17)=6.06, last hit B(19)=6.74.
      const BEAT = 60 / 175.78;
      const B = (n) => 0.256 + n * BEAT;

      // ------------------------------------------------------------- curves
      function bezier(x1, y1, x2, y2) {
        const c = (a, b, t) => 3 * (1 - t) * (1 - t) * t * a + 3 * (1 - t) * t * t * b + t * t * t;
        return (x) => {
          let lo = 0, hi = 1, t = x;
          for (let i = 0; i < 30; i++) {
            t = (lo + hi) / 2;
            if (c(x1, x2, t) < x) lo = t; else hi = t;
          }
          return c(y1, y2, t);
        };
      }
      const easeOut = bezier(0.23, 1, 0.32, 1);       // entrances
      const easeInOut = bezier(0.77, 0, 0.175, 1);    // on-screen travel
      // Critically damped spring (response 0.4s), mapped onto a 0.8s tween
      const SPRING_DUR = 0.8;
      const omega = (2 * Math.PI) / 0.4;
      const spring = (p) => {
        const t = p * SPRING_DUR;
        return p >= 1 ? 1 : 1 - (1 + omega * t) * Math.exp(-omega * t);
      };

      // ------------------------------------------------------------- build DOM
      const ICONS = {
        headset: '<path d="M3 11h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Zm0 0a9 9 0 1 1 18 0m0 0v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3Z"/><path d="M21 16v2a4 4 0 0 1-4 4h-5"/>',
        users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/>',
        chart: '<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
        cap: '<path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>',
        folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.930 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
        calendar: '<path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/>',
        chat: '<path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/><path d="M7 11h10"/><path d="M7 15h6"/><path d="M7 7h8"/>',
        cart: '<path d="m2.05 2.05 1.099-.028a1 1 0 0 1 1.008.815l2.69 14.347A1 1 0 0 0 7.83 18H18"/><path d="M4.563 5h16.435a1 1 0 0 1 .981 1.204l-1.026 6.226A2 2 0 0 1 18.962 14H6.25"/><circle cx="18" cy="20" r="2"/><circle cx="8" cy="20" r="2"/>',
        layout: '<rect width="18" height="7" x="3" y="3" rx="1"/><rect width="9" height="7" x="3" y="14" rx="1"/><rect width="5" height="7" x="16" y="14" rx="1"/>',
        receipt: '<path d="M12 17V7"/><path d="M16 8h-6a2 2 0 0 0 0 4h4a2 2 0 0 1 0 4H8"/><path d="M4 3a1 1 0 0 1 1-1 1.3 1.3 0 0 1 .7.2l.933.6a1.3 1.3 0 0 0 1.4 0l.934-.6a1.3 1.3 0 0 1 1.4 0l.933.6a1.3 1.3 0 0 0 1.4 0l.933-.6a1.3 1.3 0 0 1 1.4 0l.934.6a1.3 1.3 0 0 0 1.4 0l.933-.6A1.3 1.3 0 0 1 19 2a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1 1.3 1.3 0 0 1-.7-.2l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.934.6a1.3 1.3 0 0 1-1.4 0l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-1.4 0l-.934-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-.7.2 1 1 0 0 1-1-1z"/>',
      };
      const TILE_ICONS = ["headset", "users", "chart", "cap", "folder", "calendar", "chat", "cart", "layout", "receipt"];

      // grid geometry: 5 × 2 tiles of 280px, 36px gap, centred horizontally
      const T = 280, GAP = 36, GX = 188, GY = 330;
      const tilePos = (i) => ({ x: GX + (i % 5) * (T + GAP), y: GY + Math.floor(i / 5) * (T + GAP) });

      const head = document.getElementById("head");
      CFG.series.forEach((w, i) => {
        const s = document.createElement("span");
        s.className = "word";
        s.textContent = w;
        if (i === CFG.series.length - 1) {
          const mark = document.createElement("span");
          mark.className = "mark";
          mark.innerHTML = '<span class="hl" id="hl"></span>';
          mark.appendChild(s);
          head.appendChild(mark);
        } else {
          head.appendChild(s);
          head.appendChild(document.createTextNode(" "));
        }
      });
      const words = [...head.querySelectorAll(".word")];

      const tilesEl = document.getElementById("tiles");
      const tiles = TILE_ICONS.map((name, i) => {
        const t = document.createElement("div");
        t.className = "tile";
        const { x, y } = tilePos(i);
        t.style.left = x + "px";
        t.style.top = y + "px";
        t.innerHTML = `<svg viewBox="0 0 24 24">${ICONS[name]}</svg>`;
        if (i === CFG.pick) t.insertAdjacentHTML("beforeend", `<div class="label">${CFG.app}</div>`);
        tilesEl.appendChild(t);
        return t;
      });
      const pickTile = tiles[CFG.pick];
      const pickIcon = pickTile.querySelector("svg");
      const pickLabel = pickTile.querySelector(".label");
      const others = tiles.filter((_, i) => i !== CFG.pick);

      // ------------------------------------------------------------- timeline
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;

      // 1 · header: one word per beat (B0-B2), rising on a critically damped spring
      words.forEach((w, i) => {
        tl.fromTo(w, { y: 44, scale: 0.97 }, { y: 0, scale: 1, duration: SPRING_DUR, ease: spring }, B(i));
        tl.fromTo(w, { opacity: 0, filter: "blur(6px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: easeOut }, B(i));
      });

      // 2 · highlighter sweeps left→right behind the last word on B3
      tl.fromTo("#hl", { scaleX: 0, skewX: -6, transformOrigin: "0% 50%" },
        { scaleX: 1, skewX: -6, duration: 0.34, ease: easeOut }, B(3));

      // 3 · tiles pop in column by column on 8th notes (B4 … B6), top row a hair first
      tiles.forEach((t, i) => {
        const at = B(4) + (i % 5) * (BEAT / 2) + Math.floor(i / 5) * 0.04;
        tl.fromTo(t, { y: 30, scale: 0.94 }, { y: 0, scale: 1, duration: SPRING_DUR, ease: spring }, at);
        tl.fromTo(t, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: easeOut }, at);
      });

      // 4 · selection ring hops one tile per beat (B7 … B10), lands on the app on B11
      const ringAt = (i) => ({ x: tilePos(i).x - 18, y: tilePos(i).y - 18 });
      const path = [...CFG.hops, CFG.pick];
      const HOP = 0.22;
      tl.fromTo("#ring", { ...ringAt(path[0]), scale: 0.92, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.2, ease: easeOut }, B(7));
      const lit = (i, at) => {
        tl.to(tiles[i], { backgroundColor: "var(--surface-gray-3)", duration: 0.12, ease: "none" }, at);
        tl.to(tiles[i].querySelector("svg"), { stroke: "var(--ink-gray-8)", duration: 0.12, ease: "none" }, at);
      };
      const unlit = (i, at) => {
        tl.to(tiles[i], { backgroundColor: "var(--surface-gray-1)", duration: 0.15, ease: "none" }, at);
        tl.to(tiles[i].querySelector("svg"), { stroke: "var(--ink-gray-4)", duration: 0.15, ease: "none" }, at);
      };
      lit(path[0], B(7));
      for (let k = 1; k < path.length; k++) {
        const arrive = B(7 + k);
        tl.to("#ring", { ...ringAt(path[k]), duration: HOP, ease: easeInOut }, arrive - HOP);
        unlit(path[k - 1], arrive - HOP);
        if (k < path.length - 1) lit(path[k], arrive);
      }

      // 5 · land (B11, the section change): the tile fills violet and names itself
      const LAND = B(11);
      tl.to(pickTile, { backgroundColor: "var(--brand)", borderColor: "var(--brand)", duration: 0.15, ease: "none" }, LAND);
      tl.to(pickIcon, { stroke: "var(--ink-gray-9)", duration: 0.15, ease: "none" }, LAND);
      tl.to([pickTile, "#ring"], { scale: 1.08, duration: SPRING_DUR, ease: spring }, LAND);
      tl.to("#ring", { borderColor: "var(--surface-violet-3)", duration: 0.2, ease: "none" }, LAND);
      tl.to(pickIcon, { y: -26, duration: SPRING_DUR, ease: spring }, LAND); // make room for the label
      tl.fromTo(pickLabel, { y: 18 }, { y: 0, duration: SPRING_DUR, ease: spring }, LAND + 0.06);
      tl.to(pickLabel, { opacity: 1, duration: 0.25, ease: easeOut }, LAND + 0.06);
      // B12: the rest of the marketplace steps back
      tl.to(others, { opacity: 0.4, duration: 0.3, ease: easeOut }, B(12));

      // 6 · camera with intent: push toward the app over 3 beats (B12 → B15),
      //     then hold still one beat before the kick
      const c = tilePos(CFG.pick);
      const cx = c.x + T / 2, cy = c.y + T / 2;
      gsap.set("#cam", { transformOrigin: `${cx}px ${cy}px` });
      tl.fromTo("#cam", { x: 0, y: 0, scale: 1 },
        { x: 960 - cx, y: 540 - cy, scale: CFG.push, duration: B(15) - B(12), ease: easeInOut }, B(12));

      // 7 · zoom through the tile on the big kick (B16 → B17). Scale is tweened in
      //     log space so the growth rate reads constant-accelerating, not front-loaded.
      //     Cover scale: the tile's rounded corners must clear the frame corners.
      const pickHalf = (T * 1.08) / 2, pickR = 44 * 1.08;
      const COVER = (960 + pickR) / (pickHalf - pickR) + 0.5;
      const a = Math.log(CFG.push), b = Math.log(COVER) - a;
      const logIn = (p) => (Math.exp(a + b * p * p * p) - CFG.push) / (COVER - CFG.push);
      tl.fromTo("#cam", { scale: CFG.push },
        { scale: COVER, duration: B(17) - B(16), ease: logIn, immediateRender: false }, B(16));
      tl.to([pickIcon, pickLabel], { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "none" }, B(16));

      // 8 · B17: the frame is solid violet — swap to the portal, then the window
      //     opens to transparent, fully gone before the last hit (B19)
      tl.set("#scene", { autoAlpha: 0 }, B(17));
      tl.set("#portal", { opacity: 1 }, B(17));
      // one painter for the hole, so seeking in any direction stays exact
      const hole = { w: 0, h: 0 };
      const paintHole = () => {
        const w = hole.w, h = hole.h, r = Math.min(w, h) * 0.157; // tile's corner ratio (44/280)
        const x0 = 960 - w / 2, y0 = 540 - h / 2, x1 = x0 + w, y1 = y0 + h;
        const d = `M0 0H1920V1080H0Z M${x0 + r} ${y0}H${x1 - r}A${r} ${r} 0 0 1 ${x1} ${y0 + r}V${y1 - r}`
          + `A${r} ${r} 0 0 1 ${x1 - r} ${y1}H${x0 + r}A${r} ${r} 0 0 1 ${x0} ${y1 - r}V${y0 + r}A${r} ${r} 0 0 1 ${x0 + r} ${y0}Z`;
        document.getElementById("portal").style.clipPath = `path(evenodd, "${d}")`;
      };
      paintHole();
      tl.eventCallback("onUpdate", paintHole);
      tl.fromTo(hole, { w: 0, h: 0 }, { w: 2400, h: 1400, duration: B(18.6) - B(17), ease: easeOut }, B(17));
      tl.set("#portal", { opacity: 0 }, B(18.6));
    </script>
  </body>
</html>
