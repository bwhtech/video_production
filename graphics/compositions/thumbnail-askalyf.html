<!doctype html>
<html lang="en" data-resolution="landscape" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme/tokens.css" />
    <link rel="stylesheet" href="theme/fonts.css" />
    <style>
      /* ------------------------------------------------------------------
         Frappe App Review — Ask Alyf thumbnail.
         Left: series label "Tutorial and Review" (violet highlighter behind
         "Review", same as the intro), the ALYF logo + "Ask Alyf", and a
         one-line pitch. Right: frame 00:04.90 of final.mp4 (lips closed),
         fading into the surface on the left. Add class "with-card" on
         #root to show the real Ask Alyf chat (pie chart, 07:05) as a card.
         ------------------------------------------------------------------ */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: var(--surface-base);
        font-family: var(--font-text);
      }
      .bg { position: absolute; inset: 0; background: var(--surface-base); }

      /* Native plate (1920x1080): face centre x≈1000, head top y≈95.
         Scaled 1.12 from the top-left, shifted (300, -50): face centre x≈1420. */
      .photo-wrap {
        position: absolute; inset: 0;
        -webkit-mask-image: linear-gradient(90deg, transparent 40%, #000 60%);
                mask-image: linear-gradient(90deg, transparent 40%, #000 60%);
      }
      .photo {
        position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        transform-origin: 0 0;
        transform: translate(300px, -50px) scale(1.12);
      }

      .col {
        position: absolute; left: 110px; top: 0; bottom: 0; width: 1000px;
        display: flex; flex-direction: column; justify-content: center;
      }
      .series {
        font-size: 76px; line-height: 1;
        font-weight: var(--fw-black); letter-spacing: -0.035em;
        color: var(--ink-gray-9); white-space: nowrap;
      }
      .mark { display: inline-block; position: relative; margin-left: 0.18em; }
      .mark > span { position: relative; z-index: 1; }
      .mark::before {
        content: ""; position: absolute; z-index: 0;
        top: 0.18em; bottom: -0.06em; left: -0.17em; right: -0.21em;
        background: var(--brand); border-radius: 0.1em;
        transform: skewX(-6deg);
      }
      .app { margin-top: 60px; display: flex; align-items: center; gap: 36px; }
      .app img { width: 190px; height: 190px; flex: none; }
      .app h1 {
        font-size: 196px; line-height: 0.9;
        font-weight: var(--fw-black); letter-spacing: -0.045em;
        color: var(--ink-gray-9); white-space: nowrap;
      }
      .pitch {
        margin-top: 52px; margin-left: 6px;
        font-size: 64px; line-height: 1.1;
        font-weight: var(--fw-semibold); letter-spacing: -0.025em;
        color: var(--ink-gray-6); white-space: nowrap;
      }
      .pitch b { color: var(--ink-gray-9); font-weight: var(--fw-bold); }

      /* optional: the real chat panel as a card */
      .card {
        display: none;
        position: absolute; left: 1010px; top: 560px; width: 560px;
        border-radius: 28px; overflow: hidden;
        border: 4px solid var(--outline-gray-3);
      }
      .card img { display: block; width: 100%; }
      .with-card .card { display: block; }
      .with-card .col { justify-content: flex-start; padding-top: 150px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main"
         data-start="0" data-duration="1" data-fps="30"
         data-width="1920" data-height="1080">
      <div class="bg"></div>
      <div class="photo-wrap">
        <img class="photo" src="assets/img/hussain-plate-askalyf-graded.png" alt="" />
      </div>

      <div class="col">
        <div class="series">Tutorial and<span class="mark"><span>Review</span></span></div>
        <div class="app">
          <img src="assets/img/ask-alyf-logo.png" alt="" />
          <h1>Ask ALYF</h1>
        </div>
        <div class="pitch">AI chatbot <b>inside ERPNext</b></div>
      </div>

      <div class="card"><img src="assets/img/askalyf-chat-pie-card.png" alt="" /></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
