<!doctype html>
<html lang="en" data-resolution="landscape" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme/tokens.css" />
    <link rel="stylesheet" href="theme/fonts.css" />
    <style>
      /* ------------------------------------------------------------------
         Awesome Bar hook result — the dict, key by key (What's New in FF,
         frappe/frappe#41925). Same dark panel wipe as list-ff-august-full,
         one hue (green) throughout. Left: the result dict the hook returns; a band
         walks label → description → route → route_options on the VO cues.
         Right: the three shapes `route` can take; the route value in the
         code morphs to match whichever one is lit. The code sits centred
         until the shapes arrive, nudges left to make room, and returns to
         centre when they leave on "route options".
         ------------------------------------------------------------------ */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: transparent;
        font-family: var(--font-text);
      }

      .card {
        position: absolute; inset: 0; overflow: hidden;
        background: var(--surface-base);
        clip-path: inset(0 100% 0 0);
      }

      /* ---- code window */
      .code {
        position: absolute;
        background: var(--surface-gray-1);
        border: 2px solid var(--outline-gray-2);
        border-radius: calc(var(--radius-2xl) * 1.2);
        will-change: transform, opacity, filter;
      }
      .tab {
        position: absolute; left: 40px; top: 26px;
        display: flex; align-items: center; gap: 14px;
        font-family: var(--font-mono); font-size: 24px;
        color: var(--ink-gray-6);
      }
      .tab i { width: 12px; height: 12px; border-radius: var(--radius-full); background: var(--surface-green-6); }
      .lines { position: absolute; left: 0; right: 0; }
      .band {
        position: absolute; left: 20px; right: 20px; top: 0;
        border-radius: var(--radius-lg);
        background: color-mix(in srgb, var(--hue) 26%, transparent);
        opacity: 0;
      }
      .band::before {  /* solid edge on the left, like an editor's active-line gutter */
        content: ""; position: absolute; left: 0; top: 10px; bottom: 10px;
        width: 5px; border-radius: var(--radius-full);
        background: var(--hue);
      }
      .line {
        position: absolute; left: 56px;
        font-family: var(--font-mono); font-size: 30px;
        white-space: pre;
        font-variant-ligatures: none;  /* keep "->" as typed, like the editor */
        color: var(--ink-gray-8);
        display: flex; align-items: center;
      }
      .kw { color: var(--violet-400); }
      .fn { color: var(--blue-400); }
      .ty { color: var(--cyan-300); }
      .key { color: var(--blue-300); }
      .str { color: var(--green-300); }
      .num { color: var(--amber-300); }
      .pun { color: var(--ink-gray-6); }
      .val { display: inline-grid; }
      .val > span { grid-area: 1 / 1; white-space: pre; }

      /* ---- route shapes */
      .opt {
        position: absolute;
        display: flex; align-items: center; gap: 28px;
        padding: 0 32px;
        background: var(--surface-gray-1);
        border: 2px solid var(--outline-gray-2);
        border-radius: calc(var(--radius-2xl) * 1.1);
        will-change: transform, opacity;
      }
      .opt .ring {
        position: absolute; inset: -2px; border-radius: inherit;
        border: 3px solid var(--surface-green-6);
        opacity: 0;
      }
      .opt .ic {
        position: relative; flex: none;
        width: 64px; height: 64px; border-radius: var(--radius-xl);
        display: flex; align-items: center; justify-content: center;
        background: var(--surface-gray-3); color: var(--ink-gray-7);
      }
      .opt .ic .fill { position: absolute; inset: 0; border-radius: inherit; background: var(--surface-green-6); opacity: 0; }
      .opt .ic svg { position: relative; width: 32px; height: 32px; }
      .opt .t { font-size: 36px; font-weight: var(--fw-semibold); letter-spacing: -0.02em; color: var(--ink-gray-9); }
      .opt .hint { margin-top: 10px; font-size: 22px; color: var(--ink-gray-6); white-space: nowrap; }
      .opt .hint code { font-family: var(--font-mono); font-size: 21px; color: var(--ink-gray-8); }
      .opt .ex { margin-top: 6px; font-family: var(--font-mono); font-size: 22px; color: var(--ink-gray-6); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main"
         data-start="0" data-duration="32.35" data-fps="30"
         data-width="1920" data-height="1080">
      <div class="card clip" id="card"
           data-start="0" data-duration="32.35" data-track-index="0">
        <div class="code" id="code">
          <div class="tab"><i></i>search.py</div>
          <div class="lines" id="lines"><div class="band" id="band"></div></div>
        </div>
      </div>

      <!-- VO slice (FF August.mov 495.30s → 527.70s), for sync checks only; drop for the overlay render -->
      <audio id="vo" src="assets/aug-route-format.wav"
             data-start="0" data-duration="32.35" data-track-index="1" data-volume="1"></audio>
      <audio id="whip-in" src="assets/sfx/whip.wav"
             data-start="0.24" data-duration="0.17" data-track-index="2" data-volume="0.5"></audio>
      <audio id="whip-out" src="assets/sfx/whip.wav"
             data-start="31.79" data-duration="0.17" data-track-index="3" data-volume="0.5"></audio>
    </div>

    <script>
      // ---------------------------------------------------------------- knobs
      // All cue times are SOURCE seconds in "FF August.mov"; SRC_AT is where
      // this graphic starts in that timeline.
      const SRC_AT = 495.3;
      const CFG = {
        cues: {
          dict: 496.73,         // "format of this dictionary"
          label: 500.27,        // "a label"
          description: 501.12,  // "a description"
          route: 502.33,        // "a route"
          shapes: 504.73,       // "three different things"
          list: 509.45,         // "a list"
          path: 513.61,         // "a relative link"
          url: 516.91,          // "an external link"
          routeOptions: 520.77, // "route options"
        },
        lead: 0.15,
        dimTo: 0.35,
        hues: { dict: "green", label: "green", description: "green", route: "green", routeOptions: "green" },
        wipe: 0.55,
        inAt: 0.3,
        exitAt: 31.45,
        panelOutAt: 31.8,
      };
      // Retiming? data-duration on #root/#card = panelOutAt + wipe; whip-out = panelOutAt - 0.01.
      const T = (src) => src - SRC_AT - CFG.lead;

      // ------------------------------------------------------------- curves
      function bezier(x1, y1, x2, y2) {
        const c = (a, b, t) => 3 * (1 - t) * (1 - t) * t * a + 3 * (1 - t) * t * t * b + t * t * t;
        return (x) => {
          let lo = 0, hi = 1, t = x;
          for (let i = 0; i < 30; i++) {
            t = (lo + hi) / 2;
            if (c(x1, x2, t) < x) lo = t; else hi = t;
          }
          return c(y1, y2, t);
        };
      }
      const easeInOut = bezier(0.77, 0, 0.175, 1);
      const easeOut = bezier(0.23, 1, 0.32, 1);
      const easeOutMirror = bezier(0.68, 0, 0.77, 0);
      const SPRING_DUR = 0.8;
      const omega = (2 * Math.PI) / 0.4;
      const spring = (p) => {
        const t = p * SPRING_DUR;
        return p >= 1 ? 1 : 1 - (1 + omega * t) * Math.exp(-omega * t);
      };

      // --------------------------------------------------------------- code
      // Illustrative; route + route_options match create_party_result() in the demo app (gst_search/search.py). Each line is a list
      // of [class, text]; "val" is the route value that morphs.
      const I = (n) => ["", " ".repeat(n)];
      const ROUTES = [
        '["Form", "Customer", "new"]',
        '"/desk/customer/new"',
        '"https://services.gst.gov.in"',
      ];
      const CODE = [
        [["kw", "def "], ["fn", "awesomebar_results"], ["pun", "("], ["", "txt"], ["pun", ": "], ["ty", "str"], ["pun", ") -> "], ["ty", "list"], ["pun", "[dict]:"]],
        [I(4), ["kw", "return "], ["pun", "["]],
        [I(8), ["pun", "{"]],
        [I(12), ["key", '"label"'], ["pun", ": "], ["str", '"Create Customer"'], ["pun", ","]],
        [I(12), ["key", '"description"'], ["pun", ": "], ["str", '"Frappe Technologies"'], ["pun", ","]],
        [I(12), ["key", '"route"'], ["pun", ": "], ["val", ""]],
        [I(12), ["key", '"route_options"'], ["pun", ": {"]],
        [I(16), ["key", '"name_field"'], ["pun", ": "], ["str", '"Frappe Technologies"'], ["pun", ","]],
        [I(16), ["key", '"tax_id"'], ["pun", ": "], ["str", '"27AAACW8099E1ZX"'], ["pun", ","]],
        [I(16), ["key", '"customer_type"'], ["pun", ": "], ["str", '"Company"'], ["pun", ","]],
        [I(12), ["pun", "},"]],
        [I(12), ["key", '"index"'], ["pun", ": "], ["num", "92"], ["pun", ","]],
        [I(8), ["pun", "},"]],
        [I(4), ["pun", "]"]],
      ];
      // line ranges each cue lights up (inclusive)
      const RANGES = { dict: [2, 12], label: [3, 3], description: [4, 4], route: [5, 5], routeOptions: [6, 10] };

      const LINE_H = 54, HEAD = 84, PAD_B = 36;
      const CODE_BOX = { x: 80, w: 1110, h: HEAD + CODE.length * LINE_H + PAD_B };
      CODE_BOX.y = Math.round((1080 - CODE_BOX.h) / 2);

      const CENTER_DX = Math.round((1920 - CODE_BOX.w) / 2) - CODE_BOX.x; // x offset that centres the code
      const codeEl = document.getElementById("code");
      Object.assign(codeEl.style, { left: CODE_BOX.x + "px", top: CODE_BOX.y + "px", width: CODE_BOX.w + "px", height: CODE_BOX.h + "px" });
      const linesEl = document.getElementById("lines");
      linesEl.style.top = HEAD + "px";

      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      const lineEls = CODE.map((tokens, i) => {
        const el = document.createElement("div");
        el.className = "line";
        Object.assign(el.style, { top: i * LINE_H + "px", height: LINE_H + "px" });
        el.innerHTML = tokens.map(([cls, text]) => cls === "val"
          ? `<span class="val">${ROUTES.map((r) => `<span><span class="str">${esc(r)}</span><span class="pun">,</span></span>`).join("")}</span>`
          : `<span class="${cls}">${esc(text)}</span>`).join("");
        linesEl.appendChild(el);
        return el;
      });
      const alts = [...document.querySelectorAll(".val > span")];
      alts.forEach((a, i) => gsap.set(a, { opacity: i === 0 ? 1 : 0 }));

      // ------------------------------------------------------------ options
      const ICON = {
        list: '<path d="M3 5h.01"/><path d="M3 12h.01"/><path d="M3 19h.01"/><path d="M8 5h13"/><path d="M8 12h13"/><path d="M8 19h13"/>',
        link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
        external: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
      };
      const OPTS = [
        { icon: "list", title: "Desk route", ex: '["Form", "Customer", "new"]', hint: 'args to <code>frappe.set_route()</code>' },
        { icon: "link", title: "In-app path", ex: '"/desk/customer/new"' },
        { icon: "external", title: "External URL", ex: "opens in a new tab" },
      ];
      const OPT_BOX = { x: 1250, w: 590, h: 176, gap: 28 };
      const optTop = Math.round((1080 - (OPTS.length * OPT_BOX.h + (OPTS.length - 1) * OPT_BOX.gap)) / 2);
      const card = document.getElementById("card");
      const opts = OPTS.map((o, i) => {
        const el = document.createElement("div");
        el.className = "opt";
        Object.assign(el.style, {
          left: OPT_BOX.x + "px", top: optTop + i * (OPT_BOX.h + OPT_BOX.gap) + "px",
          width: OPT_BOX.w + "px", height: OPT_BOX.h + "px",
        });
        el.innerHTML =
          `<div class="ring"></div>` +
          `<div class="ic"><span class="fill"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[o.icon]}</svg></div>` +
          `<div><div class="t"></div><div class="ex"></div>${o.hint ? `<div class="hint">${o.hint}</div>` : ""}</div>`;
        el.querySelector(".t").textContent = o.title;
        el.querySelector(".ex").textContent = o.ex;
        card.appendChild(el);
        const q = (s) => el.querySelector(s);
        return { el, ring: q(".ring"), fill: q(".fill"), ic: q(".ic"), txt: el.lastElementChild };
      });

      // ----------------------------------------------------------- timeline
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;

      const panel = { p: 0 };
      const paint = () => gsap.set("#card", { clipPath: `inset(0 ${(1 - panel.p) * 100}% 0 0)` });
      paint();
      tl.eventCallback("onUpdate", paint);

      // --- entry: panel, then the code window on the same spring as the list
      tl.to(panel, { p: 1, duration: CFG.wipe, ease: easeInOut }, 0);
      tl.fromTo(codeEl, { x: CENTER_DX - 48, scale: 0.98 }, { x: CENTER_DX, scale: 1, duration: SPRING_DUR, ease: spring }, CFG.inAt);
      tl.fromTo(codeEl, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: easeOut }, CFG.inAt);
      tl.fromTo(lineEls, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: easeOut, stagger: 0.03 }, CFG.inAt + 0.15);

      // --- band walk
      const band = document.getElementById("band");
      const hueVar = (h) => `var(--surface-${h}-6)`;
      const focus = (name, at) => {
        const [a, b] = RANGES[name];
        tl.to(band, { y: a * LINE_H, height: (b - a + 1) * LINE_H, duration: 0.5, ease: easeInOut }, at);
        tl.set(band, { "--hue": hueVar(CFG.hues[name]) }, at + 0.12);
        lineEls.forEach((el, i) => {
          tl.to(el, { opacity: i >= a && i <= b ? 1 : CFG.dimTo, duration: 0.35, ease: easeOut }, at);
        });
      };
      const c = CFG.cues;
      const [d0, d1] = RANGES.dict;
      gsap.set(band, { y: d0 * LINE_H, height: (d1 - d0 + 1) * LINE_H, "--hue": hueVar(CFG.hues.dict) });
      tl.fromTo(band, { opacity: 0, scale: 0.98 }, { opacity: 1, scale: 1, duration: 0.35, ease: easeOut }, T(c.dict));
      lineEls.forEach((el, i) => {
        if (i < d0 || i > d1) tl.to(el, { opacity: CFG.dimTo, duration: 0.35, ease: easeOut }, T(c.dict));
      });
      focus("label", T(c.label));
      focus("description", T(c.description));
      focus("route", T(c.route));

      // --- route shapes: code nudges left, cards cascade in on "three different things"
      tl.to(codeEl, { x: 0, duration: 0.7, ease: easeInOut }, T(c.shapes) - 0.2);
      tl.fromTo(opts.map((o) => o.el), { x: 48, opacity: 0, filter: "blur(6px)" },
        { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: easeOut, stagger: 0.12 }, T(c.shapes) + 0.25);
      const lightOpt = (i, at) => {
        opts.forEach((o, j) => {
          const on = i === j;
          tl.to(o.ring, { opacity: on ? 1 : 0, duration: 0.3, ease: easeOut }, at);
          tl.to(o.fill, { opacity: on ? 1 : 0, duration: 0.3, ease: easeOut }, at);
          tl.to(o.ic, { color: on ? "var(--on-brand)" : "var(--ink-gray-7)", duration: 0.3, ease: easeOut }, at);
          tl.to([o.txt], { opacity: on || i < 0 ? 1 : 0.45, duration: 0.3, ease: easeOut }, at);
        });
        if (i < 0) return;
        // the value in the code swaps to this shape: old one blurs up, new one rises in
        alts.forEach((a, j) => {
          if (j === i) tl.fromTo(a, { opacity: 0, y: 14, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.35, ease: easeOut, immediateRender: false }, at + 0.1);
          else tl.to(a, { opacity: 0, y: -14, filter: "blur(4px)", duration: 0.2, ease: easeOutMirror }, at);
        });
      };
      lightOpt(0, T(c.list));
      lightOpt(1, T(c.path));
      lightOpt(2, T(c.url));

      // --- route_options: shape cards leave the way they came, code returns to centre
      const optEls = opts.map((o) => o.el);
      tl.to([...optEls].reverse(), { x: 48, opacity: 0, filter: "blur(6px)", duration: 0.3, ease: easeOutMirror, stagger: 0.05 }, T(c.routeOptions) - 0.35);
      tl.to(codeEl, { x: CENTER_DX, duration: 0.7, ease: easeInOut }, T(c.routeOptions) - 0.1);
      // route goes back to the Form route that route_options pre-fills
      tl.to(alts[2], { opacity: 0, y: -14, filter: "blur(4px)", duration: 0.2, ease: easeOutMirror }, T(c.routeOptions) - 0.35);
      tl.fromTo(alts[0], { opacity: 0, y: 14, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.35, ease: easeOut, immediateRender: false }, T(c.routeOptions) - 0.25);
      focus("routeOptions", T(c.routeOptions));

      // --- exit: band off, content retraces left, panel retracts
      tl.to(band, { opacity: 0, duration: 0.25, ease: easeOutMirror }, CFG.exitAt - 0.25);
      tl.to(codeEl, { x: CENTER_DX - 48, scale: 0.98, opacity: 0, filter: "blur(6px)", duration: 0.3, ease: easeOutMirror }, CFG.exitAt);
      tl.to(panel, { p: 0, duration: CFG.wipe, ease: easeInOut }, CFG.panelOutAt);
    </script>
  </body>
</html>
