<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme/fonts.css" />
    <style>
      /* ------------------------------------------------------------------
         Go-live timeline. A vertical checklist that gets ticked off across
         several videos. One composition, rendered as slices: `done` says how
         many steps are already ticked when the clip starts, `tick` names the
         step (0-based) that gets ticked during the clip, or -1 for a hold.
         No in/out — every slice starts and ends on a still frame so it can
         be cut in anywhere. Palette = the series' light card look.
         ------------------------------------------------------------------ */
      :root {
        --card-bg: #ececec;
        --panel: #ffffff;
        --line: #d6d6d6;
        --rail: #c9c9c9;
        --ink: #212121;
        --ink-muted: #767676;
        --accent: #0a8df7;
        --accent-soft: #e0f0fe;
        --accent-ink: #0b6fc2;
        --font-text: "Inter", system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: transparent;
        font-family: var(--font-text);
        color: var(--ink);
      }
      .stage {
        position: absolute; inset: 0; overflow: hidden;
        background: var(--card-bg);
      }
      .grid {
        position: absolute; inset: 0;
        background-image: radial-gradient(#d2d2d2 1.5px, transparent 1.5px);
        background-size: 48px 48px;
        opacity: 0.5;
      }

      .rails { position: absolute; inset: 0; overflow: visible; }
      .rails line, .rails path { fill: none; stroke-linecap: round; }
      .rails .grey { stroke: var(--rail); stroke-width: 4; }
      .rails .blue { stroke: var(--accent); stroke-width: 5; }
      .rails .prior { stroke: var(--rail); stroke-width: 4; stroke-dasharray: 2 14; }
      #confetti { position: absolute; inset: 0; pointer-events: none; }

      /* focus ring: traces the node's own 4px border, drawn above it */
      .rails circle.ring { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: butt; }

      /* one step = node on the rail + label block to its right */
      .node {
        position: absolute;
        width: 88px; height: 88px; border-radius: 50%;
        background: var(--panel);
        border: 4px solid var(--rail);
        display: flex; align-items: center; justify-content: center;
        color: var(--ink-muted);
        will-change: transform;
      }
      .node svg.icon { width: 40px; height: 40px; }
      .node .fill {
        position: absolute; inset: -4px; border-radius: 50%;
        background: var(--accent);
        transform: scale(0);
      }
      .node svg.check {
        position: absolute; inset: 0; width: 100%; height: 100%;
        fill: none; stroke: #fff; stroke-width: 7;
        stroke-linecap: round; stroke-linejoin: round;
      }

      .label {
        position: absolute;
        display: flex; align-items: center; gap: 22px;
        will-change: transform;
      }
      .label .text {
        font-size: 48px; line-height: 1.1;
        font-weight: 600; letter-spacing: -0.014em;
        color: var(--ink-muted); white-space: nowrap;
      }
      .label .text .paren { font-weight: 500; }
      .pill {
        display: inline-flex; align-items: center; gap: 10px;
        padding: 8px 18px; border-radius: 999px;
        background: var(--accent-soft); color: var(--accent-ink);
        font-size: 26px; font-weight: 600; letter-spacing: 0.02em;
        white-space: nowrap;
        will-change: transform, opacity;
      }
      .pill svg { width: 24px; height: 24px; }

      /* the destination: a distinct filled marker, not a checkbox */
      .golive .node {
        border-color: var(--ink);
        background: var(--ink); color: #fff;
        border-style: solid;
      }
      .golive .text { color: var(--ink); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main"
         data-start="0" data-duration="4" data-fps="30"
         data-width="1920" data-height="1080">
      <div class="stage clip" id="stage"
           data-start="0" data-duration="4" data-track-index="0">
        <div class="grid"></div>
        <svg class="rails" id="rails" viewBox="0 0 1920 1080" width="1920" height="1080"></svg>
        <div id="steps"></div>
        <svg class="rails" id="overlay" viewBox="0 0 1920 1080" width="1920" height="1080"></svg>
        <canvas id="confetti" width="1920" height="1080"></canvas>
      </div>
    </div>

    <script>
      // ---------------------------------------------------------------- knobs
      const CFG = {
        done: 0,        // steps already ticked at t=0
        // ticks landing during this clip: { i: step index (4 = Go Live), at: seconds }.
        // Empty array = hold frame only.
        ticks: [{ i: 0, at: 1.0 }],
        dur: 4,         // keep in sync with data-duration on #root and #stage

        // "this is where we're going next": a ring draws itself clockwise
        // around step `focus.i` at `focus.at`. null = no ring.
        focus: null,

        // confetti burst from step `i`'s node at `at` (use with a Go Live tick).
        // canvas-confetti's physics + look, re-implemented with a seeded RNG and
        // baked per frame so it seeks and renders deterministically. null = off.
        confetti: null,

        priorLine: true,   // faint dotted rail entering from the top edge
                           // (everything done before user training)

        steps: [
          { text: "User training", icon: "cap", signoff: true },
          { text: "User acceptance testing", paren: "(UAT)", icon: "clipboard", signoff: true },
          { text: "Clear transactions", icon: "eraser" },
          { text: "Opening balances", icon: "scale" },
        ],
        golive: { text: "Go Live", icon: "rocket" },

        // geometry
        railX: 600,     // rail centre x
        top: 210,       // first node centre y
        gap: 168,       // node-to-node
        labelGap: 64,   // node edge → label
        nodeR: 44,
      };

      // ---------------------------------------------------------------- icons
      // Lucide outlines, 24-unit viewBox.
      const ICON = {
        cap: `<path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>`,
        clipboard: `<rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>`,
        eraser: `<path d="M21 21H8a2 2 0 0 1-1.42-.587l-3.994-3.999a2 2 0 0 1 0-2.828l10-10a2 2 0 0 1 2.829 0l5.999 6a2 2 0 0 1 0 2.828L12.834 21"/><path d="m5.082 11.09 8.828 8.828"/>`,
        scale: `<path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>`,
        rocket: `<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>`,
        pen: `<path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/>`,
      };
      const svgIcon = (name, cls = "icon") =>
        `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">${ICON[name]}</svg>`;

      // --------------------------------------------------------------- build
      const all = [...CFG.steps, { ...CFG.golive, golive: true }];
      const n = all.length;
      const cy = (i) => CFG.top + i * CFG.gap;
      const X = CFG.railX, R = CFG.nodeR;

      const rails = document.getElementById("rails");
      const NS = "http://www.w3.org/2000/svg";
      function seg(y0, y1, cls) {
        const l = document.createElementNS(NS, "line");
        l.setAttribute("x1", X); l.setAttribute("x2", X);
        l.setAttribute("y1", y0); l.setAttribute("y2", y1);
        l.setAttribute("class", cls);
        rails.appendChild(l);
        return l;
      }
      if (CFG.priorLine) seg(-10, cy(0) - R - 8, "prior");
      // grey rail between consecutive nodes, plus a blue copy that draws over it
      const SEG_LEN = CFG.gap - 2 * R - 16;
      const greySegs = [], blueSegs = [];
      for (let i = 0; i < n - 1; i++) {
        const y0 = cy(i) + R + 8, y1 = cy(i + 1) - R - 8;
        greySegs.push(seg(y0, y1, "grey"));
        const b = seg(y0, y1, "blue");
        b.style.strokeDasharray = SEG_LEN;
        b.style.strokeDashoffset = SEG_LEN;
        blueSegs.push(b);
      }

      // focus ring — lies exactly on the node's border centreline, starts at
      // 12 o'clock, and lives in the overlay SVG so it paints over the node.
      let ring = null, RING_LEN = 0;
      if (CFG.focus && CFG.focus.i >= 0 && CFG.focus.i < n) {
        const rr = R - 2;   // 88px box, 4px border → border centreline
        ring = document.createElementNS(NS, "circle");
        ring.setAttribute("class", "ring");
        ring.setAttribute("cx", X); ring.setAttribute("cy", cy(CFG.focus.i)); ring.setAttribute("r", rr);
        ring.setAttribute("transform", `rotate(-90 ${X} ${cy(CFG.focus.i)})`);
        RING_LEN = 2 * Math.PI * rr;
        ring.style.strokeDasharray = RING_LEN;
        ring.style.strokeDashoffset = RING_LEN;
        document.getElementById("overlay").appendChild(ring);
      }

      const stepsEl = document.getElementById("steps");
      const nodes = [], fills = [], checks = [], texts = [], pills = [];
      all.forEach((s, i) => {
        const wrap = document.createElement("div");
        wrap.className = s.golive ? "golive" : "step";

        const node = document.createElement("div");
        node.className = "node";
        node.id = "node-" + i;
        Object.assign(node.style, { left: X - R + "px", top: cy(i) - R + "px" });
        node.innerHTML = svgIcon(s.icon) + (s.golive ? "" : `
          <div class="fill" id="fill-${i}"></div>
          <svg class="check" id="check-${i}" viewBox="0 0 88 88">
            <path d="M28 45 L40 57 L62 33"/>
          </svg>`);
        wrap.appendChild(node);

        const label = document.createElement("div");
        label.className = "label";
        label.id = "label-" + i;
        Object.assign(label.style, {
          left: X + R + CFG.labelGap + "px",
          top: cy(i) - 30 + "px", height: "60px",
        });
        label.innerHTML = `
          <div class="text" id="text-${i}">${s.text}${s.paren ? ` <span class="paren">${s.paren}</span>` : ""}</div>
          ${s.signoff ? `<div class="pill" id="pill-${i}">${svgIcon("pen", "")}<span>Signed off</span></div>` : ""}`;
        wrap.appendChild(label);

        stepsEl.appendChild(wrap);
        nodes.push(node);
        fills.push(node.querySelector(".fill"));
        checks.push(node.querySelector(".check path"));
        texts.push(label.querySelector(".text"));
        pills.push(label.querySelector(".pill"));
      });

      // check-mark path length is fixed geometry — computed once, never measured live
      const CHECK_LEN = Math.hypot(12, 12) + Math.hypot(22, 24) + 2;
      checks.forEach((c) => {
        if (!c) return;
        c.style.strokeDasharray = CHECK_LEN;
        c.style.strokeDashoffset = CHECK_LEN;
      });

      // ------------------------------------------------------------ timeline
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;

      const ACCENT = "#0a8df7", INK = "#212121", MUTED = "#767676";

      // a hold-only slice still needs a timeline that spans the clip
      tl.to({}, { duration: CFG.dur }, 0);

      // rest state: steps < done are already ticked; the rest are pending
      for (let i = 0; i < CFG.steps.length; i++) {
        const isDone = i < CFG.done;
        gsap.set(nodes[i], { borderColor: isDone ? ACCENT : "#c9c9c9" });
        gsap.set(fills[i], { scale: isDone ? 1 : 0 });
        gsap.set(checks[i], { strokeDashoffset: isDone ? 0 : CHECK_LEN, autoAlpha: isDone ? 1 : 0 });
        gsap.set(nodes[i].querySelector(".icon"), { autoAlpha: isDone ? 0 : 1 });
        gsap.set(texts[i], { color: isDone ? INK : MUTED });
        if (pills[i]) gsap.set(pills[i], { autoAlpha: isDone ? 1 : 0, scale: 1 });
        if (i < n - 1) gsap.set(blueSegs[i], { strokeDashoffset: isDone ? 0 : SEG_LEN });
      }

      if (ring) {
        const t = CFG.focus.at;
        tl.to(ring, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, t);
        // the label wakes up with it
        tl.to(texts[CFG.focus.i], { color: INK, duration: 0.4 }, t + 0.3);
      }

      // ---------------------------------------------------------------- confetti
      if (CFG.confetti && CFG.confetti.i >= 0 && CFG.confetti.i < n) {
        const C = {
          count: 220, spread: 110, angle: 90, startVelocity: 78,
          decay: 0.91, gravity: 1.4, drift: 0, scalar: 2, ticks: 110,
          colors: ["#0a8df7", "#212121", "#ffd166", "#ef476f", "#06d6a0", "#ffffff"],
          seed: 7,
        };
        const FPS = 30, STEPS_PER_FRAME = 2;   // canvas-confetti ticks at ~60fps
        const ox = X, oy = cy(CFG.confetti.i);

        // mulberry32 — deterministic
        let seed = C.seed >>> 0;
        const rnd = () => {
          seed = (seed + 0x6D2B79F5) >>> 0;
          let t = seed;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };

        // canvas-confetti randomPhysics(), verbatim minus the DOM
        const radAngle = C.angle * (Math.PI / 180);
        const radSpread = C.spread * (Math.PI / 180);
        const fetti = [];
        for (let k = 0; k < C.count; k++) {
          fetti.push({
            x: ox, y: oy,
            wobble: rnd() * 10, wobbleSpeed: Math.min(0.11, rnd() * 0.1 + 0.05),
            velocity: C.startVelocity * 0.5 + rnd() * C.startVelocity,
            angle2D: -radAngle + (0.5 * radSpread - rnd() * radSpread),
            tiltAngle: (rnd() * (0.75 - 0.25) + 0.25) * Math.PI,
            color: C.colors[Math.floor(rnd() * C.colors.length)],
            shape: rnd() < 0.5 ? "circle" : "square",
            tick: 0, totalTicks: C.ticks, decay: C.decay,
            drift: C.drift, random: rnd() + 2, ovalScalar: 0.6, scalar: C.scalar,
            gravity: C.gravity * 3,
          });
        }

        // bake: one snapshot per output frame, all particles
        const FRAMES = Math.ceil(C.ticks / STEPS_PER_FRAME) + 1;
        const baked = [];
        for (let f = 0; f < FRAMES; f++) {
          baked.push(fetti.map((p) => {
            const wobbleX = p.x + 10 * p.scalar * Math.cos(p.wobble);
            const wobbleY = p.y + 10 * p.scalar * Math.sin(p.wobble);
            return {
              x: p.x, y: p.y, wobbleX, wobbleY,
              tiltSin: Math.sin(p.tiltAngle), tiltCos: Math.cos(p.tiltAngle),
              random: p.random, color: p.color, shape: p.shape,
              alpha: Math.max(0, 1 - p.tick / p.totalTicks),
              scalar: p.scalar, ovalScalar: p.ovalScalar,
            };
          }));
          for (let sidx = 0; sidx < STEPS_PER_FRAME; sidx++) {
            for (const p of fetti) {
              p.x += Math.cos(p.angle2D) * p.velocity + p.drift;
              p.y += Math.sin(p.angle2D) * p.velocity + p.gravity;
              p.velocity *= p.decay;
              p.wobble += p.wobbleSpeed;
              p.tiltAngle += 0.1;
              p.tick++;
            }
          }
        }

        const canvas = document.getElementById("confetti");
        const ctx = canvas.getContext("2d");
        function draw(frame) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          if (frame < 0 || frame >= FRAMES) return;
          for (const q of baked[frame]) {
            if (q.alpha <= 0) continue;
            const x1 = q.x + q.random * q.tiltCos;
            const y1 = q.y + q.random * q.tiltSin;
            const x2 = q.wobbleX + q.random * q.tiltCos;
            const y2 = q.wobbleY + q.random * q.tiltSin;
            ctx.fillStyle = q.color;
            ctx.globalAlpha = q.alpha;
            ctx.beginPath();
            if (q.shape === "circle") {
              ctx.ellipse(q.x, q.y,
                Math.abs(x2 - x1) * q.ovalScalar, Math.abs(y2 - y1) * q.ovalScalar,
                (Math.PI / 10) * q.random, 0, 2 * Math.PI);
            } else {
              ctx.moveTo(Math.floor(q.x), Math.floor(q.y));
              ctx.lineTo(Math.floor(q.wobbleX), Math.floor(y1));
              ctx.lineTo(Math.floor(x2), Math.floor(y2));
              ctx.lineTo(Math.floor(x1), Math.floor(q.wobbleY));
            }
            ctx.closePath();
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }

        // drive the baked table from the timeline so seeks land on the right frame
        const cursor = { f: -1 };
        tl.to(cursor, {
          f: FRAMES - 1, duration: (FRAMES - 1) / FPS, ease: "none",
          onUpdate() { draw(Math.round(cursor.f)); },
          onReverseComplete() { draw(-1); },
        }, CFG.confetti.at);
        // before the burst the canvas must be empty on any seek
        tl.set(cursor, { f: -1, onComplete() { draw(-1); } }, 0);
      }

      // the tick: node squashes, fills blue, check draws, label goes dark,
      // sign-off pill pops, then the rail below fills toward the next step.
      // Go Live (last index) only takes the squash-and-pop — it is a
      // destination, not a checkbox.
      for (const { i, at: t } of CFG.ticks) {
        if (i < 0 || i >= n) continue;
        tl.to(nodes[i], { scale: 0.86, duration: 0.14, ease: "power2.in" }, t - 0.14);
        tl.to(nodes[i], { scale: 1, duration: 0.5, ease: "back.out(2.2)" }, t);
        if (i === n - 1) {
          tl.fromTo(texts[i], { scale: 1 }, { scale: 1.06, duration: 0.5, ease: "back.out(2.2)",
            transformOrigin: "left center" }, t);
          continue;
        }
        tl.to(nodes[i], { borderColor: ACCENT, duration: 0.2 }, t);
        tl.to(fills[i], { scale: 1, duration: 0.32, ease: "power3.out" }, t);
        tl.to(nodes[i].querySelector(".icon"), { autoAlpha: 0, duration: 0.15 }, t);
        tl.set(checks[i], { autoAlpha: 1 }, t + 0.16);
        tl.to(checks[i], { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" }, t + 0.16);
        tl.to(texts[i], { color: INK, duration: 0.3 }, t + 0.1);
        if (pills[i]) {
          tl.fromTo(pills[i], { autoAlpha: 0, scale: 0.6, x: -10 },
            { autoAlpha: 1, scale: 1, x: 0, duration: 0.45, ease: "back.out(1.7)" }, t + 0.45);
        }
        tl.to(blueSegs[i], { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, t + 0.7);
      }
    </script>
  </body>
</html>
