<!doctype html>
<html lang="en" data-resolution="landscape" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme/tokens.css" />
    <link rel="stylesheet" href="theme/fonts.css" />
    <style>
      /* ------------------------------------------------------------------
         frappectl explainer thumbnail.
         Left: "Frappe CLI for AI agents" kicker (violet marker stroke, same
         as the FF August thumbnail) over "frappectl" in mono with a violet
         block cursor. Right: the real frame (00:00.10 of the final cut),
         room kept, fading into the surface on the left. No cutout.
         ------------------------------------------------------------------ */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: var(--surface-base);
        font-family: var(--font-text);
      }

      /* Native plate (1920x1080): subject centre x960, head top y65.
         Scaled 1.12 from the top-left, shifted (330, -40): subject centre
         x1405, head top y33. */
      .photo-wrap {
        position: absolute; inset: 0;
        -webkit-mask-image: linear-gradient(90deg, transparent 38%, #000 58%);
                mask-image: linear-gradient(90deg, transparent 38%, #000 58%);
      }
      .photo {
        position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        transform-origin: 0 0;
        transform: translate(330px, -40px) scale(1.12);
      }

      .col {
        position: absolute; left: 110px; top: 0; bottom: 0; width: 1000px;
        display: flex; flex-direction: column; justify-content: center;
      }
      .kicker {
        font-size: 96px; line-height: 1.02;
        font-weight: var(--fw-bold); letter-spacing: -0.03em;
        color: var(--ink-gray-9);
        margin-left: 6px;
      }
      .kicker .line { display: block; }
      /* marker stroke — same geometry as the title cards */
      .mark { display: inline-block; position: relative; }
      .mark > span { position: relative; z-index: 1; }
      .mark::before {
        content: ""; position: absolute; z-index: 0;
        top: 0.40em; bottom: 0.02em; left: -0.06em; right: -0.14em;
        background: var(--surface-violet-6);
        border-radius: 0.14em 0.22em 0.18em 0.1em;
        transform: rotate(-1.5deg) skewX(-8deg);
      }
      .headline {
        margin-top: 44px;
        font-family: var(--font-mono);
        font-size: 168px; line-height: 1;
        font-weight: 800; letter-spacing: -0.04em;
        color: var(--ink-gray-9);
        display: flex; align-items: center;
      }
      .cursor {
        display: inline-block;
        width: 0.52em; height: 0.92em;
        margin-left: 0.08em;
        background: var(--surface-violet-6);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main"
         data-start="0" data-duration="1" data-fps="30"
         data-width="1920" data-height="1080">
      <div class="photo-wrap">
        <img class="photo" src="assets/img/hussain-plate-frappectl-graded.png" alt="" />
      </div>

      <div class="col">
        <div class="kicker">
          <span class="line">Frappe CLI for</span>
          <span class="line"><span class="mark"><span>AI agents</span></span></span>
        </div>
        <h1 class="headline"><span>frappectl</span><span class="cursor"></span></h1>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
