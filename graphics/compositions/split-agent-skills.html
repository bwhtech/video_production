<!doctype html>
<html lang="en" data-resolution="landscape" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="theme/tokens.css" />
    <link rel="stylesheet" href="theme/fonts.css" />
    <style>
      /* ------------------------------------------------------------------
         Agent skills — "the agent has to reverse engineer each app's flow".
         Agent on top, the two example apps at the bottom. Each column is the
         workflow the agent must discover: every step shows up as a dashed
         "? ? ?" and resolves into the real name. Wiki = real change-request
         APIs + statuses (wiki_change_request.py); Insights = real v3 doctype
         order (Workbook → Query → Chart → Dashboard). On "burn tokens" the
         "Reverse engineering" headers become the amber cost badge; on
         "agent skills" each chain folds into a SKILL.md card.
         Same full-frame slide-in panel as split-api-vs-frappectl.html.
         ------------------------------------------------------------------ */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; background: transparent;
        color: var(--ink-gray-9); font-family: var(--font-text); }
      .stage { position: absolute; inset: 0; }
      .panel { position: absolute; inset: 0; overflow: hidden; background: var(--surface-base); }
      svg.lucide { stroke-width: 1.75; }

      .bar { position: absolute; height: 100px; border-radius: 24px; display: flex; align-items: center; justify-content: center;
        gap: 20px; background: var(--surface-gray-2); border: 2px solid var(--outline-gray-3); font-size: 42px; font-weight: 650; }
      .bar svg { width: 50px; height: 50px; color: var(--ink-gray-7); }
      .bar.top { top: 36px; left: 80px; right: 80px; }
      .bar.bl { bottom: 36px; left: 80px; width: 840px; }
      .bar.br { bottom: 36px; right: 80px; width: 840px; }

      .col { position: absolute; top: 156px; bottom: 156px; width: 840px; }
      .col.l { left: 80px; }
      .col.r { right: 80px; }
      .divider { position: absolute; left: 959px; top: 156px; bottom: 156px; width: 2px;
        background: var(--outline-gray-2); transform-origin: 50% 0; }
      .pipe { position: absolute; top: -20px; bottom: -20px; left: 18px; width: 0; transform-origin: 50% 0; }
      .pipe.gray { border-left: 4px dashed var(--outline-gray-4); }
      .pipe.brand { border-left: 4px solid var(--brand); }

      /* header: plain label, cost badge and "Skill" label share one slot */
      .hd { position: absolute; left: 56px; top: 22px; right: 0; height: 44px; }
      .hd > * { position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: inline-flex; align-items: center;
        gap: 12px; font: 600 26px/1 var(--font-text); color: var(--ink-gray-8); white-space: nowrap; }
      .hd em { font-style: normal; font-weight: 500; color: var(--ink-gray-6); }
      .hd svg { width: 30px; height: 30px; color: var(--ink-gray-6); }
      .hd .cost { padding: 10px 18px; border-radius: 999px; background: var(--surface-amber-2); color: var(--ink-amber-9); }
      .hd .cost svg { color: currentColor; width: 26px; height: 26px; }
      .hd .sk svg { color: var(--brand); }

      /* each step is a slot: a dashed "? ? ?" placeholder under the real node */
      .nodes { position: absolute; left: 56px; right: 0; top: 76px; display: grid; gap: 14px; }
      .slot { position: relative; height: 104px; }
      .slot.tall { height: 128px; }
      .node { position: absolute; inset: 0; display: flex; align-items: center; gap: 20px; padding: 0 26px; border-radius: 16px;
        background: var(--surface-gray-1); border: 2px solid var(--outline-gray-3); }
      .node svg { width: 36px; height: 36px; color: var(--ink-gray-6); flex: none; }
      .node .t { display: grid; gap: 8px; flex: 1; min-width: 0; }
      .node .n { font: 600 32px/1 var(--font-text); color: var(--ink-gray-9); }
      .node .api { font: 500 27px/1 var(--font-mono); color: var(--ink-gray-9); font-variant-ligatures: none; }
      .node .d { font: 500 22px/1 var(--font-mono); color: var(--ink-gray-6); font-variant-ligatures: none; }
      .node .api, .node .n { width: max-content; }
      .node.q { background: transparent; border-style: dashed; }
      .node.q span { font: 500 27px/1 var(--font-mono); color: var(--ink-gray-6); letter-spacing: 0.2em; }
      .node .hl { position: absolute; inset: -2px; border-radius: 16px; border: 2px solid var(--brand); background: var(--surface-violet-1); z-index: -1; }
      .node { isolation: isolate; }

      .badge { font: 600 22px/1 var(--font-text); padding: 9px 16px; border-radius: 999px; white-space: nowrap;
        display: inline-flex; align-items: center; gap: 8px; background: var(--surface-gray-3); color: var(--ink-gray-7); }
      .badge.blue { background: var(--surface-blue-2); color: var(--ink-blue-9); }
      .badge.green { background: var(--surface-green-2); color: var(--ink-green-9); }
      .badge.violet { background: var(--surface-violet-2); color: var(--ink-violet-9); }
      .badge.amber { background: var(--surface-amber-2); color: var(--ink-amber-9); }

      .skill { position: absolute; left: 56px; right: 0; top: 250px; border-radius: 20px; border: 2px solid var(--brand);
        background: var(--surface-violet-1); padding: 30px 34px; display: grid; gap: 18px; }
      .skill .h { display: flex; align-items: center; gap: 16px; font: 700 34px/1 var(--font-mono); color: var(--ink-gray-9); }
      .skill .h svg { width: 40px; height: 40px; color: var(--brand); }
      .skill .h small { margin-left: auto; font: 600 22px/1 var(--font-text); color: var(--brand-ink); }
      .skill .ln { display: block; width: max-content; font: 400 24px/1.45 var(--font-mono); color: var(--ink-gray-7);
        white-space: pre; font-variant-ligatures: none; }
    </style>
  </head>
  <body>
    <div id="root" data-theme="light" data-composition-id="main"
         data-start="0" data-duration="51.9" data-fps="30"
         data-width="1920" data-height="1080">
      <div class="stage clip" id="stage" data-start="0" data-duration="51.9" data-track-index="0">
      <div class="panel" id="panel">
        <div class="bar top"><i data-lucide="bot"></i>Agent</div>

        <div class="col l" id="colL">
          <div class="pipe gray" id="pipeLg"></div>
          <div class="pipe brand" id="pipeL"></div>
          <div class="hd">
            <span id="reL"><i data-lucide="scan-search"></i>Reverse engineering <em>· change requests</em></span>
            <span class="cost" id="costL"><i data-lucide="coins"></i>reverse engineering</span>
            <span class="sk" id="skL"><i data-lucide="sparkles"></i>Skill</span>
          </div>
          <div class="nodes" id="nodesL"></div>
          <div class="skill" id="cardL"></div>
        </div>

        <div class="divider" id="divider"></div>

        <div class="col r" id="colR">
          <div class="pipe gray" id="pipeRg"></div>
          <div class="pipe brand" id="pipeR"></div>
          <div class="hd">
            <span id="reR"><i data-lucide="scan-search"></i>Reverse engineering <em>· doctypes &amp; workflows</em></span>
            <span class="cost" id="costR"><i data-lucide="coins"></i>reverse engineering</span>
            <span class="sk" id="skR"><i data-lucide="sparkles"></i>Skill</span>
          </div>
          <div class="nodes" id="nodesR"></div>
          <div class="skill" id="cardR"></div>
        </div>

        <div class="bar bl"><i data-lucide="book-open"></i>Frappe Wiki</div>
        <div class="bar br"><i data-lucide="chart-column-big"></i>Frappe Insights</div>
      </div>
      </div>

      <!-- VO (skills.wav, whole clip), for sync review; drop for the alpha render -->
      <audio id="vo" src="assets/skills.wav"
             data-start="0" data-duration="48.2" data-track-index="1" data-volume="1"></audio>
    </div>

    <script>
      // ---------------------------------------------------------------- knobs
      // Cue times are seconds in skills.wav (Scribe word starts). SRC_AT = 0.
      const SRC_AT = 0;
      const CFG = {
        // Each step: [placeholder appears, resolves into the real name]
        wiki: [
          [15.38, 16.68],   // "figure out" → "APIs"
          [17.28, 18.60],   // "Frappe Wiki uses" → "documentation"
          [20.62, 21.26],   // "follow" → "change request"
          [22.84, 23.60],   // "So it has to" → "figure out"
          [24.16, 24.76],   // "this" → "merge"
        ],
        insights: [
          [32.74, 36.88],   // "own concepts" … stuck until "created"
          [38.52, 39.10],   // → "query"
          [39.76, 40.26],   // → "chart"
          [40.66, 41.26],   // → "dashboard"
        ],
        cues: {
          first: 9.14,       // "First is" — Wiki header
          merge: 24.76,      // highlight merge_change_request
          submit: 25.88,     // "submit for review" — highlight submit_change_request
          second: 27.90,     // "Second example" — focus moves right
          createdFirst: 37.32,
          both: 42.14,       // "So agent can figure it out" — both columns back
          tokens: 43.70,     // "burn tokens" — headers become the cost badge
          encaps: 45.34,     // "encapsulate" — chains fold away
          knowledge: 46.48,  // SKILL.md cards land
          skills: 47.60,     // "agent skills" — lines go violet
        },
        lead: 0.1,
        dimTo: 0.35,
        cps: 70,             // resolve typing speed (chars/second)
        slideIn: 0.7,
        exitAt: 51.2,        // ~3s hold after "skills"
        slideOut: 0.7,
        end: 51.9,
      };
      const T = (src) => src - SRC_AT - CFG.lead;

      // --------------------------------------------------------------- data
      const WIKI = [
        ['create_change_request', 'Draft', ''],
        ['create_cr_page', 'Draft', ''],
        ['submit_change_request', 'In Review', 'blue'],
        ['approve_change_request', 'Approved', 'green'],
        ['merge_change_request', 'Merged', 'violet'],
      ];
      const INSIGHTS = [
        ['book-open-check', 'Workbook', 'Insights Workbook'],
        ['database', 'Query', 'Insights Query v3'],
        ['chart-column', 'Chart', 'Insights Chart v3'],
        ['layout-dashboard', 'Dashboard', 'Insights Dashboard v3'],
      ];
      const SKILL = {
        L: ['frappe-wiki/SKILL.md', ['1. create_change_request', '2. create_cr_page / update_cr_page', '3. submit → approve → merge']],
        R: ['frappe-insights/SKILL.md', ['1. Workbook first', '2. Query → Chart', '3. Dashboard']],
      };

      // -------------------------------------------------------------- build
      const q = '<div class="node q"><i data-lucide="search"></i><span>? ? ?</span></div>';
      document.getElementById('nodesL').innerHTML = WIKI.map(([api, st, c]) => `
        <div class="slot">${q}<div class="node real"><span class="hl"></span><i data-lucide="code-xml"></i>
          <div class="t"><span class="api">${api}</span></div><span class="badge ${c}">${st}</span></div></div>`).join('');
      document.getElementById('nodesR').innerHTML = INSIGHTS.map(([ic, name, dt], i) => `
        <div class="slot tall">${q}<div class="node real"><span class="hl"></span><i data-lucide="${ic}"></i>
          <div class="t"><span class="n">${name}</span><span class="d">${dt}</span></div>
          ${i === 0 ? '<span class="badge amber" id="firstBadge">created first</span>' : ''}</div></div>`).join('');
      for (const k of ['L', 'R']) {
        const [path, lines] = SKILL[k];
        document.getElementById('card' + k).innerHTML =
          `<div class="h"><i data-lucide="file-text"></i>${path}<small>agent skill</small></div>` +
          lines.map((l) => `<span class="ln">${l}</span>`).join('');
      }
      lucide.createIcons();

      // ------------------------------------------------------------- curves
      function bezier(x1, y1, x2, y2) {
        const c = (a, b, t) => 3 * (1 - t) * (1 - t) * t * a + 3 * (1 - t) * t * t * b + t * t * t;
        return (x) => {
          let lo = 0, hi = 1, t = x;
          for (let i = 0; i < 30; i++) {
            t = (lo + hi) / 2;
            if (c(x1, x2, t) < x) lo = t; else hi = t;
          }
          return c(y1, y2, t);
        };
      }
      const easeOut = bezier(0.23, 1, 0.32, 1);
      const easeInOut = bezier(0.77, 0, 0.175, 1);
      const typed = (n) => (p) => Math.floor(p * n) / n;

      // ----------------------------------------------------------- timeline
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const c = CFG.cues;
      const $ = (id) => document.getElementById(id);
      const up = (targets, at, stagger = 0) =>
        tl.fromTo(targets, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: easeOut, stagger }, at);
      const pop = (targets, at) =>
        tl.fromTo(targets, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.4, ease: easeOut }, at);
      const draw = (targets, at, d = 0.8) =>
        tl.fromTo(targets, { scaleY: 0 }, { scaleY: 1, duration: d, ease: easeInOut }, at);
      const type = (el, at) => {
        const n = el.textContent.length;
        tl.fromTo(el, { clipPath: 'inset(-20% 100% -20% 0)' },
          { clipPath: 'inset(-20% 0% -20% 0)', duration: Math.max(n / CFG.cps, 0.1), ease: typed(n), immediateRender: false }, at);
      };

      const slotsL = [...$('nodesL').children];
      const slotsR = [...$('nodesR').children];
      const Q = (slot) => slot.querySelector('.q');
      const R = (slot) => slot.querySelector('.real');

      // Hidden until their cue, so a seek to 0 shows a clean frame.
      tl.set(['#reL', '#reR', '#costL', '#costR', '#skL', '#skR', '#cardL', '#cardR',
        ...slotsL.map(Q), ...slotsL.map(R), ...slotsR.map(Q), ...slotsR.map(R)], { opacity: 0 }, 0);
      tl.set([...document.querySelectorAll('.hl')], { opacity: 0 }, 0);
      tl.set(['#pipeL', '#pipeR'], { scaleY: 0 }, 0);

      // 0 · entry — panel slides up; divider and dashed lines draw down.
      tl.fromTo('#panel', { yPercent: 100 }, { yPercent: 0, duration: CFG.slideIn, ease: easeOut }, 0);
      draw('#divider', 0.35, 0.7);
      draw(['#pipeLg', '#pipeRg'], 0.4);

      // A step: dashed placeholder while the agent digs, then the real node types in.
      function discover(slot, [qAt, rAt]) {
        up(Q(slot), T(qAt));
        tl.to(Q(slot), { opacity: 0, duration: 0.2, ease: easeOut }, T(rAt));
        tl.fromTo(R(slot), { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.35, ease: easeOut }, T(rAt));
        R(slot).querySelectorAll('.api, .n').forEach((el) => type(el, T(rAt) + 0.05));
      }
      const hl = (slot, on, at) => tl.to(slot.querySelector('.hl'), { opacity: on ? 1 : 0, duration: 0.3, ease: easeOut }, at);

      // 1 · Wiki — reverse engineering the change-request flow.
      up('#reL', T(c.first));
      tl.set('#colR', { opacity: CFG.dimTo }, 0);
      slotsL.forEach((s, i) => discover(s, CFG.wiki[i]));
      hl(slotsL[4], 1, T(c.merge) + 0.3);
      hl(slotsL[2], 1, T(c.submit));

      // 2 · Insights — focus moves right; the first step sits unresolved until "created first".
      tl.to('#colL', { opacity: CFG.dimTo, duration: 0.5, ease: easeInOut }, T(c.second));
      tl.to('#colR', { opacity: 1, duration: 0.5, ease: easeInOut }, T(c.second));
      hl(slotsL[4], 0, T(c.second));
      hl(slotsL[2], 0, T(c.second));
      up('#reR', T(c.second) + 0.2);
      slotsR.forEach((s, i) => discover(s, CFG.insights[i]));
      tl.set('#firstBadge', { opacity: 0 }, 0);
      pop('#firstBadge', T(c.createdFirst));

      // 3 · "burn tokens" — both back; the headers turn into the cost badge.
      tl.to('#colL', { opacity: 1, duration: 0.5, ease: easeInOut }, T(c.both));
      tl.to(['#reL', '#reR'], { opacity: 0, duration: 0.2, ease: easeOut }, T(c.tokens));
      pop(['#costL', '#costR'], T(c.tokens));

      // 4 · encapsulate — chains fold away, SKILL.md cards land, lines go violet.
      for (const [slots, k] of [[slotsL, 'L'], [slotsR, 'R']]) {
        tl.to(slots.slice().reverse(), { opacity: 0, y: -10, scale: 0.97, duration: 0.35, ease: easeOut, stagger: 0.05 }, T(c.encaps));
        tl.to(`#cost${k}`, { opacity: 0, duration: 0.2, ease: easeOut }, T(c.encaps));
        up(`#sk${k}`, T(c.knowledge) - 0.2);
        tl.fromTo(`#card${k}`, { opacity: 0, y: 24, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: easeOut }, T(c.knowledge));
        const lines = [...$(`card${k}`).querySelectorAll('.ln')];
        tl.set(lines, { clipPath: 'inset(-20% 100% -20% 0)' }, 0);
        let t = T(c.knowledge) + 0.3;
        for (const el of lines) { type(el, t); t += el.textContent.length / (CFG.cps * 1.6); }
      }
      draw(['#pipeL', '#pipeR'], T(c.skills));

      // Exit the way it entered.
      tl.to('#panel', { yPercent: 100, duration: CFG.slideOut, ease: easeInOut }, CFG.exitAt);
      tl.set({}, {}, CFG.end);
      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
