<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme/fonts.css" />
    <style>
      /* ------------------------------------------------------------------
         Chapter 14 — the reload. Replaces the ERPNext report frames after
         "If I just reload" (highlight boxes, a black rectangle on the chart,
         and the asterisk note about the hidden temporary account).
         Three stat tiles mirror ERPNext's own summary row: on "reload" the
         figures roll from the pre-invoice state to the final one; on
         "tallying" the equation Liabilities + Equity = Assets locks; on
         "become zero" the Temporary Opening tile counts to 0 and collapses,
         with a caption explaining why the report hides it; "completion"
         lands a pill. Cut to timeline-06-go-live on "ready to go live".
         Composition starts at SOURCE 06:02.00 (362.0s); cues are source − 362.
         ------------------------------------------------------------------ */
      :root {
        --card-bg: #ececec;
        --panel: #ffffff;
        --line: #d6d6d6;
        --ink: #212121;
        --ink-muted: #5c5c5c;
        --accent: #0a8df7;
        --accent-soft: #e0f0fe;
        --accent-ink: #0b6fc2;
        --ok: #14783f;
        --ok-soft: #dcf5e7;
        --font-text: "Inter", system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: transparent;
        font-family: var(--font-text);
        color: var(--ink);
      }
      .stage { position: absolute; inset: 0; overflow: hidden; background: var(--card-bg); }
      .grid {
        position: absolute; inset: 0;
        background-image: radial-gradient(#d2d2d2 1.5px, transparent 1.5px);
        background-size: 48px 48px;
        opacity: 0.5;
      }

      .title { position: absolute; left: 140px; top: 72px; will-change: opacity, transform; }
      .title h1 { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
      .title p  { margin-top: 10px; font-size: 22px; font-weight: 500; color: var(--ink-muted); }

      .tile {
        position: absolute;
        display: flex; flex-direction: column; justify-content: center; gap: 14px;
        padding: 0 40px;
        white-space: nowrap;
        border-radius: 20px;
        background: var(--panel);
        border: 1.5px solid var(--line);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04), 0 28px 48px -28px rgba(33, 33, 33, 0.22);
        will-change: transform, opacity;
      }
      .tile .label { font-size: 24px; font-weight: 500; color: var(--ink-muted); }
      .tile .value {
        font-size: 64px; font-weight: 600; letter-spacing: -0.025em; line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .tile .row { display: flex; align-items: baseline; gap: 18px; }
      .tile .delta {
        display: inline-flex; align-items: center;
        height: 36px; padding: 0 12px; border-radius: 999px;
        font-size: 20px; font-weight: 600; letter-spacing: 0;
        font-variant-numeric: tabular-nums;
        background: var(--accent-soft); color: #0a5aa0;
        will-change: transform, opacity;
      }
      .tile .delta.same { background: #ebebeb; color: var(--ink-muted); }
      .tile.temp { flex-direction: row; align-items: center; justify-content: space-between; gap: 0; padding: 0 32px; }
      .tile.temp .value { font-size: 40px; color: var(--ink-muted); }
      .tile.temp .label { white-space: nowrap; font-size: 22px; }
      .tile .ring {
        position: absolute; inset: -2px; border-radius: 21px;
        border: 2.5px solid var(--accent); opacity: 0; pointer-events: none;
      }

      /* the equation: Liabilities + Equity = Assets */
      .eqn {
        position: absolute; left: 140px; top: 500px;
        display: flex; align-items: center; gap: 28px;
      }
      .eqn .term { display: flex; flex-direction: column; gap: 6px; will-change: transform, opacity; }
      .eqn .term .n {
        font-size: 52px; font-weight: 600; letter-spacing: -0.02em; line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .eqn .term .l { font-size: 20px; font-weight: 500; color: var(--ink-muted); }
      .eqn .op {
        width: 52px; height: 52px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        background: #e3e3e3; color: var(--ink);
        will-change: transform, opacity;
      }
      .eqn .op.eq { background: var(--accent); color: #fff; box-shadow: 0 10px 24px -6px rgba(10, 141, 247, 0.6); }
      .eqn .op svg { width: 22px; height: 22px; display: block; }
      .eqn .tally {
        display: inline-flex; align-items: center; gap: 8px;
        height: 40px; padding: 0 14px; margin-left: 12px;
        border-radius: 999px;
        background: var(--ok-soft); color: var(--ok);
        font-size: 21px; font-weight: 600;
        will-change: transform, opacity;
      }
      .eqn .tally svg { width: 20px; height: 20px; }

      .note {
        position: absolute; left: 140px; top: 700px;
        display: flex; align-items: center; gap: 12px;
        font-size: 22px; font-weight: 500; color: var(--ink-muted);
        will-change: opacity, transform;
      }
      .note svg { width: 24px; height: 24px; flex: none; }

      .pill {
        position: absolute; left: 140px; top: 700px;
        display: inline-flex; align-items: center; gap: 12px;
        height: 66px; padding: 0 26px;
        border-radius: 999px;
        background: var(--ink); color: #fff;
        font-size: 26px; font-weight: 600; letter-spacing: -0.005em;
        white-space: nowrap;
        box-shadow: 0 16px 32px -12px rgba(0, 0, 0, 0.35);
        will-change: transform, opacity;
      }
      .pill svg { width: 28px; height: 28px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main"
         data-start="0" data-duration="19" data-fps="30"
         data-width="1920" data-height="1080">
      <div class="stage clip" id="stage"
           data-start="0" data-duration="19" data-track-index="0">
        <div class="grid"></div>
        <div class="title" id="title"><h1>GizmoWorld balance sheet</h1><p>Fiscal year 2026, after the opening entries</p></div>
        <div id="tiles"></div>
        <div class="eqn" id="eqn"></div>
        <div class="note" id="note"></div>
        <div class="pill" id="pill"></div>
      </div>
    </div>

    <script>
      // ---------------------------------------------------------------- knobs
      const CFG = {
        tile: { w: 480, h: 220, top: 200, xs: [140, 700, 1260] },
        temp: { w: 480, h: 110, top: 500, x: 1260 },
        stats: [
          { label: "Total assets",      from: 60000, to: 80000 },
          { label: "Total liabilities", from: 42000, to: 62000 },
          { label: "Total equity",      from: 18000, to: 18000 },
        ],
        tempOpening: { from: -10000, to: 0 },

        // cues (seconds, composition-local = source − 362.0)
        t: {
          tilesIn:   0.05,
          reload:    0.45,   // "reload"            362.32
          eqnIn:     4.05,   // "asset and liab…"   366.09
          tally:     5.15,   // "tallying"          367.20
          tempRing:  7.25,   // "temporary opening" 369.30
          zero:      9.05,   // "become zero"       371.04
          collapse: 10.25,
          note:     10.55,
          done:     11.40,   // "completion"        373.46
        },
      };

      // ---------------------------------------------------------------- icons
      const ICON = {
        plus: `<path d="M5 12h14"/><path d="M12 5v14"/>`,
        check: `<path d="M20 6 9 17l-5-5"/>`,
        circleCheck: `<circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/>`,
        eyeOff: `<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/>`,
      };
      const svgIcon = (name, sw = 2.2) =>
        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}"
              stroke-linecap="round" stroke-linejoin="round">${ICON[name]}</svg>`;
      const fmt = (n) => (n < 0 ? "−" : "") + Math.abs(n).toLocaleString("en-US");
      const px = (el, o) => Object.assign(el.style, Object.fromEntries(
        Object.entries(o).map(([k, v]) => [k, v + "px"])));

      // --------------------------------------------------------------- build
      const T = CFG.tile;
      const tilesEl = document.getElementById("tiles");
      const tiles = [], values = [], deltas = [];
      CFG.stats.forEach((s, i) => {
        const el = document.createElement("div");
        el.className = "tile";
        el.id = "tile-" + i;
        px(el, { left: T.xs[i], top: T.top, width: T.w, height: T.h });
        const d = s.to - s.from;
        el.innerHTML = `<div class="ring"></div><div class="label">${s.label}</div>
          <div class="row"><div class="value">${fmt(s.from)}</div>
          <div class="delta ${d ? "" : "same"}">${d ? "+" + fmt(d) : "no change"}</div></div>`;
        tilesEl.appendChild(el);
        tiles.push(el);
        values.push(el.querySelector(".value"));
        deltas.push(el.querySelector(".delta"));
      });

      const temp = document.createElement("div");
      temp.className = "tile temp";
      temp.id = "tile-temp";
      px(temp, { left: CFG.temp.x, top: CFG.temp.top, width: CFG.temp.w, height: CFG.temp.h });
      temp.innerHTML = `<div class="ring"></div><div class="label">Temporary Opening</div>
        <div class="value">${fmt(CFG.tempOpening.from)}</div>`;
      tilesEl.appendChild(temp);
      const tempValue = temp.querySelector(".value");

      const eqn = document.getElementById("eqn");
      eqn.innerHTML = `
        <div class="term"><div class="n">62,000</div><div class="l">Liabilities</div></div>
        <div class="op">${svgIcon("plus", 2.6)}</div>
        <div class="term"><div class="n">18,000</div><div class="l">Equity</div></div>
        <div class="op eq"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="7.5" width="16" height="3" rx="1.5"/><rect x="4" y="13.5" width="16" height="3" rx="1.5"/></svg></div>
        <div class="term"><div class="n">80,000</div><div class="l">Assets</div></div>
        <div class="tally">${svgIcon("check", 2.6)}<span>Tallies</span></div>`;
      const terms = [...eqn.querySelectorAll(".term")];
      const opPlus = eqn.querySelector(".op:not(.eq)");
      const opEq = eqn.querySelector(".op.eq");
      const tally = eqn.querySelector(".tally");

      const note = document.getElementById("note");
      note.innerHTML = `${svgIcon("eyeOff", 2)}<span>Zero-balance accounts are hidden in the report — Temporary Opening drops off the balance sheet.</span>`;
      px(note, { left: CFG.temp.x, top: CFG.temp.top + 24 });
      note.style.width = CFG.temp.w + "px";
      note.style.alignItems = "flex-start";
      note.style.lineHeight = "1.3";

      const pill = document.getElementById("pill");
      pill.innerHTML = `${svgIcon("circleCheck")}<span>Opening balances complete</span>`;

      // ------------------------------------------------------------ timeline
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      const t = CFG.t;

      gsap.set(["#title", ...tiles, temp, ...deltas, ...terms, opPlus, opEq, tally, note, pill], { autoAlpha: 0 });

      // cut in: everything present almost at once (waterfall), pre-invoice figures
      tl.fromTo("#title", { autoAlpha: 0, y: -10 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out" }, t.tilesIn);
      tl.fromTo([...tiles, temp], { autoAlpha: 0, y: 24 },
        { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.06 }, t.tilesIn);

      // "reload" — the figures roll to the final state
      CFG.stats.forEach((s, i) => {
        if (s.to === s.from) return;
        const c = { v: s.from };
        tl.to(c, { v: s.to, duration: 0.9, ease: "power2.out", snap: { v: 1 },
          onUpdate: () => values[i].textContent = fmt(Math.round(c.v)) }, t.reload + i * 0.08);
      });
      tl.fromTo(deltas, { autoAlpha: 0, x: -8 },
        { autoAlpha: 1, x: 0, duration: 0.35, ease: "power3.out", stagger: 0.08 }, t.reload + 0.75);

      // "asset and liabilities are tallying" — the equation assembles, then locks
      tl.fromTo([terms[0], opPlus, terms[1], opEq, terms[2]], { autoAlpha: 0, y: 14 },
        { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.07 }, t.eqnIn);
      tl.fromTo(opEq, { scale: 0.6 }, { scale: 1, duration: 0.45, ease: "back.out(1.7)" }, t.tally);
      tl.fromTo(tally, { autoAlpha: 0, scale: 0.85, x: -8 },
        { autoAlpha: 1, scale: 1, x: 0, duration: 0.4, ease: "back.out(1.6)" }, t.tally + 0.1);
      tl.to(tiles[0], { borderColor: "#0a8df7", duration: 0.35 }, t.tally);

      // "balance in the temporary opening account has become zero"
      tl.to(temp.querySelector(".ring"), { opacity: 1, duration: 0.3 }, t.tempRing);
      const tc = { v: CFG.tempOpening.from };
      tl.to(tc, { v: 0, duration: 0.7, ease: "power2.inOut", snap: { v: 1 },
        onUpdate: () => tempValue.textContent = fmt(Math.round(tc.v)) }, t.zero);
      tl.to(tempValue, { color: "#14783f", duration: 0.3 }, t.zero + 0.6);
      tl.to(temp, { autoAlpha: 0, scaleY: 0.6, transformOrigin: "50% 0%", duration: 0.4, ease: "power2.in" }, t.collapse);
      tl.fromTo(note, { autoAlpha: 0, y: -8 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, t.note);

      // "this confirms completion"
      tl.fromTo(pill, { autoAlpha: 0, y: 18, scale: 0.92 },
        { autoAlpha: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, t.done);
    </script>
  </body>
</html>
