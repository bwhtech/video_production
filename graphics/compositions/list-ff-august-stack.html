<!doctype html>
<html lang="en" data-resolution="landscape" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="theme/tokens.css" />
    <link rel="stylesheet" href="theme/fonts.css" />
    <style>
      /* ------------------------------------------------------------------
         Agenda list — focus stack (What's New in FF).
         Transparent overlay on the right (or left) third. Four separate
         cards; the one the VO is on opens up to show a one-line summary
         and takes a violet edge, the rest stay compact and step back.
         The stack re-flows around the open card on every cue.
         ------------------------------------------------------------------ */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: transparent;
        font-family: var(--font-text);
      }

      .item { position: absolute; left: 0; top: 0; will-change: transform, opacity, filter; }
      .bg {
        position: absolute; left: 0; top: 0; right: 0;
        background: color-mix(in srgb, var(--surface-base) 94%, transparent);
        border: 2px solid var(--outline-gray-2);
        border-radius: calc(var(--radius-2xl) * 1.3);
        box-shadow: 0 18px 48px -12px rgb(0 0 0 / 0.45);
      }
      .ring {  /* violet edge, faded in on the open card */
        position: absolute; inset: -2px;
        border: 3px solid var(--brand);
        border-radius: inherit;
        opacity: 0;
      }
      .chip {
        position: absolute; left: 24px; top: 22px;
        width: 56px; height: 56px;
        border-radius: calc(var(--radius-xl) * 1);
        display: flex; align-items: center; justify-content: center;
        font-size: 26px; font-weight: var(--fw-semibold);
        font-variant-numeric: tabular-nums;
        color: var(--ink-gray-7);
        background: var(--surface-gray-3);
      }
      .chip .fill {
        position: absolute; inset: 0; border-radius: inherit;
        background: var(--brand); opacity: 0;
      }
      .chip .n { position: relative; }
      .chip .check {
        position: absolute; width: 30px; height: 30px;
        color: var(--violet-400); opacity: 0;
      }
      .title {
        position: absolute; left: 104px; top: 22px; height: 56px;
        display: flex; align-items: center;
        font-size: 40px; font-weight: var(--fw-semibold); letter-spacing: -0.02em;
        color: var(--ink-gray-9);
        white-space: nowrap;
      }
      .desc {
        position: absolute; left: 104px; top: 90px;
        font-size: 28px; font-weight: var(--fw-regular); letter-spacing: -0.005em;
        color: var(--ink-gray-7);
        white-space: nowrap;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main"
         data-start="0" data-duration="27.6" data-fps="30"
         data-width="1920" data-height="1080">
      <div class="clip" id="stage"
           data-start="0" data-duration="27.6" data-track-index="0"
           style="position:absolute; inset:0;"></div>

      <audio id="vo" src="assets/index-list.wav"
             data-start="0" data-duration="26.733" data-track-index="1" data-volume="1"></audio>
    </div>

    <script>
      // ---------------------------------------------------------------- knobs
      const CFG = {
        side: "right",   // "right" | "left"
        items: [
          { title: "Disable Apps", desc: "Turn apps off without uninstalling" },
          { title: "Doc Events in Recorder", desc: "Document lifecycle events, recorded" },
          { title: "Awesome Bar Search Hook", desc: "Add your own results to the search" },
          { title: "Custom SVG Icons", desc: "Your own icons, across the framework" },
        ],
        // VO word starts: First 2.10, Second 7.04, Third 13.78, And last 20.46
        cues: [2.10, 7.04, 13.78, 20.46],
        lead: 0.2,
        dimTo: 0.5,
        inAt: 0.3,
        exitAt: 26.95,

        // geometry (px)
        width: 680,
        margin: 72,
        closedH: 100,
        openH: 150,
        gap: 16,
        reflow: 0.55,    // on-screen movement between states
      };
      const DUR = 27.6; // keep in sync with data-duration on #root and #stage

      // ------------------------------------------------------------- curves
      function bezier(x1, y1, x2, y2) {
        const c = (a, b, t) => 3 * (1 - t) * (1 - t) * t * a + 3 * (1 - t) * t * t * b + t * t * t;
        return (x) => {
          let lo = 0, hi = 1, t = x;
          for (let i = 0; i < 30; i++) {
            t = (lo + hi) / 2;
            if (c(x1, x2, t) < x) lo = t; else hi = t;
          }
          return c(y1, y2, t);
        };
      }
      const easeInOut = bezier(0.77, 0, 0.175, 1);
      const easeOut = bezier(0.23, 1, 0.32, 1);
      const easeOutMirror = bezier(0.68, 0, 0.77, 0);
      const SPRING_DUR = 0.8;
      const omega = (2 * Math.PI) / 0.4;
      const spring = (p) => {
        const t = p * SPRING_DUR;
        return p >= 1 ? 1 : 1 - (1 + omega * t) * Math.exp(-omega * t);
      };

      // ------------------------------------------------------------- layout
      // Stack positions for "item `open` is open" (-1 = all closed), centred
      // vertically. Computed up front; nothing is measured at tween time.
      const n = CFG.items.length;
      const layout = (open) => {
        const h = (i) => (i === open ? CFG.openH : CFG.closedH);
        let total = (n - 1) * CFG.gap;
        for (let i = 0; i < n; i++) total += h(i);
        let y = Math.round((1080 - total) / 2);
        return CFG.items.map((_, i) => { const top = y; y += h(i) + CFG.gap; return top; });
      };
      const x0 = CFG.side === "left" ? CFG.margin : 1920 - CFG.margin - CFG.width;
      const fromX = CFG.side === "left" ? -64 : 64;

      const CHECK = '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
      const stage = document.getElementById("stage");
      const cards = CFG.items.map((it, i) => {
        const el = document.createElement("div");
        el.className = "item";
        el.style.width = CFG.width + "px";
        el.innerHTML =
          `<div class="bg"><div class="ring"></div></div>` +
          `<div class="chip"><span class="fill"></span><span class="n">${i + 1}</span>${CHECK}</div>` +
          `<div class="title"></div><div class="desc"></div>`;
        el.querySelector(".title").textContent = it.title;
        el.querySelector(".desc").textContent = it.desc;
        stage.appendChild(el);
        const q = (s) => el.querySelector(s);
        return { el, bg: q(".bg"), ring: q(".ring"), fill: q(".fill"), chip: q(".chip"), n: q(".n"), check: q(".check"), title: q(".title"), desc: q(".desc") };
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;

      // initial state: all closed
      const closed = layout(-1);
      cards.forEach((c, i) => {
        gsap.set(c.el, { x: x0, y: closed[i] });
        gsap.set(c.bg, { height: CFG.closedH });
      });

      // --- entry: cards cascade in from the near edge
      const els = cards.map((c) => c.el);
      tl.fromTo(els, { x: x0 + fromX, scale: 0.97 },
        { x: x0, scale: 1, duration: SPRING_DUR, ease: spring, stagger: 0.08 }, CFG.inAt);
      tl.fromTo(els, { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: easeOut, stagger: 0.08 }, CFG.inAt);

      // --- focus walk
      CFG.cues.forEach((cue, i) => {
        const at = cue - CFG.lead;
        const pos = layout(i);
        cards.forEach((c, j) => {
          tl.to(c.el, { y: pos[j], duration: CFG.reflow, ease: easeInOut }, at);
          if (j !== i) tl.to([c.title, c.chip], { opacity: CFG.dimTo, duration: 0.35, ease: easeOut }, at);
        });
        const cur = cards[i];
        tl.to([cur.title, cur.chip], { opacity: 1, duration: 0.3, ease: easeOut }, at);
        tl.to(cur.bg, { height: CFG.openH, duration: CFG.reflow, ease: easeInOut }, at);
        tl.to(cur.ring, { opacity: 1, duration: 0.35, ease: easeOut }, at + 0.1);
        tl.to(cur.fill, { opacity: 1, duration: 0.3, ease: easeOut }, at + 0.1);
        tl.to(cur.n, { color: "var(--on-brand)", duration: 0.3, ease: easeOut }, at + 0.1);
        tl.fromTo(cur.desc, { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.4, ease: easeOut }, at + 0.3);

        if (i > 0) {
          const prev = cards[i - 1];
          tl.to(prev.bg, { height: CFG.closedH, duration: CFG.reflow, ease: easeInOut }, at);
          tl.to(prev.desc, { opacity: 0, duration: 0.15, ease: easeOut }, at);
          tl.to([prev.ring, prev.fill, prev.n], { opacity: 0, duration: 0.25, ease: easeOut }, at);
          tl.fromTo(prev.check, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: easeOut }, at + 0.15);
        }
      });

      // --- exit: retrace toward the near edge, last card leaves first
      tl.to([...els].reverse(), {
        x: x0 + fromX, scale: 0.97, opacity: 0, filter: "blur(8px)",
        duration: 0.35, ease: easeOutMirror, stagger: 0.05,
      }, CFG.exitAt - 0.2);
    </script>
  </body>
</html>
