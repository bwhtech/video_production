    <script>
      // Build every scene synchronously onto ONE paused master timeline (absolute times from TL).
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const order = Object.keys(TL.scenes);
      for (const id of order) {
        const build = window.SCENES && window.SCENES[id];
        const svg = document.getElementById(id + "-svg");
        const sc = TL.scenes[id];
        // L05: one scene's JS error must not blank the whole lesson (scenes are built in parallel by several authors);
        // errors are collected and re-thrown AFTER the timeline is registered, so `hyperframes check` still fails on them.
        try {
          if (build) build({ svg, tl, K: window.KIT, sc, next: TL.scenes[order[order.indexOf(id) + 1]] });
          else window.PLACEHOLDER(svg, id, sc.title);
        } catch (e) { (window.__sceneErrors = window.__sceneErrors || []).push(id + ": " + (e && e.stack ? e.stack.split("\n").slice(0, 3).join(" | ") : e)); }
      }
      window.SEAMS && window.SEAMS(tl);
      window.__timelines["main"] = tl;
      if (window.__sceneErrors && window.__sceneErrors.length) throw new Error("SCENE BUILD ERRORS — " + window.__sceneErrors.join(" || "));
    </script>
