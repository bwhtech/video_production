<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Paper rig — model sheet</title>
    <link rel="stylesheet" href="kit/fonts.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="kit/icons.js"></script>
    <script src="kit/kit.js"></script>
    <script src="kit/rig.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #b7895a; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .layer { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      svg { display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080">
      <svg width="0" height="0" style="position:absolute">
        <defs>
          <pattern id="pat-cover" patternUnits="userSpaceOnUse" width="768" height="432"><image href="kit/tex/cover.jpg" width="768" height="432" /></pattern>
          <pattern id="pat-paper" patternUnits="userSpaceOnUse" width="768" height="432"><image href="kit/tex/paper.jpg" width="768" height="432" /></pattern>
          <pattern id="pat-kraft" patternUnits="userSpaceOnUse" width="768" height="432"><image href="kit/tex/kraft.jpg" width="768" height="432" /></pattern>
          <pattern id="pat-grain" patternUnits="userSpaceOnUse" width="768" height="432"><image href="kit/tex/construction.jpg" width="768" height="432" /></pattern>
          <filter id="sh1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="4" stdDeviation="2" flood-color="#3b2614" flood-opacity="0.35" /></filter>
          <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="6" dy="8" stdDeviation="3.5" flood-color="#3b2614" flood-opacity="0.38" /></filter>
          <filter id="sh3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="10" dy="14" stdDeviation="6" flood-color="#3b2614" flood-opacity="0.4" /></filter>
        </defs>
      </svg>
      <section id="pA" class="clip" data-start="0" data-duration="1" data-track-index="1"><svg id="svgA" class="layer" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg></section>
      <section id="pB" class="clip" data-start="1" data-duration="1" data-track-index="1"><svg id="svgB" class="layer" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg></section>
      <section id="pC" class="clip" data-start="2" data-duration="1" data-track-index="1"><svg id="svgC" class="layer" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg></section>
    </div>
    <script>
      const K = window.KIT, C = K.C;
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const POSES = [["idle", [12, 8], [12, 8]], ["shrug", [8, 96], [8, 96]], ["point", [12, 8], [90, 4]], ["wave", [12, 8], [150, -20]], ["hips", [40, -66], [40, -66]], ["cheer", [160, 12], [160, 12]]];
      const EXPRS = ["happy", "grin", "puzzled", "amazed", "worried"];

      // ---------- page A: Meera poses × expressions ----------
      {
        const r = document.getElementById("svgA");
        K.wall(r, C.teal, 1100);
        POSES.forEach(([pn, aL, aR], c) => K.text(r, 160 + c * 320, 34, pn, { size: 30, color: C.white }));
        EXPRS.forEach((ex, rI) => {
          K.text(r, 40, 175 + rI * 205, ex, { size: 22, color: C.white, anchor: "start" });
          POSES.forEach(([pn, aL, aR], c) => {
            const m = K.meera(r, 200 + c * 320, 260 + rI * 205, 0.29, { aL, aR, expr: ex });
          });
        });
      }
      // ---------- page B: cast + props ----------
      {
        const r = document.getElementById("svgB");
        K.wall(r, C.sky, 700); K.table(r, 690);
        K.raviMama(r, 130, 640, 0.85, { expr: "grin", aR: [70, 22] });
        K.priya(r, 330, 640, 0.85, { expr: "happy", aL: [40, -66] });
        K.merchant(r, 520, 640, 0.85, { expr: "happy", aR: [50, 60] });
        K.khataRig(r, 720, 640, 0.42, { expr: "sleep" });
        K.khataRig(r, 900, 640, 0.42, { expr: "wow" });
        K.khataRig(r, 1290, 640, 0.6, { open: true, expr: "wink", armL: 50, armR: 50 });
        const s1 = K.stall(r, 1720, 640, 0.75, { face: true, gallaOpen: true });
        K.stall(r, 300, 1080, 0.55, { noProps: false });
        const gs = K.stall(r, 860, 1080, 0.55, { face: true, faceExpr: "frown" });
        gs.face.expr(tl, 1, "frown", { smooth: true });
        K.galla(r, 1240, 1050, 1.1, { open: false });
        K.galla(r, 1560, 1050, 1.1, { open: true, overflow: true });
        const kk = K.khataRig(r, 1810, 1050, 0.3, { open: true, expr: "happy" });
        kk.pageTint(tl, 1, "left", true, { smooth: true }); kk.pageTint(tl, 1, "right", true, { smooth: true });
      }
      // ---------- page C: hero close-ups ----------
      {
        const r = document.getElementById("svgC");
        K.wall(r, C.saffron, 880); K.table(r, 870);
        K.meera(r, 260, 1000, 1.05, { expr: "joy", aL: [160, 12], aR: [160, 12] });
        const m2 = K.meera(r, 700, 1000, 1.05, { expr: "puzzled", aL: [8, 96], aR: [8, 96] });
        m2.headTilt(tl, 2, -8, { smooth: true });
        K.meera(r, 1120, 1000, 1.05, { expr: "amazed", aR: [90, 4] });
        K.khataRig(r, 1580, 1000, 1.02, { expr: "awake", armL: 40, armR: 40 });
      }
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
