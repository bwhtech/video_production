<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, height=630" />
    <title>Hisaab Kitaab — social card</title>
    <!-- Open Graph image for cs17.org/accounting, drawn with the lesson kit (real rigs, real props). 1200×630.
         Render: npm run snapshot → snapshots/frame-00-at-0.5s.png -->
    <link rel="stylesheet" href="assets/kit/fonts.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/kit/icons.js"></script>
    <script src="assets/kit/kit.js"></script>
    <script src="assets/kit/rig.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: #b7895a; }
      #root { position: relative; width: 1200px; height: 630px; overflow: hidden; }
      svg { display: block; }
      .fontwarm { position: absolute; left: -9999px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1200" data-height="630">
      <svg width="0" height="0" style="position:absolute">
        <defs>
          <pattern id="pat-cover" patternUnits="userSpaceOnUse" width="768" height="432"><image href="assets/kit/tex/cover.jpg" width="768" height="432" /></pattern>
          <pattern id="pat-paper" patternUnits="userSpaceOnUse" width="768" height="432"><image href="assets/kit/tex/paper.jpg" width="768" height="432" /></pattern>
          <pattern id="pat-kraft" patternUnits="userSpaceOnUse" width="768" height="432"><image href="assets/kit/tex/kraft.jpg" width="768" height="432" /></pattern>
          <pattern id="pat-grain" patternUnits="userSpaceOnUse" width="768" height="432"><image href="assets/kit/tex/construction.jpg" width="768" height="432" /></pattern>
          <filter id="sh1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="4" stdDeviation="2" flood-color="#3b2614" flood-opacity="0.35" /></filter>
          <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="6" dy="8" stdDeviation="3.5" flood-color="#3b2614" flood-opacity="0.38" /></filter>
          <filter id="sh3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="10" dy="14" stdDeviation="6" flood-color="#3b2614" flood-opacity="0.4" /></filter>
        </defs>
      </svg>
      <div class="fontwarm"><span style="font-family:Shrikhand">Hisaab Kitaab</span><span style="font-family:'Baloo 2';font-weight:800">A</span><span style="font-family:Kalam">A</span></div>
      <section id="card" class="clip" data-start="0" data-duration="1" data-track-index="1">
        <!-- the kit's 1920-wide world, cropped to 1.905:1 -->
        <svg id="og-svg" width="1200" height="630" viewBox="0 0 1920 1008" xmlns="http://www.w3.org/2000/svg"></svg>
      </section>
    </div>
    <script>
      const K = window.KIT, C = K.C;
      const svg = document.getElementById("og-svg");
      const GY = 930;                                         // ground line for feet / wheels
      K.wall(svg, C.teal, 800);
      K.table(svg, 790);
      K.stringLights(svg, 980, 1960, 70, 50, 9);
      // the stall, Meera waving beside it, Khata hopping up in front
      const stall = K.stall(svg, 1560, GY, 0.98, { face: true, faceExpr: "happy" });
      const meera = K.meera(svg, 1110, GY, 0.98, { expr: "joy", aR: [150, -20], aL: [12, 8] });
      const khata = K.khataRig(svg, 790, GY + 6, 0.78, { expr: "happy", armL: 105, armR: 25 });
      // series wordmark (as on the end cards) + tagline
      K.label(svg, 560, 290, "Hisaab Kitaab", { size: 124, font: "title", weight: 400, bg: "paper", rot: -3, shadow: 2 });
      K.label(svg, 470, 465, "Accounting from zero · free", { size: 48, font: "baloo", weight: 800, bg: "paper", rot: 1.5 });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
