<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Clay stills — one per lesson</title>
    <style>
      @font-face { font-family: "Baloo 2"; font-weight: 400 800; src: url(assets/fonts/baloo2-latin.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Baloo 2"; font-weight: 400 800; src: url(assets/fonts/baloo2-latin-ext.woff2) format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: "Baloo 2"; font-weight: 400 800; src: url(assets/fonts/baloo2-deva.woff2) format("woff2");
        unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f6e3cf; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Baloo 2", sans-serif; }
      #three-layer { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      .labels { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; }
      .lb { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-weight: 700; font-size: 40px; line-height: 1;
        padding: 14px 26px 10px; border-radius: 26px; background: #fffaf0; color: #2b2233;
        box-shadow: 0 7px 0 rgba(60, 35, 20, 0.16), inset 0 -4px 0 rgba(60, 35, 20, 0.08); }
      .lb small { font-size: 28px; font-weight: 600; opacity: 0.75; }
      .lb.dr { background: #3d7fd9; color: #fff; }
      .lb.cr { background: #e8862e; color: #fff; }
      .lb.leaf { background: #5db96b; color: #fff; }
      .lb.coral { background: #ef6f5e; color: #fff; }
      .lb.ink { background: #2b2233; color: #fffaf0; }
      .lb.big { font-size: 56px; padding: 18px 34px 12px; }
      .lb.sm { font-size: 30px; padding: 10px 18px 7px; border-radius: 18px; }
      .card { position: absolute; transform: translate(-50%, -50%); background: #fffaf0; color: #2b2233; border-radius: 30px; padding: 26px 34px 22px;
        box-shadow: 0 9px 0 rgba(60, 35, 20, 0.16), inset 0 -5px 0 rgba(60, 35, 20, 0.08); font-weight: 600; font-size: 34px; line-height: 1.4; }
      .card h4 { font-size: 38px; font-weight: 800; margin-bottom: 6px; white-space: nowrap; }
      .card .row span { white-space: nowrap; }
      .card .row { display: flex; line-height: 1.55; padding: 2px 0; justify-content: space-between; gap: 40px; font-variant-numeric: tabular-nums; }
      .card .row.tot { border-top: 4px solid #2b2233; margin-top: 6px; padding-top: 6px; font-weight: 800; }
      .card .dr { color: #3d7fd9; } .card .cr { color: #e8862e; } .card .muted { opacity: 0.6; }
      .icon { display: inline-block; width: 38px; height: 38px; vertical-align: -6px; margin-right: 8px; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/" } }
    </script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-no-timeline data-start="0" data-duration="14" data-width="1920" data-height="1080">
      <canvas id="three-layer" class="clip" data-start="0" data-duration="14" data-track-index="1"></canvas>
      <div id="labels-1" class="labels clip" data-start="0" data-duration="1" data-track-index="2"></div>
      <div id="labels-2" class="labels clip" data-start="1" data-duration="1" data-track-index="2"></div>
      <div id="labels-3" class="labels clip" data-start="2" data-duration="1" data-track-index="2"></div>
      <div id="labels-4" class="labels clip" data-start="3" data-duration="1" data-track-index="2"></div>
      <div id="labels-5" class="labels clip" data-start="4" data-duration="1" data-track-index="2"></div>
      <div id="labels-6" class="labels clip" data-start="5" data-duration="1" data-track-index="2"></div>
      <div id="labels-7" class="labels clip" data-start="6" data-duration="1" data-track-index="2"></div>
      <div id="labels-8" class="labels clip" data-start="7" data-duration="1" data-track-index="2"></div>
      <div id="labels-9" class="labels clip" data-start="8" data-duration="1" data-track-index="2"></div>
      <div id="labels-10" class="labels clip" data-start="9" data-duration="1" data-track-index="2"></div>
      <div id="labels-11" class="labels clip" data-start="10" data-duration="1" data-track-index="2"></div>
      <div id="labels-12" class="labels clip" data-start="11" data-duration="1" data-track-index="2"></div>
      <div id="labels-13" class="labels clip" data-start="12" data-duration="1" data-track-index="2"></div>
      <div id="labels-14" class="labels clip" data-start="13" data-duration="1" data-track-index="2"></div>
    </div>

    <script type="module" src="scenes.js"></script>
  </body>
</html>
