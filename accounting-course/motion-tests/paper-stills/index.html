<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Course look — paper cut-out stills</title>
    <link rel="stylesheet" href="assets/fonts.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/icons.js"></script>
    <script src="assets/kit.js"></script>
    <script src="assets/scenes.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #b7895a; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .layer { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #bg { background: #b7895a; }
      svg { display: block; }
      .fontwarm { position: absolute; left: -9999px; font-family: "Baloo 2", Kalam; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1920" data-height="1080">
      <div id="bg" class="layer"></div>
      <!-- shared paper materials (one defs block for every scene svg) -->
      <svg width="0" height="0" style="position:absolute">
        <defs>
          <pattern id="pat-cover" patternUnits="userSpaceOnUse" width="768" height="432"><image href="assets/tex/cover.jpg" width="768" height="432" /></pattern>
          <pattern id="pat-paper" patternUnits="userSpaceOnUse" width="768" height="432"><image href="assets/tex/paper.jpg" width="768" height="432" /></pattern>
          <pattern id="pat-kraft" patternUnits="userSpaceOnUse" width="768" height="432"><image href="assets/tex/kraft.jpg" width="768" height="432" /></pattern>
          <pattern id="pat-grain" patternUnits="userSpaceOnUse" width="768" height="432"><image href="assets/tex/construction.jpg" width="768" height="432" /></pattern>
          <filter id="sh1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="4" stdDeviation="2" flood-color="#3b2614" flood-opacity="0.35" /></filter>
          <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="6" dy="8" stdDeviation="3.5" flood-color="#3b2614" flood-opacity="0.38" /></filter>
          <filter id="sh3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="10" dy="14" stdDeviation="6" flood-color="#3b2614" flood-opacity="0.4" /></filter>
        </defs>
      </svg>
      <div class="fontwarm"><span style="font-family:'Baloo 2';font-weight:800">₹1,06,700</span><span style="font-family:Kalam">Credit the giver ₹</span></div>
      <section id="s01" class="clip scene" data-start="0" data-duration="1" data-track-index="1"><svg id="svg01" class="layer" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg></section>
      <section id="s02" class="clip scene" data-start="1" data-duration="1" data-track-index="1"><svg id="svg02" class="layer" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg></section>
      <section id="s03" class="clip scene" data-start="2" data-duration="1" data-track-index="1"><svg id="svg03" class="layer" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg></section>
      <section id="s04" class="clip scene" data-start="3" data-duration="1" data-track-index="1"><svg id="svg04" class="layer" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg></section>
      <section id="s05" class="clip scene" data-start="4" data-duration="1" data-track-index="1"><svg id="svg05" class="layer" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg></section>
      <section id="s06" class="clip scene" data-start="5" data-duration="1" data-track-index="1"><svg id="svg06" class="layer" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg></section>
      <section id="s07" class="clip scene" data-start="6" data-duration="1" data-track-index="1"><svg id="svg07" class="layer" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg></section>
      <section id="s08" class="clip scene" data-start="7" data-duration="1" data-track-index="1"><svg id="svg08" class="layer" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg></section>
      <section id="s09" class="clip scene" data-start="8" data-duration="1" data-track-index="1"><svg id="svg09" class="layer" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg></section>
      <section id="s10" class="clip scene" data-start="9" data-duration="1" data-track-index="1"><svg id="svg10" class="layer" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg></section>
      <section id="s11" class="clip scene" data-start="10" data-duration="1" data-track-index="1"><svg id="svg11" class="layer" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg></section>
      <section id="s12" class="clip scene" data-start="11" data-duration="1" data-track-index="1"><svg id="svg12" class="layer" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg></section>
      <section id="s13" class="clip scene" data-start="12" data-duration="1" data-track-index="1"><svg id="svg13" class="layer" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg></section>
      <section id="s14" class="clip scene" data-start="13" data-duration="1" data-track-index="1"><svg id="svg14" class="layer" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg></section>
    </div>
    <script>
      // Build every lesson's still synchronously (deterministic), then register the timeline.
      for (let i = 1; i <= 14; i++) {
        const id = "L" + String(i).padStart(2, "0");
        const svg = document.getElementById("svg" + String(i).padStart(2, "0"));
        const cam = KIT.g(svg, { id: "cam" + i });
        window.SCENES[id](cam);
      }
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // a gentle push on each scene so each still is a frame of a moving shot
      for (let i = 1; i <= 14; i++) tl.fromTo("#cam" + i, { scale: 1, svgOrigin: "960 600" }, { scale: 1.02, svgOrigin: "960 600", duration: 1, ease: "none" }, i - 1);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
