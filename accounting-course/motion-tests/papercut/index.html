<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Khata motion test — paper cut-out</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #b7895a; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .layer { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #bg { background: #b7895a; }
      svg { display: block; }
      .grain { mix-blend-mode: multiply; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="17" data-width="1920" data-height="1080">
      <div id="bg" class="layer"></div>

      <section id="stage" class="clip layer" data-start="0" data-duration="17" data-track-index="1">
        <svg id="svg" class="layer" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="pat-cover" patternUnits="userSpaceOnUse" width="768" height="432"><image href="assets/tex/cover.jpg" width="768" height="432" /></pattern>
            <pattern id="pat-paper" patternUnits="userSpaceOnUse" width="768" height="432"><image href="assets/tex/paper.jpg" width="768" height="432" /></pattern>
            <pattern id="pat-kraft" patternUnits="userSpaceOnUse" width="768" height="432"><image href="assets/tex/kraft.jpg" width="768" height="432" /></pattern>
            <pattern id="pat-grain" patternUnits="userSpaceOnUse" width="768" height="432"><image href="assets/tex/construction.jpg" width="768" height="432" /></pattern>
            <!-- cardboard drop shadows: deeper layers sit closer to the table -->
            <filter id="sh1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="4" stdDeviation="2" flood-color="#3b2614" flood-opacity="0.35" /></filter>
            <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="6" dy="8" stdDeviation="3.5" flood-color="#3b2614" flood-opacity="0.38" /></filter>
            <filter id="sh3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="10" dy="14" stdDeviation="6" flood-color="#3b2614" flood-opacity="0.4" /></filter>
          </defs>
          <!-- everything is generated by build() below (deterministic, synchronous) -->
          <g id="cam"></g>
        </svg>
      </section>

      <audio id="vo" class="clip" data-start="1" data-duration="14.48" data-track-index="2" src="assets/vo/l01-line04.mp3"></audio>
    </div>

    <script>
      // ======================= paper construction kit =======================
      const NS = "http://www.w3.org/2000/svg";
      const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }; // 0..1, deterministic
      const sh = (n) => hash(n) * 2 - 1; // -1..1
      let SEED = 1;
      const el = (tag, attrs = {}, parent) => {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(e);
        return e;
      };
      const g = (parent, attrs = {}) => el("g", attrs, parent);
      const pts2d = (pts) => "M" + pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L") + " Z";

      // hand-cut rectangle: points every ~step px, jittered off the edge, corners slightly clipped
      function cutRect(x, y, w, h, jag = 3, step = 26) {
        const s = SEED++ * 97, pts = [];
        const edge = (x0, y0, x1, y1, nx, ny, k) => {
          const len = Math.hypot(x1 - x0, y1 - y0), n = Math.max(2, Math.round(len / step));
          for (let i = 0; i < n; i++) {
            const t = i / n, d = sh(s + k * 50 + i) * jag;
            pts.push([x0 + (x1 - x0) * t + nx * d, y0 + (y1 - y0) * t + ny * d]);
          }
        };
        const c = Math.min(w, h) * 0.08;
        edge(x + c, y, x + w - c, y, 0, 1, 1);
        edge(x + w, y + c, x + w, y + h - c, 1, 0, 2);
        edge(x + w - c, y + h, x + c, y + h, 0, 1, 3);
        edge(x, y + h - c, x, y + c, 1, 0, 4);
        return pts2d(pts);
      }
      // hand-cut ellipse
      function cutEll(cx, cy, rx, ry, jag = 2.2, n = 22) {
        const s = SEED++ * 53, pts = [];
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2, r = 1 + (sh(s + i) * jag) / Math.max(rx, ry);
          pts.push([cx + Math.cos(a) * rx * r, cy + Math.sin(a) * ry * r]);
        }
        return pts2d(pts);
      }
      // thick polyline → filled strip with jittered edges (for z's, crescents, arrows, ? marks)
      function cutStroke(points, width, jag = 1.6) {
        const s = SEED++ * 31, L = [], R = [];
        for (let i = 0; i < points.length; i++) {
          const p = points[i], q = points[Math.min(i + 1, points.length - 1)], o = points[Math.max(i - 1, 0)];
          const dx = q[0] - o[0], dy = q[1] - o[1], len = Math.hypot(dx, dy) || 1;
          const nx = -dy / len, ny = dx / len, hw = width / 2;
          L.push([p[0] + nx * (hw + sh(s + i) * jag), p[1] + ny * (hw + sh(s + i) * jag)]);
          R.push([p[0] - nx * (hw + sh(s + i + 40) * jag), p[1] - ny * (hw + sh(s + i + 40) * jag)]);
        }
        return pts2d(L.concat(R.reverse()));
      }
      const arc = (cx, cy, r, a0, a1, n = 10) => Array.from({ length: n + 1 }, (_, i) => {
        const a = a0 + ((a1 - a0) * i) / n; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
      });
      // a coloured paper piece = flat colour + construction-paper grain multiplied on top
      function paper(parent, d, color, extra = {}) {
        const grp = g(parent, extra);
        el("path", { d, fill: color }, grp);
        el("path", { d, fill: "url(#pat-grain)", class: "grain", opacity: "0.9" }, grp);
        return grp;
      }
      const textured = (parent, d, pat, extra = {}) => el("path", { d, fill: `url(#${pat})`, ...extra }, parent);

      const C = {
        red: "#c8372d", redDark: "#7e211b", redShade: "#a32a22", gold: "#e9b949", ink: "#2b2233",
        white: "#fbf7ef", pink: "#f29a8f", dr: "#3d7fd9", cr: "#e8862e", teal: "#2fa79a", cream: "#fff4e2",
      };
      const JIT = []; // jitter groups (replacement wobble at 12 fps)
      const jit = (parent, id) => { const j = g(parent, { id }); JIT.push(j); return j; };

      // ======================= build the set =======================
      function build() {
        const cam = document.getElementById("cam");

        // backdrop: teal construction paper wall + cream paper clouds + gold sun
        paper(cam, cutRect(-40, -40, 2000, 860, 2, 60), C.teal);
        const sky = jit(cam, "j-sky");
        paper(g(sky, { filter: "url(#sh1)" }), cutEll(1580, 210, 92, 92, 3), C.gold);
        const cloud = (cx, cy, s) => {
          const cg = g(sky, { filter: "url(#sh1)" });
          [[0, 0, 70], [60, 10, 55], [-60, 12, 50], [25, -30, 48]].forEach(([dx, dy, r]) =>
            textured(cg, cutEll(cx + dx * s, cy + dy * s, r * s, r * s * 0.8, 2.5), "pat-paper"));
        };
        cloud(190, 130, 1.0); cloud(860, 90, 0.7); cloud(1760, 360, 0.7);

        // tabletop: kraft cardboard with a torn top edge
        const table = g(cam, { filter: "url(#sh2)" });
        const tp = [];
        for (let i = 0; i <= 48; i++) tp.push([-40 + i * 42, 735 + sh(900 + i) * 9]);
        tp.push([2000, 1120], [-40, 1120]);
        textured(table, pts2d(tp), "pat-kraft");

        // ---------------- Khata (paper puppet) ----------------
        const root = g(cam, { id: "khata-root", transform: "translate(960 915) scale(1.55)" });
        el("ellipse", { id: "k-shadow", cx: 0, cy: 2, rx: 150, ry: 18, fill: "#3b2614", "fill-opacity": "0.28" }, root);
        const body = g(root, { id: "k-body" });

        // feet
        const feet = g(body, { filter: "url(#sh1)" });
        paper(feet, cutRect(-64, -32, 46, 36, 2, 14), C.redDark);
        paper(feet, cutRect(18, -32, 46, 36, 2, 14), C.redDark);

        // page panels
        const panel = (side) => {
          const pos = g(body, { transform: `translate(${side * 86} 0)` });
          const P = g(pos, { id: side < 0 ? "k-left" : "k-right" });
          const j = jit(P, side < 0 ? "j-left" : "j-right");
          const x0 = side < 0 ? -346 : 0;
          const board = g(j, { filter: "url(#sh2)" });
          paper(board, cutRect(x0, -362, 346, 334, 3), C.redDark);
          textured(board, cutRect(side < 0 ? -340 : 0, -374, 340, 332, 3), "pat-cover");
          const pg = g(j, { filter: "url(#sh1)" });
          const px = side < 0 ? -326 : 8;
          textured(pg, cutRect(px, -358, 318, 302, 2.4), "pat-paper");
          // pencil rules + red-pencil margin
          for (let i = 0; i < 6; i++) {
            const yy = -300 + i * 40, wv = [];
            for (let k = 0; k <= 10; k++) wv.push([px + 14 + k * 29, yy + sh(SEED * 3 + k + i * 11) * 1.2]);
            el("path", { d: "M" + wv.map((p) => p.join(",")).join(" L"), fill: "none", stroke: "#a39684", "stroke-width": 2, "stroke-linecap": "round", opacity: 0.7 }, pg);
          }
          const mx = side < 0 ? -268 : 268;
          el("path", { d: `M${mx},-348 L${mx + 1.5},-200 L${mx},-66`, fill: "none", stroke: "#d77d70", "stroke-width": 2.5, opacity: 0.8 }, pg);
          // coloured construction-paper sheet that slaps onto the page (debit blue / credit orange)
          const sheet = g(j, { id: side < 0 ? "k-left-glow" : "k-right-glow", opacity: 0 });
          paper(sheet, cutRect(px + 10, -348, 298, 282, 3), side < 0 ? C.dr : C.cr, { style: "mix-blend-mode:multiply" });
        };
        panel(-1); panel(1);

        // arms: paper strip + hand, pinned with a gold brad at the shoulder
        const arm = (side) => {
          const pos = g(body, { id: side < 0 ? "k-armL-pos" : "k-armR-pos", transform: `translate(${side * 86} -190)` });
          const A = g(pos, { id: side < 0 ? "k-armL" : "k-armR" });
          const j = jit(A, side < 0 ? "j-armL" : "j-armR");
          const strip = g(j, { filter: "url(#sh1)" });
          paper(strip, cutStroke([[0, 0], [side * 28, 8], [side * 50, 22], [side * 62, 32]], 20, 1.4), C.redShade);
          paper(strip, cutEll(side * 64, 34, 16, 16, 1.5), C.redShade);
          paper(j, cutEll(0, 0, 7, 7, 0.8), C.gold);
        };
        arm(-1); arm(1);

        // spine with face
        const spine = jit(body, "j-spine");
        const sp = g(spine, { id: "k-spine", filter: "url(#sh2)" });
        textured(sp, cutRect(-90, -392, 180, 370, 3), "pat-cover");
        el("path", { d: cutRect(36, -388, 50, 362, 2), fill: "#000", opacity: 0.16 }, sp);
        const band = g(spine, { filter: "url(#sh1)" });
        paper(band, cutRect(-92, -113, 184, 16, 1.5, 18), C.gold);
        paper(band, cutStroke(arc(-22, -118, 18, Math.PI * 0.05, Math.PI * 1.95, 14), 8, 1), C.gold);
        paper(band, cutStroke(arc(22, -118, 18, -Math.PI * 0.95, Math.PI * 0.95, 14), 8, 1), C.gold);
        paper(band, cutStroke([[-4, -104], [-18, -70]], 8, 1), C.gold);
        paper(band, cutStroke([[4, -104], [18, -70]], 8, 1), C.gold);
        paper(band, cutEll(0, -106, 10, 10, 1), C.gold);

        const face = g(spine, { id: "k-face" });
        paper(face, cutEll(-50, -212, 18, 11, 1.2), C.pink, { opacity: 0.85 });
        paper(face, cutEll(50, -212, 18, 11, 1.2), C.pink, { opacity: 0.85 });
        const sleep = g(face, { id: "k-eyes-sleep" });
        paper(sleep, cutStroke(arc(-38, -276, 22, Math.PI * 0.15, Math.PI * 0.85, 10), 7, 0.8), C.ink);
        paper(sleep, cutStroke(arc(38, -276, 22, Math.PI * 0.15, Math.PI * 0.85, 10), 7, 0.8), C.ink);
        const eye = (side) => {
          const pos = g(face, { transform: `translate(${side * 38} -268)` });
          const lid = g(pos, { id: side < 0 ? "k-eyeL-lid" : "k-eyeR-lid" });
          paper(g(lid, { filter: "url(#sh1)" }), cutEll(0, 0, 25, 30, 1.6), C.white);
          const pu = g(lid, { id: side < 0 ? "k-pupilL" : "k-pupilR" });
          paper(pu, cutEll(0, 4, 13, 13, 1), C.ink);
          paper(pu, cutEll(-4, -1, 4.5, 4.5, 0.5), C.white);
        };
        eye(-1); eye(1);
        paper(face, cutStroke(arc(38, -278, 22, Math.PI * 0.15, Math.PI * 0.85, 10), 7, 0.8), C.ink, { id: "k-wink", opacity: 0 });
        paper(face, cutStroke([[-10, -206], [0, -202], [10, -206]], 5, 0.5), C.ink, { id: "k-mouth-sleep" });
        const smile = g(face, { id: "k-mouth-smile", opacity: 0 });
        paper(g(smile, { filter: "url(#sh1)" }), pts2d([[-22, -212], [0, -207], [22, -212], ...arc(0, -212, 22, 0, Math.PI, 10).slice(1, -1).map(([x, y]) => [x, -212 + (y + 212) * 1.2])]), C.ink);
        paper(smile, cutEll(0, -192, 10, 6, 0.6), C.pink);

        // emotes + accents (paper cut-outs)
        const fx = g(root, {});
        const zz = g(fx, { filter: "url(#sh1)" });
        [["z1", 96, -400, 24], ["z2", 132, -452, 30], ["z3", 176, -512, 36]].forEach(([id, x, y, s]) =>
          paper(zz, cutStroke([[x, y], [x + s, y], [x, y + s], [x + s, y + s]], 8, 1), C.ink, { id }));
        const bang = g(g(fx, { transform: "translate(130 -440)" }), { id: "bang", filter: "url(#sh1)" });
        paper(bang, cutRect(-9, -60, 18, 42, 1.5, 10), C.cr);
        paper(bang, cutEll(0, -4, 10, 10, 1), C.cr);
        const q = g(g(fx, { transform: "translate(-140 -450)" }), { id: "qmark", filter: "url(#sh1)" });
        paper(q, cutStroke([[-16, -40], ...arc(4, -44, 20, Math.PI, Math.PI * 2.25, 12), [6, -22], [2, -10]], 11, 1.2), C.dr);
        paper(q, cutEll(2, 8, 8, 8, 1), C.dr);
        const arrow = (id, side, color) => {
          const a = g(g(fx, { transform: `translate(${side * 256} -470)` }), { id, filter: "url(#sh2)" });
          paper(a, pts2d([[side * 55, -12], [side * -10, -12], [side * -10, -34], [side * -62, 0], [side * -10, 34], [side * -10, 12], [side * 55, 12]].map(([x, y], i) => [x + sh(SEED * 7 + i) * 2, y + sh(SEED * 9 + i) * 2])), color);
          SEED++;
        };
        arrow("arrowL", 1, C.dr); // side=1 → points left (tip at -62)
        arrow("arrowR", -1, C.cr);
        // fix positions: arrowL lives over the LEFT page, arrowR over the RIGHT page
        document.getElementById("arrowL").parentNode.setAttribute("transform", "translate(-256 -470)");
        document.getElementById("arrowR").parentNode.setAttribute("transform", "translate(256 -470)");
        const star = (id, x, y, s) => {
          const st = g(g(fx, { transform: `translate(${x} ${y}) scale(${s})` }), { id, filter: "url(#sh1)" });
          const p = [];
          for (let i = 0; i < 8; i++) { const r = i % 2 ? 9 : 28, a = (i / 8) * Math.PI * 2 - Math.PI / 2; p.push([Math.cos(a) * r, Math.sin(a) * r]); }
          paper(st, pts2d(p), C.gold);
        };
        star("sp1", 150, -420, 1); star("sp2", 210, -340, 0.6); star("sp3", -190, -400, 0.75);
      }
      build();

      // ======================= timeline (stop-motion on twos @12fps) =======================
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const FPS = 12, DUR = 17;
      // quantise progress to 12 fps steps, then apply the underlying ease
      const Q = (name, dur) => { const f = gsap.parseEase(name); const n = Math.max(1, Math.round(dur * FPS)); return (p) => f(Math.floor(p * n + 1e-6) / n); };
      const T = (t, vars, at) => tl.to(t, { ...vars, ease: Q(vars.ease || "power2.out", vars.duration || 0.5) }, at);
      const F = (t, from, to, at) => tl.fromTo(t, from, { ...to, ease: Q(to.ease || "power2.out", to.duration || 0.5) }, at);

      const VO_START = 1.0;
      const WORDS = [["Meet",0.08],["Khata.",0.4],["Khata",1.36],["is",1.76],["a",1.92],["ledger",2.0],["book,",2.44],["and",2.96],["it'll",3.2],["be",3.44],["your",3.6],["guide",3.84],["through",4.16],["this",4.32],["course.",4.56],["Notice",5.653],["something?",5.96],["An",6.64],["open",6.88],["book",7.2],["has",7.6],["two",7.84],["sides.",8.0],["A",8.84],["left",8.96],["page,",9.28],["and",10.16],["a",10.32],["right",10.4],["page.",10.72],["Remember",11.64],["that.",11.96],["It's",12.48],["going",12.72],["to",12.92],["matter",13.04],["more",13.44],["than",13.68],["you",13.84],["think.",14.0]];
      const cue = (word, nth = 1) => {
        let seen = 0;
        for (const [w, s] of WORDS) if (w.replace(/[^\w']/g, "") === word && ++seen === nth) return VO_START + s;
        throw new Error("cue not found: " + word);
      };
      const SETTLE = "back.out(1.7)";

      // initial state
      tl.set(["#k-left", "#k-right"], { scaleX: 0.04, transformOrigin: (i) => (i === 0 ? "100% 50%" : "0% 50%") }, 0);
      tl.set(["#k-eyeL-lid", "#k-eyeR-lid"], { scaleY: 0.05, transformOrigin: "50% 50%" }, 0);
      tl.set(["#bang", "#qmark", "#arrowL", "#arrowR", "#sp1", "#sp2", "#sp3"], { scale: 0, transformOrigin: "50% 50%" }, 0);
      tl.set(["#z1", "#z2", "#z3"], { autoAlpha: 0, transformOrigin: "50% 50%" }, 0);
      tl.set("#k-body", { transformOrigin: "50% 100%" }, 0);
      tl.set(["#k-armL", "#k-armR"], { rotation: 0, svgOrigin: "0 0" }, 0);

      // replacement jitter: every paper layer shifts a hair on each 12fps step (deterministic)
      JIT.forEach((j, k) => tl.set(j, { transformOrigin: "50% 50%" }, 0));
      for (let i = 0; i < DUR * FPS; i++) {
        JIT.forEach((j, k) => tl.set(j, { rotation: sh(i * 13 + k * 101) * 0.6, x: sh(i * 17 + k * 211) * 1.5, y: sh(i * 19 + k * 307) * 1.5 }, i / FPS));
      }

      // camera: slow push, stepped
      F("#cam", { scale: 1, svgOrigin: "960 640" }, { scale: 1.07, svgOrigin: "960 640", duration: DUR, ease: "none" }, 0);

      // asleep
      [["#z1", 0.0], ["#z2", 0.35], ["#z3", 0.7]].forEach(([z, t]) => F(z, { autoAlpha: 0, y: 12, scale: 0.6 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.35 }, t));

      // "Meet" — wake
      const tWake = cue("Meet");
      T(["#z1", "#z2", "#z3"], { autoAlpha: 0, y: -30, duration: 0.25, ease: "power2.in" }, tWake);
      tl.set("#k-eyes-sleep", { autoAlpha: 0 }, tWake);
      T(["#k-eyeL-lid", "#k-eyeR-lid"], { scaleY: 1, duration: 0.17, ease: SETTLE }, tWake);
      tl.set("#k-mouth-sleep", { autoAlpha: 0 }, tWake + 0.08);
      tl.set("#k-mouth-smile", { opacity: 1 }, tWake + 0.08);
      F("#bang", { scale: 0, rotation: -15 }, { scale: 1, rotation: 0, duration: 0.33, ease: SETTLE }, tWake + 0.05);
      T("#bang", { scale: 0, duration: 0.17, ease: "power2.in" }, tWake + 0.9);

      // "Khata." — hop
      const tHop = cue("Khata", 1);
      T("#k-body", { scaleY: 0.88, scaleX: 1.08, duration: 0.17 }, tHop);
      T("#k-body", { y: -90, scaleY: 1.08, scaleX: 0.94, duration: 0.25, ease: "power3.out" }, tHop + 0.17);
      T("#k-shadow", { scale: 0.7, duration: 0.25, svgOrigin: "960 915" }, tHop + 0.17);
      T("#k-body", { y: 0, scaleY: 1, scaleX: 1, duration: 0.17, ease: "power2.in" }, tHop + 0.42);
      T("#k-shadow", { scale: 1, duration: 0.17, ease: "power2.in", svgOrigin: "960 915" }, tHop + 0.42);
      T("#k-body", { scaleY: 0.9, scaleX: 1.06, duration: 0.08 }, tHop + 0.59);
      T("#k-body", { scaleY: 1, scaleX: 1, duration: 0.33, ease: SETTLE }, tHop + 0.67);
      T(["#k-armL", "#k-armR"], { rotation: (i) => (i === 0 ? 40 : -40), duration: 0.17 }, tHop + 0.17);
      T(["#k-armL", "#k-armR"], { rotation: 0, duration: 0.33, ease: SETTLE }, tHop + 0.67);

      // "ledger book" — shimmy
      const tLedger = cue("ledger");
      T("#k-body", { rotation: -5, duration: 0.17 }, tLedger);
      T("#k-body", { rotation: 5, duration: 0.25, ease: "power2.inOut" }, tLedger + 0.17);
      T("#k-body", { rotation: 0, duration: 0.33, ease: SETTLE }, tLedger + 0.42);

      // "your guide" — wave
      const tGuide = cue("your");
      T("#k-armR", { rotation: -130, duration: 0.25, ease: "power3.out" }, tGuide);
      [0, 1, 2, 3].forEach((k) => T("#k-armR", { rotation: k % 2 ? -130 : -100, duration: 0.17, ease: "power1.inOut" }, tGuide + 0.25 + k * 0.17));
      T("#k-armR", { rotation: 0, duration: 0.33, ease: SETTLE }, tGuide + 0.95);

      // "Notice something?"
      const tNotice = cue("Notice");
      T(["#k-pupilL", "#k-pupilR"], { x: -8, y: -8, duration: 0.17 }, tNotice);
      F("#qmark", { scale: 0, rotation: 15 }, { scale: 1, rotation: 0, duration: 0.33, ease: SETTLE }, tNotice + 0.2);
      T("#qmark", { scale: 0, duration: 0.17, ease: "power2.in" }, cue("An") - 0.05);
      T(["#k-pupilL", "#k-pupilR"], { x: 0, y: 0, duration: 0.17 }, cue("An") - 0.05);

      // "open" — pages fan out
      const tOpen = cue("open");
      T("#k-body", { scaleX: 0.94, scaleY: 1.04, duration: 0.17 }, tOpen - 0.17);
      T("#k-body", { scaleX: 1, scaleY: 1, duration: 0.42, ease: SETTLE }, tOpen);
      T(["#k-left", "#k-right"], { scaleX: 1, duration: 0.58, ease: SETTLE }, tOpen);
      T("#k-armL-pos", { x: -428, duration: 0.58, ease: SETTLE }, tOpen);
      T("#k-armR-pos", { x: 428, duration: 0.58, ease: SETTLE }, tOpen);
      T("#k-shadow", { scaleX: 3.0, duration: 0.58, ease: SETTLE, svgOrigin: "960 915" }, tOpen);
      T(["#k-armL", "#k-armR"], { rotation: (i) => (i === 0 ? 70 : -70), duration: 0.33, ease: "power3.out" }, tOpen + 0.2);
      T(["#k-armL", "#k-armR"], { rotation: (i) => (i === 0 ? 20 : -20), duration: 0.42, ease: SETTLE }, tOpen + 0.6);

      // "left page" — blue paper sheet slaps down
      const tLeft = cue("left");
      T(["#k-pupilL", "#k-pupilR"], { x: -9, duration: 0.17 }, tLeft - 0.1);
      F("#k-left-glow", { opacity: 0, scale: 1.12, transformOrigin: "50% 50%" }, { opacity: 0.85, scale: 1, duration: 0.25, ease: "power3.out" }, tLeft);
      F("#arrowL", { scale: 0, x: 30 }, { scale: 1, x: 0, duration: 0.33, ease: SETTLE }, tLeft);
      T("#k-armL", { rotation: 55, duration: 0.25, ease: "power3.out" }, tLeft);
      T("#k-armL", { rotation: 20, duration: 0.33, ease: SETTLE }, tLeft + 0.9);

      // "right page" — orange sheet
      const tRight = cue("right");
      T(["#k-pupilL", "#k-pupilR"], { x: 9, duration: 0.17, ease: "power2.inOut" }, tRight - 0.12);
      F("#k-right-glow", { opacity: 0, scale: 1.12, transformOrigin: "50% 50%" }, { opacity: 0.85, scale: 1, duration: 0.25, ease: "power3.out" }, tRight);
      F("#arrowR", { scale: 0, x: -30 }, { scale: 1, x: 0, duration: 0.33, ease: SETTLE }, tRight);
      T("#k-armR", { rotation: -55, duration: 0.25, ease: "power3.out" }, tRight);
      T("#k-armR", { rotation: -20, duration: 0.33, ease: SETTLE }, tRight + 0.9);

      // "Remember that."
      const tRemember = cue("Remember");
      T(["#k-pupilL", "#k-pupilR"], { x: 0, duration: 0.17 }, tRemember);
      T("#k-body", { scaleY: 1.04, y: -8, duration: 0.25 }, tRemember);
      T("#k-body", { scaleY: 1, y: 0, duration: 0.33, ease: SETTLE }, tRemember + 0.3);

      // "think." — wink + sparkles
      const tThink = cue("think");
      T("#k-eyeR-lid", { scaleY: 0.05, duration: 0.08, ease: "power2.in" }, tThink);
      tl.set("#k-wink", { opacity: 1 }, tThink + 0.08);
      T("#k-body", { y: -24, duration: 0.17 }, tThink);
      T("#k-body", { y: 0, duration: 0.33, ease: SETTLE }, tThink + 0.17);
      [["#sp1", 0.08], ["#sp2", 0.17], ["#sp3", 0.25]].forEach(([s, d]) => {
        F(s, { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.33, ease: SETTLE }, tThink + d);
        T(s, { scale: 0, duration: 0.25, ease: "power2.in" }, tThink + 1.1 + d);
      });
      tl.set("#k-wink", { opacity: 0 }, tThink + 0.67);
      T("#k-eyeR-lid", { scaleY: 1, duration: 0.17, ease: SETTLE }, tThink + 0.67);

      window.__timelines["main"] = tl;
    </script>
  </body>
