<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Khata motion test</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --paper: #fff4e2;
        --paper-shade: #f3e3c8;
        --ink: #2b2233;
        --khata-red: #c8372d;
        --khata-shade: #a92c24;
        --khata-dark: #7e211b;
        --khata-gold: #e9b949;
        --page: #fffaf0;
        --page-rule: #ecd9bd;
        --page-margin: #e7a49a;
        --dr: #3d7fd9;
        --cr: #e8862e;
        --cheek: #f29a8f;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .layer { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #bg { background: var(--paper); }
      #paper-grain { mix-blend-mode: multiply; opacity: 0.55; pointer-events: none; }
      svg { display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="17" data-width="1920" data-height="1080">
      <div id="bg" class="layer"></div>

      <section id="stage" class="clip layer" data-start="0" data-duration="17" data-track-index="1">
        <svg class="layer" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Hand-drawn "boil": displacement whose seed steps at 12 fps on the timeline. -->
            <filter id="boil" x="-10%" y="-10%" width="120%" height="120%">
              <feTurbulence id="boil-turb" type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="1" result="n" />
              <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" />
            </filter>
            <!-- 4-point sparkle -->
            <path id="sparkle-shape" d="M0,-26 C3,-6 6,-3 26,0 C6,3 3,6 0,26 C-3,6 -6,3 -26,0 C-6,-3 -3,-6 0,-26Z" />
          </defs>

          <!-- Camera: slow push over the whole shot (one intentional move). -->
          <g id="cam">
            <g id="khata-root" transform="translate(960 900) scale(1.4)">
              <ellipse id="k-shadow" cx="0" cy="0" rx="150" ry="20" fill="#2b2233" fill-opacity="0.13" />

              <g id="k-boil" filter="url(#boil)">
                <!-- Body: squash/stretch + hop target, pivot at feet (0,0). -->
                <g id="k-body">
                  <!-- feet -->
                  <rect x="-62" y="-30" width="44" height="34" rx="16" fill="var(--khata-dark)" />
                  <rect x="18" y="-30" width="44" height="34" rx="16" fill="var(--khata-dark)" />

                  <!-- LEFT page panel: grows out of the spine's left edge -->
                  <g transform="translate(-86 0)">
                    <g id="k-left">
                      <rect x="-346" y="-360" width="346" height="330" rx="20" fill="var(--khata-dark)" />
                      <rect x="-340" y="-372" width="340" height="330" rx="20" fill="var(--khata-red)" />
                      <rect x="-326" y="-358" width="318" height="302" rx="10" fill="var(--page)" />
                      <g stroke="var(--page-rule)" stroke-width="3">
                        <line x1="-312" y1="-300" x2="-22" y2="-300" />
                        <line x1="-312" y1="-260" x2="-22" y2="-260" />
                        <line x1="-312" y1="-220" x2="-22" y2="-220" />
                        <line x1="-312" y1="-180" x2="-22" y2="-180" />
                        <line x1="-312" y1="-140" x2="-22" y2="-140" />
                        <line x1="-312" y1="-100" x2="-22" y2="-100" />
                      </g>
                      <line x1="-268" y1="-350" x2="-268" y2="-64" stroke="var(--page-margin)" stroke-width="3" />
                      <rect id="k-left-glow" x="-326" y="-358" width="318" height="302" rx="10" fill="var(--dr)" opacity="0" />
                    </g>
                  </g>

                  <!-- RIGHT page panel: grows out of the spine's right edge -->
                  <g transform="translate(86 0)">
                    <g id="k-right">
                      <rect x="0" y="-360" width="346" height="330" rx="20" fill="var(--khata-dark)" />
                      <rect x="0" y="-372" width="340" height="330" rx="20" fill="var(--khata-red)" />
                      <rect x="8" y="-358" width="318" height="302" rx="10" fill="var(--page)" />
                      <g stroke="var(--page-rule)" stroke-width="3">
                        <line x1="22" y1="-300" x2="312" y2="-300" />
                        <line x1="22" y1="-260" x2="312" y2="-260" />
                        <line x1="22" y1="-220" x2="312" y2="-220" />
                        <line x1="22" y1="-180" x2="312" y2="-180" />
                        <line x1="22" y1="-140" x2="312" y2="-140" />
                        <line x1="22" y1="-100" x2="312" y2="-100" />
                      </g>
                      <line x1="268" y1="-350" x2="268" y2="-64" stroke="var(--page-margin)" stroke-width="3" />
                      <rect id="k-right-glow" x="8" y="-358" width="318" height="302" rx="10" fill="var(--cr)" opacity="0" />
                    </g>
                  </g>

                  <!-- arms (wrappers slide out to the panel edges when the book opens) -->
                  <g id="k-armL-pos" transform="translate(-86 -190)">
                    <g id="k-armL">
                      <path d="M0,0 C-26,4 -46,16 -62,30" fill="none" stroke="var(--khata-shade)" stroke-width="18" stroke-linecap="round" />
                      <circle cx="-64" cy="32" r="15" fill="var(--khata-shade)" />
                    </g>
                  </g>
                  <g id="k-armR-pos" transform="translate(86 -190)">
                    <g id="k-armR">
                      <path d="M0,0 C26,4 46,16 62,30" fill="none" stroke="var(--khata-shade)" stroke-width="18" stroke-linecap="round" />
                      <circle cx="64" cy="32" r="15" fill="var(--khata-shade)" />
                    </g>
                  </g>

                  <!-- spine (the face lives here, always) -->
                  <g id="k-spine">
                    <rect x="-90" y="-390" width="180" height="368" rx="28" fill="var(--khata-red)" />
                    <rect x="38" y="-390" width="52" height="368" rx="26" fill="var(--khata-shade)" />
                    <rect x="-90" y="-112" width="180" height="14" fill="var(--khata-gold)" />
                    <!-- bow -->
                    <ellipse cx="-22" cy="-118" rx="22" ry="13" fill="none" stroke="var(--khata-gold)" stroke-width="7" transform="rotate(-20 -22 -118)" />
                    <ellipse cx="22" cy="-118" rx="22" ry="13" fill="none" stroke="var(--khata-gold)" stroke-width="7" transform="rotate(20 22 -118)" />
                    <path d="M-4,-104 L-18,-70 M4,-104 L18,-70" stroke="var(--khata-gold)" stroke-width="7" stroke-linecap="round" />
                    <circle cx="0" cy="-106" r="9" fill="var(--khata-gold)" />

                    <!-- face -->
                    <g id="k-face">
                      <ellipse cx="-50" cy="-212" rx="18" ry="11" fill="var(--cheek)" opacity="0.55" />
                      <ellipse cx="50" cy="-212" rx="18" ry="11" fill="var(--cheek)" opacity="0.55" />
                      <!-- sleeping eyes -->
                      <g id="k-eyes-sleep" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" fill="none">
                        <path d="M-58,-262 Q-38,-248 -18,-262" />
                        <path d="M18,-262 Q38,-248 58,-262" />
                      </g>
                      <!-- open eyes -->
                      <g id="k-eyeL" transform="translate(-38 -268)">
                        <g id="k-eyeL-lid">
                          <ellipse cx="0" cy="0" rx="25" ry="30" fill="#ffffff" />
                          <g id="k-pupilL"><circle cx="0" cy="4" r="13" fill="var(--ink)" /><circle cx="-4" cy="-1" r="4.5" fill="#ffffff" /></g>
                        </g>
                      </g>
                      <g id="k-eyeR" transform="translate(38 -268)">
                        <g id="k-eyeR-lid">
                          <ellipse cx="0" cy="0" rx="25" ry="30" fill="#ffffff" />
                          <g id="k-pupilR"><circle cx="0" cy="4" r="13" fill="var(--ink)" /><circle cx="-4" cy="-1" r="4.5" fill="#ffffff" /></g>
                        </g>
                      </g>
                      <path id="k-wink" d="M18,-266 Q38,-252 58,-266" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0" />
                      <!-- mouths -->
                      <path id="k-mouth-sleep" d="M-10,-206 Q0,-200 10,-206" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" fill="none" />
                      <g id="k-mouth-smile" opacity="0">
                        <path d="M-22,-212 Q0,-206 22,-212 Q20,-186 0,-184 Q-20,-186 -22,-212Z" fill="var(--ink)" />
                        <path d="M-11,-192 Q0,-200 11,-192 Q6,-185 0,-185 Q-6,-185 -11,-192Z" fill="var(--cheek)" />
                      </g>
                    </g>
                  </g>
                </g>
              </g>

              <!-- emotes + accents live outside the squash group so they don't deform -->
              <g id="zzz" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
                <polyline id="z1" points="96,-400 120,-400 96,-376 120,-376" />
                <polyline id="z2" points="132,-452 162,-452 132,-422 162,-422" />
                <polyline id="z3" points="176,-512 212,-512 176,-476 212,-476" />
              </g>
              <g id="emote-bang" transform="translate(130 -440)">
                <g id="bang">
                  <rect x="-8" y="-58" width="16" height="40" rx="8" fill="var(--cr)" />
                  <circle cx="0" cy="-4" r="9" fill="var(--cr)" />
                </g>
              </g>
              <g id="emote-q" transform="translate(-140 -450)">
                <g id="qmark">
                  <path d="M-16,-40 Q-16,-62 4,-62 Q24,-62 24,-44 Q24,-30 8,-24 Q2,-21 2,-10" fill="none" stroke="var(--dr)" stroke-width="10" stroke-linecap="round" />
                  <circle cx="2" cy="8" r="7" fill="var(--dr)" />
                </g>
              </g>
              <!-- direction arrows over each page -->
              <g transform="translate(-256 -470)"><g id="arrowL">
                <path d="M60,0 L-40,0 M-10,-30 L-44,0 L-10,30" fill="none" stroke="var(--dr)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
              </g></g>
              <g transform="translate(256 -470)"><g id="arrowR">
                <path d="M-60,0 L40,0 M10,-30 L44,0 L10,30" fill="none" stroke="var(--cr)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
              </g></g>
              <!-- sparkles for the wink -->
              <g fill="var(--khata-gold)">
                <g transform="translate(150 -420)"><use id="sp1" href="#sparkle-shape" /></g>
                <g transform="translate(210 -340)"><use id="sp2" href="#sparkle-shape" transform="scale(0.6)" /></g>
                <g transform="translate(-190 -400)"><use id="sp3" href="#sparkle-shape" transform="scale(0.75)" /></g>
              </g>
            </g>
          </g>
        </svg>
      </section>

      <!-- static paper grain over everything (multiply) -->
      <svg id="paper-grain" class="layer" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <filter id="grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="4" result="fine" />
          <feColorMatrix in="fine" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.32  0 0 0 0.22 0" result="fineTint" />
          <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="2" seed="9" result="fibre" />
          <feColorMatrix in="fibre" type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.5  0 0 0 0 0.38  0 0 0 0.16 0" result="fibreTint" />
          <feMerge><feMergeNode in="fibreTint" /><feMergeNode in="fineTint" /></feMerge>
        </filter>
        <rect width="1920" height="1080" filter="url(#grain)" />
      </svg>

      <audio id="vo" class="clip" data-start="1" data-duration="14.48" data-track-index="2" src="assets/vo/l01-line04.mp3"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---- cue sheet: ElevenLabs word timestamps (assets/vo/l01-line04.words.json), VO starts at 1.0s
      const VO_START = 1.0;
      const WORDS = [["Meet",0.08],["Khata.",0.4],["Khata",1.36],["is",1.76],["a",1.92],["ledger",2.0],["book,",2.44],["and",2.96],["it'll",3.2],["be",3.44],["your",3.6],["guide",3.84],["through",4.16],["this",4.32],["course.",4.56],["Notice",5.653],["something?",5.96],["An",6.64],["open",6.88],["book",7.2],["has",7.6],["two",7.84],["sides.",8.0],["A",8.84],["left",8.96],["page,",9.28],["and",10.16],["a",10.32],["right",10.4],["page.",10.72],["Remember",11.64],["that.",11.96],["It's",12.48],["going",12.72],["to",12.92],["matter",13.04],["more",13.44],["than",13.68],["you",13.84],["think.",14.0]];
      const cue = (word, nth = 1) => {
        let seen = 0;
        for (const [w, s] of WORDS) if (w.replace(/[^\w']/g, "") === word && ++seen === nth) return VO_START + s;
        throw new Error("cue not found: " + word);
      };

      const SETTLE = "back.out(1.6)";

      // ---- initial state (set on the timeline at t=0, never via CSS transforms)
      tl.set(["#k-left", "#k-right"], { scaleX: 0.04, transformOrigin: (i) => (i === 0 ? "100% 50%" : "0% 50%") }, 0);
      tl.set(["#k-eyeL-lid", "#k-eyeR-lid"], { scaleY: 0.05, transformOrigin: "50% 50%" }, 0);
      tl.set(["#bang", "#qmark", "#arrowL", "#arrowR", "#sp1", "#sp2", "#sp3"], { scale: 0, transformOrigin: "50% 50%" }, 0);
      tl.set(["#z1", "#z2", "#z3"], { autoAlpha: 0, transformOrigin: "50% 50%" }, 0);
      tl.set("#k-body", { transformOrigin: "50% 100%" }, 0);
      tl.set(["#k-armL", "#k-armR"], { rotation: 0, svgOrigin: "0 0" }, 0);

      // ---- boil: step the displacement seed at 12 fps (deterministic)
      for (let i = 0; i < 17 * 12; i++) tl.set("#boil-turb", { attr: { seed: 1 + (i % 9) } }, i / 12);

      // ---- camera: one slow push across the shot
      tl.fromTo("#cam", { scale: 1, svgOrigin: "960 640" }, { scale: 1.08, svgOrigin: "960 640", duration: 17, ease: "none" }, 0);

      // ---- 0–1.1s asleep: z's drift up (a story beat, ends on wake)
      [["#z1", 0.0], ["#z2", 0.35], ["#z3", 0.7]].forEach(([z, t]) => {
        tl.fromTo(z, { autoAlpha: 0, y: 12, scale: 0.6 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.35, ease: "power2.out" }, t);
      });

      // "Meet" — eyes pop open, z's scatter
      const tWake = cue("Meet");
      tl.to(["#z1", "#z2", "#z3"], { autoAlpha: 0, y: -30, duration: 0.2, ease: "power2.in", stagger: 0.03 }, tWake);
      tl.to("#k-eyes-sleep", { autoAlpha: 0, duration: 0.06 }, tWake);
      tl.to(["#k-eyeL-lid", "#k-eyeR-lid"], { scaleY: 1, duration: 0.18, ease: SETTLE }, tWake);
      tl.to("#k-mouth-sleep", { autoAlpha: 0, duration: 0.06 }, tWake + 0.05);
      tl.to("#k-mouth-smile", { autoAlpha: 1, duration: 0.08 }, tWake + 0.05);
      tl.fromTo("#bang", { scale: 0, rotation: -15 }, { scale: 1, rotation: 0, duration: 0.3, ease: SETTLE }, tWake + 0.05);
      tl.to("#bang", { scale: 0, duration: 0.18, ease: "power2.in" }, tWake + 0.9);

      // "Khata." — anticipation squash → hop with stretch → land squash → settle
      const tHop = cue("Khata", 1);
      tl.to("#k-body", { scaleY: 0.88, scaleX: 1.08, duration: 0.14, ease: "power2.out" }, tHop);
      tl.to("#k-body", { y: -90, scaleY: 1.08, scaleX: 0.94, duration: 0.24, ease: "power3.out" }, tHop + 0.14);
      tl.to("#k-shadow", { scale: 0.7, duration: 0.24, ease: "power3.out", svgOrigin: "960 900" }, tHop + 0.14);
      tl.to("#k-body", { y: 0, scaleY: 1, scaleX: 1, duration: 0.2, ease: "power2.in" }, tHop + 0.38);
      tl.to("#k-shadow", { scale: 1, duration: 0.2, ease: "power2.in", svgOrigin: "960 900" }, tHop + 0.38);
      tl.to("#k-body", { scaleY: 0.9, scaleX: 1.06, duration: 0.07, ease: "power2.out" }, tHop + 0.58);
      tl.to("#k-body", { scaleY: 1, scaleX: 1, duration: 0.35, ease: SETTLE }, tHop + 0.65);
      tl.to(["#k-armL", "#k-armR"], { rotation: (i) => (i === 0 ? 40 : -40), duration: 0.2, ease: "power2.out" }, tHop + 0.14);
      tl.to(["#k-armL", "#k-armR"], { rotation: 0, duration: 0.3, ease: SETTLE }, tHop + 0.6);

      // "ledger book" — proud little side-to-side shimmy
      const tLedger = cue("ledger");
      tl.to("#k-body", { rotation: -5, duration: 0.14, ease: "power2.out" }, tLedger);
      tl.to("#k-body", { rotation: 5, duration: 0.2, ease: "power2.inOut" }, tLedger + 0.14);
      tl.to("#k-body", { rotation: 0, duration: 0.3, ease: SETTLE }, tLedger + 0.34);

      // "your guide" — right arm waves at the viewer (two beats)
      const tGuide = cue("your");
      tl.to("#k-armR", { rotation: -130, duration: 0.22, ease: "power3.out" }, tGuide);
      tl.to("#k-armR", { rotation: -100, duration: 0.16, ease: "power1.inOut", yoyo: true, repeat: 3 }, tGuide + 0.22);
      tl.to("#k-armR", { rotation: 0, duration: 0.3, ease: SETTLE }, tGuide + 0.9);

      // "Notice something?" — looks up-left, question mark pops
      const tNotice = cue("Notice");
      tl.to(["#k-pupilL", "#k-pupilR"], { x: -8, y: -8, duration: 0.18, ease: "power2.out" }, tNotice);
      tl.fromTo("#qmark", { scale: 0, rotation: 15 }, { scale: 1, rotation: 0, duration: 0.32, ease: SETTLE }, tNotice + 0.2);
      tl.to("#qmark", { scale: 0, duration: 0.18, ease: "power2.in" }, cue("An") - 0.05);
      tl.to(["#k-pupilL", "#k-pupilR"], { x: 0, y: 0, duration: 0.18, ease: "power2.out" }, cue("An") - 0.05);

      // "An open book has two sides." — pinch (anticipation), then the pages fan out
      const tOpen = cue("open");
      tl.to("#k-body", { scaleX: 0.94, scaleY: 1.04, duration: 0.16, ease: "power2.out" }, tOpen - 0.16);
      tl.to("#k-body", { scaleX: 1, scaleY: 1, duration: 0.4, ease: SETTLE }, tOpen);
      tl.to(["#k-left", "#k-right"], { scaleX: 1, duration: 0.55, ease: SETTLE }, tOpen);
      tl.to("#k-armL-pos", { x: -428, duration: 0.55, ease: SETTLE }, tOpen);
      tl.to("#k-armR-pos", { x: 428, duration: 0.55, ease: SETTLE }, tOpen);
      tl.to("#k-shadow", { scaleX: 3.0, duration: 0.55, ease: SETTLE, svgOrigin: "960 900" }, tOpen);
      tl.to(["#k-armL", "#k-armR"], { rotation: (i) => (i === 0 ? 70 : -70), duration: 0.3, ease: "power3.out" }, tOpen + 0.2);
      tl.to(["#k-armL", "#k-armR"], { rotation: (i) => (i === 0 ? 20 : -20), duration: 0.4, ease: SETTLE }, tOpen + 0.6);

      // "A left page," — left glows debit-blue, arrow points left, eyes look left
      const tLeft = cue("left");
      tl.to(["#k-pupilL", "#k-pupilR"], { x: -9, duration: 0.15, ease: "power2.out" }, tLeft - 0.1);
      tl.to("#k-left-glow", { opacity: 0.32, duration: 0.25, ease: "power2.out" }, tLeft);
      tl.fromTo("#arrowL", { scale: 0, x: 30 }, { scale: 1, x: 0, duration: 0.35, ease: SETTLE }, tLeft);
      tl.to("#k-armL", { rotation: 55, duration: 0.25, ease: "power3.out" }, tLeft);
      tl.to("#k-armL", { rotation: 20, duration: 0.35, ease: SETTLE }, tLeft + 0.9);

      // "and a right page." — right glows credit-orange, arrow points right
      const tRight = cue("right");
      tl.to(["#k-pupilL", "#k-pupilR"], { x: 9, duration: 0.18, ease: "power2.inOut" }, tRight - 0.12);
      tl.to("#k-right-glow", { opacity: 0.32, duration: 0.25, ease: "power2.out" }, tRight);
      tl.fromTo("#arrowR", { scale: 0, x: -30 }, { scale: 1, x: 0, duration: 0.35, ease: SETTLE }, tRight);
      tl.to("#k-armR", { rotation: -55, duration: 0.25, ease: "power3.out" }, tRight);
      tl.to("#k-armR", { rotation: -20, duration: 0.35, ease: SETTLE }, tRight + 0.9);

      // "Remember that." — eyes back to camera, little forward lean
      const tRemember = cue("Remember");
      tl.to(["#k-pupilL", "#k-pupilR"], { x: 0, duration: 0.15, ease: "power2.out" }, tRemember);
      tl.to("#k-body", { scaleY: 1.04, y: -8, duration: 0.2, ease: "power2.out" }, tRemember);
      tl.to("#k-body", { scaleY: 1, y: 0, duration: 0.35, ease: SETTLE }, tRemember + 0.3);

      // hold (stillness) … then "think." — wink + sparkles
      const tThink = cue("think");
      tl.to("#k-eyeR-lid", { scaleY: 0.05, duration: 0.08, ease: "power2.in" }, tThink);
      tl.to("#k-wink", { opacity: 1, duration: 0.04 }, tThink + 0.06);
      tl.to("#k-body", { y: -24, duration: 0.16, ease: "power2.out" }, tThink);
      tl.to("#k-body", { y: 0, duration: 0.3, ease: SETTLE }, tThink + 0.16);
      [["#sp1", 0.05], ["#sp2", 0.12], ["#sp3", 0.18]].forEach(([s, d]) => {
        tl.fromTo(s, { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.3, ease: SETTLE }, tThink + d);
        tl.to(s, { scale: 0, duration: 0.25, ease: "power2.in" }, tThink + 1.1 + d);
      });
      tl.to("#k-wink", { opacity: 0, duration: 0.04 }, tThink + 0.6);
      tl.to("#k-eyeR-lid", { scaleY: 1, duration: 0.14, ease: SETTLE }, tThink + 0.6);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
